<script>/* js/mg/flappy.js */
'use strict';
/* FLAPPY BIRRET – leć przez bramkę z właściwą odpowiedzią. */
class Flappy extends MG {
  start() {
    const ch = this.ch, S = this.S, W = this.W, H = this.H;
    S.prompt({ lead: `${ch.tag} · ${ch.lead}`, text: ch.prompt });
    S.controls([{ label: '▲ MACHNIJ', key: 'up', cls: 'wide' }]);
    this.groundY = H - 28;
    const n = ch.options.length;
    const total = this.groundY - 6;
    this.gh = Math.min(n === 2 ? 130 : 108, total / (n + 0.38 * (n + 1)));
    const wall = (total - n * this.gh) / (n + 1);
    this.gaps = ch.options.map((label, i) => ({ y: 6 + wall + i * (this.gh + wall), h: this.gh, label }));
    this.lw = W >= 400 ? 158 : 184;
    this.hover = H * 0.46;
    this.b = { x: Math.round(W * 0.21), y: this.hover, vy: 0, rot: 0 };
    this.gx = W + 40; this.gw = 34;
    this.vx = 44 * this.speed;
    this.scroll = 0; this.chosen = -1; this.crashed = false; this.flapped = false;
    this.stars = Array.from({ length: 26 }, () => [U.ri(0, W), U.ri(4, Math.round(H * 0.6)), Math.random()]);
  }
  key(k, down) { if (down && (k === 'up' || k === 'enter')) this.flap(); }
  pointer(type) { if (type === 'down') this.flap(); }
  flap() {
    if (this.done || this.chosen >= 0) return;
    this.flapped = true;
    this.b.vy = -205;
    this.S.sfx('flap');
  }
  choose() {
    const b = this.b;
    let best = 0, bd = 1e9;
    this.gaps.forEach((g, i) => { const d = Math.abs(b.y - (g.y + g.h / 2)); if (d < bd) { bd = d; best = i; } });
    this.chosen = best;
    if (best !== this.ch.answer) {
      this.crashed = true; b.vy = -180;
      this.S.sfx('bad'); this.S.shake(6); this.S.flash(PAL.r, 0.12);
      this.S.burst(b.x, b.y, [PAL.y, PAL.w, PAL.o], 22);
      this.end({ ok: false, your: this.ch.options[best], right: this.ch.options[this.ch.answer], fix: this.ch.fix }, 1.1);
    }
  }
  update(dt) {
    super.update(dt);
    const b = this.b;
    if (!this.crashed) this.gx -= this.vx * dt;
    this.scroll += this.vx * dt * (this.crashed ? 0.2 : 1);
    if (this.chosen < 0) {
      if (this.flapped) { b.vy = Math.min(b.vy + 600 * dt, 300); b.y += b.vy * dt; }
      else b.y = this.hover + Math.sin(this.t * 5) * 6;
      if (b.y < 10) { b.y = 10; b.vy = 0; }
      if (b.y > this.groundY - 10) { b.y = this.groundY - 10; b.vy = -170; this.S.sfx('bump'); }
      b.rot = U.clamp(b.vy / 500, -0.5, 0.9);
      if (this.gx <= b.x + 10) this.choose();
    } else if (!this.crashed) {
      const g = this.gaps[this.chosen];
      b.y += (g.y + g.h / 2 - b.y) * Math.min(1, dt * 10);
      b.rot *= 0.9;
      if (this.gx + this.gw < b.x - 14 && !this.done) {
        this.S.sfx('ok');
        this.S.burst(b.x, b.y, [PAL.y, PAL.g, PAL.w], 18);
        this.S.float('DOBRZE!', b.x + 50, b.y - 24, PAL.g, 16);
        this.end({ ok: true }, 0.55);
      }
    } else {
      b.vy += 700 * dt; b.y = Math.min(this.groundY - 8, b.y + b.vy * dt); b.x -= 30 * dt; b.rot += dt * 8;
    }
  }
  draw(c) {
    const W = this.W, H = this.H, gy = this.groundY;
    const bands = ['#0f2233', '#112739', '#132c40', '#163347', '#193a4f', '#1c4156'];
    const bh = Math.ceil(H / bands.length);
    bands.forEach((col, i) => { c.fillStyle = col; c.fillRect(0, i * bh, W, bh + 1); });
    for (const [x, y, p] of this.stars) { c.fillStyle = (Math.sin(this.t * 3 + p * 9) > 0.6) ? PAL.w : '#5c7a8a'; c.fillRect(x, y, 2, 2); }
    const off = -(this.scroll * 0.2) % 160;
    c.fillStyle = '#0b1b27';
    for (let x = off - 160; x < W + 160; x += 160) {
      c.fillRect(x, gy - 82, 70, 90); c.fillRect(x + 10, gy - 122, 12, 40); c.fillRect(x + 40, gy - 107, 10, 25);
      c.fillRect(x + 80, gy - 62, 60, 70); c.fillRect(x + 100, gy - 96, 8, 34);
    }
    c.fillStyle = 'rgba(180,200,210,.12)';
    for (let x = off - 160; x < W + 160; x += 160) c.fillRect(x + 8 + Math.sin(this.t + x) * 3, gy - 140 - (this.t * 10 % 20), 16, 12);
    const off2 = -(this.scroll * 0.5) % 90;
    c.fillStyle = '#0f2a22';
    for (let x = off2 - 90; x < W + 90; x += 90) { c.fillRect(x, gy - 34, 60, 40); c.fillRect(x + 10, gy - 46, 40, 12); }
    // bramka
    const gx = Math.round(this.gx), gw = this.gw;
    const segs = [];
    let top = 0;
    for (const g of this.gaps) { segs.push([top, g.y]); top = g.y + g.h; }
    segs.push([top, gy]);
    for (const [y0, y1] of segs) {
      if (y1 - y0 < 1) continue;
      c.fillStyle = PAL.k; c.fillRect(gx - 2, y0, gw + 4, y1 - y0);
      c.fillStyle = PAL.G; c.fillRect(gx, y0, gw, y1 - y0);
      c.fillStyle = PAL.g; c.fillRect(gx + 4, y0, 8, y1 - y0);
      c.fillStyle = '#9be23a'; c.fillRect(gx + 6, y0, 3, y1 - y0);
      if (y0 > 0) { c.fillStyle = PAL.k; c.fillRect(gx - 5, y0, gw + 10, 7); c.fillStyle = PAL.g; c.fillRect(gx - 3, y0 + 1, gw + 6, 5); }
      if (y1 < gy) { c.fillStyle = PAL.k; c.fillRect(gx - 5, y1 - 7, gw + 10, 7); c.fillStyle = PAL.g; c.fillRect(gx - 3, y1 - 6, gw + 6, 5); }
    }
    // etykiety bramek (przypięte do prawej krawędzi, aż bramka nadleci)
    const lw = this.lw;
    const cx = Math.min(gx + gw / 2, W - lw / 2 - 4);
    this.gaps.forEach((g, i) => {
      const lh = Math.min(g.h - 12, 72);
      let fill = PAL.w;
      if (this.chosen >= 0) {
        if (i === this.ch.answer) fill = '#9be23a';
        else if (i === this.chosen) fill = '#ff6b6b';
      }
      pxbox(c, cx - lw / 2, g.y + (g.h - lh) / 2, lw, lh, fill);
      TXT.box(c, g.label, cx, g.y + g.h / 2, lw - 12, lh - 6, { sizes: [15, 14, 13, 12, 11, 10, 9] });
    });
    c.fillStyle = '#3a2a1e'; c.fillRect(0, gy, W, H - gy);
    c.fillStyle = PAL.g; c.fillRect(0, gy, W, 4);
    c.fillStyle = '#2a1e15';
    const off3 = -(this.scroll % 16);
    for (let x = off3; x < W; x += 16) c.fillRect(x, gy + 10, 8, 3);
    const b = this.b;
    SPR.draw(c, 'bird', b.x - 12, b.y - 10, 2, { rot: b.rot });
    if (!this.flapped && !this.done) TXT.line(c, 'TAPNIJ / SPACJA', b.x + 8, b.y + 16, { size: 10, align: 'center', color: PAL.y, shadow: PAL.k });
  }
}
Flappy.intro = { title: 'LEĆ!', hint: 'Spacja / tapnij = machnij · wleć w bramkę z dobrą odpowiedzią' };
MINIGAMES.flappy = Flappy;

</script>
<script>/* js/mg/drwal.js */
'use strict';
/* DRWAL PRAWDY (Timberman) – rąb z lewej = FAŁSZ, z prawej = PRAWDA. */
class Drwal extends MG {
  start() {
    this.items = this.ch.items;
    this.i = 0;
    this.per = U.clamp(11 / this.speed, 5.5, 13);
    this.left = this.per;
    this.side = 1; this.swing = 0; this.drop = 0; this.squash = false;
    this.flying = [];
    this.cx = this.W / 2;
    this.gy = this.H - 50;
    this.reach = this.W >= 400 ? 70 : 62;
    this.deco = Array.from({ length: 20 }, () => U.pick([-1, 0, 1, 0, 0]));
    this.S.controls([{ label: '◀ FAŁSZ', key: 'left', cls: 'bad' }, { label: 'PRAWDA ▶', key: 'right', cls: 'good' }]);
    this.show();
  }
  show() {
    this.S.prompt({ lead: `${this.ch.tag} · Prawda czy fałsz? ${this.i + 1}/${this.items.length}`, text: this.items[this.i].s });
  }
  key(k, down) {
    if (!down || this.done) return;
    if (k === 'left') this.answer(false);
    if (k === 'right') this.answer(true);
  }
  pointer(type, x) { if (type === 'down') this.answer(x >= this.cx); }
  answer(v) {
    if (this.done) return;
    const it = this.items[this.i];
    this.side = v ? 1 : -1; this.swing = 0.2;
    if (v === it.v) {
      this.S.sfx('chop');
      this.flying.push({ x: this.cx, y: this.gy - 36, vx: -this.side * 280, vy: -160, rot: 0 });
      this.S.float(v ? 'PRAWDA ✓' : 'FAŁSZ ✓', this.cx + this.side * (this.reach + 20), this.gy - 130, PAL.g, 13);
      this.S.burst(this.cx + this.side * 30, this.gy - 20, ['#8a5a32', '#c98260', PAL.y], 10, 90);
      this.i++; this.drop = 1;
      if (this.i >= this.items.length) {
        this.S.sfx('ok');
        this.S.burst(this.cx, this.H / 2, [PAL.g, PAL.y, PAL.w], 26);
        this.end({ ok: true }, 0.6);
      } else { this.left = this.per; this.show(); }
    } else {
      this.squash = true;
      this.S.sfx('bad'); this.S.shake(7); this.S.flash(PAL.r, 0.15);
      this.end({ ok: false, your: v ? 'PRAWDA' : 'FAŁSZ', right: `${it.v ? 'PRAWDA' : 'FAŁSZ'} – „${it.s}”`, fix: it.fix }, 1.0);
    }
  }
  update(dt) {
    super.update(dt);
    if (this.swing > 0) this.swing -= dt;
    this.drop = Math.max(0, this.drop - dt * 7);
    for (const f of this.flying) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 700 * dt; f.rot += dt * 9 * Math.sign(f.vx); }
    this.flying = this.flying.filter(f => f.y < this.H + 40);
    if (!this.done) {
      this.left -= dt;
      if (this.left <= 0) {
        const it = this.items[this.i];
        this.squash = true;
        this.S.sfx('bad'); this.S.shake(5);
        this.end({ ok: false, timeout: true, right: `${it.v ? 'PRAWDA' : 'FAŁSZ'} – „${it.s}”`, fix: it.fix }, 1.0);
      }
    }
  }
  segment(c, x, y, w, h, deco, current) {
    c.fillStyle = PAL.k; c.fillRect(x - 2, y, w + 4, h);
    c.fillStyle = '#8a5a32'; c.fillRect(x, y, w, h);
    c.fillStyle = '#6b4424'; c.fillRect(x + 8, y + 4, 4, h - 8); c.fillRect(x + 30, y + 10, 4, h - 14); c.fillRect(x + 46, y + 2, 3, h - 10);
    c.fillStyle = '#a8724a'; c.fillRect(x + 2, y, 4, h);
    if (deco) {
      const bx = deco < 0 ? x - 34 : x + w;
      c.fillStyle = PAL.k; c.fillRect(bx - 1, y + 10, 36, 10);
      c.fillStyle = '#6b4424'; c.fillRect(bx, y + 11, 34, 8);
      c.fillStyle = PAL.G; c.fillRect(deco < 0 ? bx - 6 : bx + 26, y + 2, 14, 12);
    }
    if (current) {
      pxbox(c, x + 12, y + 8, w - 24, h - 16, PAL.y);
      TXT.box(c, '?', x + w / 2, y + h / 2, w - 28, h - 20, { sizes: [16], weight: 700 });
    }
  }
  draw(c) {
    const W = this.W, H = this.H, gy = this.gy, cx = this.cx;
    const bands = ['#1d3b4f', '#22445a', '#284e66', '#2e5872', '#35637d'];
    const bh = Math.ceil(H / bands.length);
    bands.forEach((col, i) => { c.fillStyle = col; c.fillRect(0, i * bh, W, bh + 1); });
    c.fillStyle = '#f6e7b0'; c.fillRect(W - 80, 30, 30, 30); c.fillStyle = '#35637d'; c.fillRect(W - 68, 30, 18, 12);
    c.fillStyle = '#16382a';
    for (let x = -20; x < W + 20; x += 44) { c.fillRect(x + 14, gy - 80, 16, 80); c.fillRect(x + 4, gy - 64, 36, 20); c.fillRect(x + 8, gy - 78, 28, 14); }
    c.fillStyle = '#3a2a1e'; c.fillRect(0, gy, W, H - gy);
    c.fillStyle = PAL.g; c.fillRect(0, gy, W, 4);
    const w = 64, x = cx - w / 2, h = 36;
    const remaining = this.items.length - this.i;
    const off = this.drop * h;
    for (let k = 0; k < remaining + 12; k++) {
      const y = gy - 36 - k * h - off;
      if (y < -h) break;
      this.segment(c, x, y, w, h, k === 0 ? 0 : this.deco[(this.i + k) % this.deco.length], k === 0 && !this.done && remaining > 0);
    }
    c.fillStyle = PAL.k; c.fillRect(x - 6, gy - 2, w + 12, 6);
    for (const f of this.flying) {
      c.save(); c.translate(f.x, f.y); c.rotate(f.rot);
      this.segment(c, -w / 2, -h / 2, w, h, 0, false);
      c.restore();
    }
    const px = cx + this.side * this.reach;
    const flip = this.side > 0;
    if (this.squash) {
      c.save(); c.translate(px, gy); c.scale(1.4, 0.35);
      SPR.drawC(c, 'student', 0, 0, 3, { flip });
      c.restore();
      c.fillStyle = PAL.k; c.fillRect(px - 40, gy - 36, 80, 14); c.fillStyle = '#6b4424'; c.fillRect(px - 38, gy - 34, 76, 10);
    } else {
      SPR.drawC(c, 'student', px, gy, 3, { flip });
      const a = this.swing > 0 ? -1.2 + (0.2 - this.swing) * 10 : -0.4;
      c.save(); c.translate(px - this.side * 10, gy - 36); c.rotate(this.side * -a);
      c.fillStyle = '#6b4424'; c.fillRect(-this.side * 2 - 2, -30, 4, 30);
      c.fillStyle = PAL.l; c.fillRect(this.side > 0 ? -14 : 2, -34, 12, 10);
      c.restore();
    }
    const sw = Math.min(110, W * 0.32);
    pxbox(c, 8, H - 38, sw, 30, '#ff6b6b');
    TXT.box(c, '◀ FAŁSZ', 8 + sw / 2, H - 23, sw - 10, 24, { sizes: [13, 12, 11] });
    pxbox(c, W - 8 - sw, H - 38, sw, 30, '#9be23a');
    TXT.box(c, 'PRAWDA ▶', W - 8 - sw / 2, H - 23, sw - 10, 24, { sizes: [13, 12, 11] });
    this.S.timerBar(c, this.left / this.per);
  }
}
Drwal.intro = { title: 'RĄB!', hint: '← / lewa połowa = FAŁSZ · → / prawa połowa = PRAWDA' };
MINIGAMES.tf = Drwal;

</script>
<script>/* js/mg/wieza.js */
'use strict';
/* WIEŻA (Icy Tower / Doodle Jump) – skacz po platformach w dobrej kolejności. */
class Wieza extends MG {
  start() {
    const ch = this.ch, W = this.W, H = this.H;
    this.gap = 74; this.baseY = H - 28;
    this.ph = W >= 400 ? 26 : 36;
    this.plats = [{ x: 0, w: W, h: 28, y: this.baseY, row: 0, ground: true, state: 'ok', label: 'START' }];
    ch.rows.forEach((r, i) => {
      const n = r.opts.length;
      const slots = U.shuffle(n === 2 ? [W * 0.27, W * 0.73] : [W * 0.175, W * 0.5, W * 0.825]);
      const pw = n === 2 ? W * 0.39 : W * 0.3;
      r.opts.forEach((label, j) => this.plats.push({
        x: slots[j] - pw / 2 + U.ri(-4, 4), w: pw, h: this.ph, y: this.baseY - (i + 1) * this.gap,
        row: i + 1, label, correct: j === r.ans, state: 'idle', vy: 0,
      }));
    });
    this.p = { x: W / 2, y: this.baseY, vx: 0, vy: -440, face: 1 };
    this.cur = 0;
    this.camY = this.targetCam();
    this.total = U.clamp(ch.rows.length * 10 / this.speed, 20, 70); this.left = this.total;
    this.inL = false; this.inR = false; this.fell = false;
    this.S.controls([{ label: '◀', key: 'left', cls: 'big' }, { label: '▶', key: 'right', cls: 'big' }]);
    this.updPrompt();
  }
  targetCam() { return (this.baseY - this.cur * this.gap) - (this.H - 68); }
  updPrompt() {
    const ch = this.ch;
    const got = ch.seq.slice(0, this.cur);
    const text = ch.mode === 'order' ? `Skacz w kolejności: ${ch.title}` : `Skacz tylko po elementach: ${ch.title}`;
    const sub = ch.mode === 'order' ? (got.length ? got.join(' → ') + ' → ?' : 'Start → ?') : (got.length ? '✓ ' + got.join(' · ') : '');
    this.S.prompt({ lead: `${ch.tag} · ${ch.mode === 'order' ? 'Kolejność' : 'Zbiór'} ${this.cur}/${ch.rows.length}`, text, sub });
  }
  key(k, down) { if (k === 'left') this.inL = down; if (k === 'right') this.inR = down; }
  pointer(type, x) {
    if (type === 'down') { if (x < this.W / 2) this.inL = true; else this.inR = true; }
    if (type === 'up') { this.inL = false; this.inR = false; }
  }
  rowAnswer(row) { return this.plats.find(p => p.row === row && p.correct); }
  fixText() {
    const ch = this.ch;
    return ch.mode === 'order' ? `Kolejność: ${ch.seq.join(' → ')}` : `Należą: ${ch.all.join(', ')}`;
  }
  update(dt) {
    super.update(dt);
    const p = this.p, W = this.W;
    if (!this.done) {
      this.left -= dt;
      if (this.left <= 0) {
        const r = this.rowAnswer(this.cur + 1);
        this.S.sfx('bad');
        this.end({ ok: false, timeout: true, right: r ? r.label : '', fix: this.fixText() }, 0.9);
      }
    }
    const ax = (this.inR ? 1 : 0) - (this.inL ? 1 : 0);
    p.vx += (ax * 190 - p.vx) * Math.min(1, dt * 10);
    if (ax) p.face = ax;
    p.x += p.vx * dt;
    if (p.x < -10) p.x += W + 20;
    if (p.x > W + 10) p.x -= W + 20;
    const prev = p.y;
    p.vy = Math.min(p.vy + 950 * dt, 700);
    p.y += p.vy * dt;
    if (p.vy > 0 && !this.fell) {
      for (const pl of this.plats) {
        if (pl.state === 'broken') continue;
        if (pl.row !== this.cur && pl.row !== this.cur + 1) continue;
        if (prev <= pl.y && p.y >= pl.y && p.x + 7 > pl.x && p.x - 7 < pl.x + pl.w) {
          p.y = pl.y;
          if (pl.row === this.cur + 1 && !this.done) {
            if (pl.correct) {
              pl.state = 'ok'; this.cur++; p.vy = -440;
              this.S.sfx('coin');
              this.S.burst(p.x, pl.y - this.camY, [PAL.g, PAL.y], 10);
              this.updPrompt();
              if (this.cur === this.ch.rows.length) {
                this.S.sfx('ok');
                this.S.float('KOMPLET!', W / 2, 90, PAL.g, 18);
                this.S.burst(W / 2, 120, [PAL.g, PAL.y, PAL.w], 28);
                this.end({ ok: true }, 0.8);
              }
            } else {
              pl.state = 'broken'; this.fell = true; p.vy = 40;
              this.S.sfx('bad'); this.S.shake(6);
              const r = this.rowAnswer(pl.row);
              this.end({ ok: false, your: pl.label, right: r ? r.label : '', fix: this.fixText() }, 1.2);
            }
          } else { p.vy = -440; this.S.sfx('jump'); }
          break;
        }
      }
    }
    for (const pl of this.plats) if (pl.state === 'broken') { pl.vy += 600 * dt; pl.y += pl.vy * dt; }
    this.camY += (this.targetCam() - this.camY) * Math.min(1, dt * 4);
  }
  draw(c) {
    const cam = this.camY, W = this.W, H = this.H;
    c.fillStyle = '#2a1d33'; c.fillRect(0, 0, W, H);
    const bo = -(cam * 0.5) % 20;
    for (let y = bo - 20; y < H; y += 20) {
      const row = Math.floor((y - bo + cam * 0.5) / 20);
      for (let x = (row % 2 ? -20 : 0); x < W; x += 40) {
        c.fillStyle = '#34253f'; c.fillRect(x + 1, y + 1, 38, 18);
        c.fillStyle = '#3d2c4a'; c.fillRect(x + 1, y + 1, 38, 3);
      }
    }
    c.fillStyle = '#1a1222'; c.fillRect(0, 0, 8, H); c.fillRect(W - 8, 0, 8, H);
    for (const pl of this.plats) {
      const y = pl.y - cam;
      if (y < -40 || y > H + 30) continue;
      if (pl.ground) {
        c.fillStyle = '#3a2a1e'; c.fillRect(0, y, W, 40);
        c.fillStyle = PAL.g; c.fillRect(0, y, W, 4);
        TXT.line(c, 'START', W / 2, y + 10, { size: 10, align: 'center', color: PAL.l });
        continue;
      }
      const next = pl.row === this.cur + 1;
      const future = pl.row > this.cur + 1;
      c.globalAlpha = future ? 0.5 : 1;
      let fill = PAL.w;
      if (pl.state === 'ok') fill = '#9be23a';
      if (pl.state === 'broken') fill = '#ff6b6b';
      if (next && !this.done) {
        c.fillStyle = (Math.sin(this.t * 6) > 0) ? PAL.y : PAL.o;
        c.fillRect(pl.x - 3, y - 3, pl.w + 6, pl.h + 6);
      }
      pxbox(c, pl.x, y, pl.w, pl.h, fill);

      c.globalAlpha = 1;
    }
    const p = this.p;
    const st = U.clamp(1 - p.vy / 1400, 0.8, 1.2);
    c.save(); c.translate(p.x, p.y - cam); c.scale(1 / st, st);
    SPR.drawC(c, 'student', 0, 0, 2, { flip: p.face < 0 });
    c.restore();
    this.S.timerBar(c, this.left / this.total);
    pxbox(c, W - 48, H - 28, 42, 22, PAL.k, PAL.y);

<script>/* js/mg/tasma.js */
'use strict';
/* TAŚMA SORTOWNIA – przydziel skrzynki z taśmy do właściwych pojemników. */
class Tasma extends MG {
  start() {
    const ch = this.ch, W = this.W, H = this.H;
    this.nb = ch.cats.length;
    this.grid = W < 400 && this.nb >= 4;
    this.cw = this.grid ? 170 : 120;
    this.chh = this.grid ? 44 : 34;
    this.beltY = this.grid ? Math.round(H * 0.32) : 130;
    const cols = ['#e0a458', '#29adff', '#ff77a8', '#9be23a', '#ffd23a'];
    const gap = this.grid ? 16 : 6;
    const ncol = this.grid ? 2 : this.nb;
    const nrow = Math.ceil(this.nb / ncol);
    const top = this.grid ? this.beltY + 70 : H - Math.max(104, Math.round(H * 0.36)) - 6;
    const bw = (W - 12 - 6 * (ncol - 1)) / ncol;
    const bh = (H - 6 - top - gap * (nrow - 1)) / nrow;
    this.bins = ch.cats.map((label, i) => {
      const r = Math.floor(i / ncol), cI = i % ncol;
      const inRow = Math.min(ncol, this.nb - r * ncol);
      const off = (ncol - inRow) * (bw + 6) / 2;
      return { x: 6 + off + cI * (bw + 6), y: top + r * (bh + gap), w: bw, h: bh, label, col: cols[i % cols.length], n: 0, ok: 0, bad: 0 };
    });
    this.items = ch.items.map((it, i) => ({ t: it.t, c: it.c, x: 30 - i * (this.cw + 30), y: this.beltY - this.chh, state: 'belt', f: 0 }));
    this.beltV = 24 * this.speed;
    this.mist = 0;
    this.allowed = ch.items.length >= 6 ? 1 : 0;
    this.errors = [];
    this.scroll = 0;
    this.S.prompt({ lead: `${ch.tag} · Sortowanie`, text: ch.title, sub: 'Tapnij pojemnik albo wciśnij jego numer.' });
    this.S.controls(ch.cats.map((c, i) => ({ label: String(i + 1), key: 'n' + (i + 1), cls: 'num' })));
  }
  active() { return this.items.find(i => i.state === 'belt'); }
  key(k, down) {
    if (!down || this.done) return;
    const m = /^n(\d)$/.exec(k);
    if (m) { const i = +m[1] - 1; if (i < this.nb) this.send(i); }
  }
  pointer(type, x, y) {
    if (type !== 'down' || this.done) return;
    const b = this.bins.findIndex(b => x >= b.x && x <= b.x + b.w && y >= b.y - 12 && y <= b.y + b.h);
    if (b >= 0) this.send(b);
  }
  send(i) {
    const it = this.active();
    if (!it) return;
    it.state = 'fly'; it.f = 0; it.from = { x: it.x + this.cw / 2, y: it.y + this.chh / 2 };
    const b = this.bins[i];
    it.to = { x: b.x + b.w / 2, y: b.y + Math.min(30, b.h / 2) }; it.bin = i;
    this.S.sfx('click');
  }
  land(it) {
    const b = this.bins[it.bin];
    b.n++;
    it.state = 'in';
    if (it.bin === it.c) {
      b.ok = 0.4;
      this.S.sfx('drop');
      this.S.float('✓', b.x + b.w / 2, b.y - 8, PAL.g, 16);
    } else {
      b.bad = 0.5;
      this.mist++;
      this.errors.push(`${it.t} → ${this.ch.cats[it.c]}`);
      this.S.sfx('bad'); this.S.shake(4);
      this.S.float('✗ ' + this.ch.cats[it.c], U.clamp(b.x + b.w / 2, 70, this.W - 70), b.y - 12, '#ff6b6b', 12);
      if (this.mist > this.allowed) this.fail();
    }
    this.check();
  }
  fail() {
    this.end({ ok: false, right: this.ch.items.map(i => `${i.t} → ${this.ch.cats[i.c]}`).join(' · '), your: this.errors.join(' · '), fix: `Twoje pomyłki: ${this.errors.join('; ')}` }, 1.1);
  }
  check() {
    if (this.done) return;
    if (this.items.every(i => i.state === 'in' || i.state === 'lost')) {
      if (this.mist <= this.allowed) {
        this.S.sfx('ok');
        this.S.burst(this.W / 2, this.H / 2, [PAL.g, PAL.y, PAL.w], 24);
        this.end({ ok: true, note: this.mist ? `1 pomyłka: ${this.errors[0]}` : null }, 0.6);
      } else this.fail();
    }
  }
  update(dt) {
    super.update(dt);
    for (const b of this.bins) { b.ok = Math.max(0, b.ok - dt); b.bad = Math.max(0, b.bad - dt); }
    const act = this.active();
    let v = this.beltV;
    if (act && act.x < 30) v += 170;
    if (!this.done) {
      this.scroll += v * dt;
      for (const it of this.items) if (it.state === 'belt') it.x += v * dt;
    }
    for (const it of this.items) {
      if (it.state === 'fly') {
        it.f += dt / 0.32;
        if (it.f >= 1) this.land(it);
      }
      if (it.state === 'belt' && it.x > this.W - 30 && !this.done) {
        it.state = 'lost'; this.mist++;
        this.errors.push(`${it.t} → ${this.ch.cats[it.c]} (spadło z taśmy)`);
        this.S.sfx('bad');
        this.S.float('Spadło! → ' + this.ch.cats[it.c], this.W / 2, this.beltY - 70, '#ff6b6b', 12);
        if (this.mist > this.allowed) this.fail(); else this.check();
      }
    }
  }
  crate(c, x, y, label, hi) {
    const w = this.cw, h = this.chh;
    if (hi) { c.fillStyle = (Math.sin(this.t * 8) > 0) ? PAL.y : PAL.o; c.fillRect(x - 3, y - 3, w + 6, h + 6); }
    pxbox(c, x, y, w, h, '#b07a44');
    c.fillStyle = '#8a5a32'; c.fillRect(x + 4, y + 4, 4, h - 8); c.fillRect(x + w - 8, y + 4, 4, h - 8);
    pxbox(c, x + 10, y + 4, w - 20, h - 8, PAL.w);
    TXT.box(c, label, x + w / 2, y + h / 2, w - 26, h - 12, { sizes: this.grid ? [14, 13, 12, 11, 10, 9] : [11, 10, 9, 8, 7] });
  }
  draw(c) {
    const W = this.W, H = this.H, by = this.beltY;
    const fy = Math.min(...this.bins.map(b => b.y)) - 18;
    c.fillStyle = '#1c2a33'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#22333e';
    for (let x = 0; x < W; x += 50) c.fillRect(x, 0, 24, fy);
    c.fillStyle = '#ffd23a'; for (let x = 0; x < W; x += 40) c.fillRect(x, fy - 4, 20, 4);
    c.fillStyle = PAL.k; c.fillRect(0, by, W, 20);
    c.fillStyle = '#3b4a52'; c.fillRect(0, by + 2, W, 14);
    c.fillStyle = '#56666e';
    const o = this.scroll % 20;
    for (let x = o - 20; x < W; x += 20) c.fillRect(x, by + 4, 10, 10);
    for (let x = 10; x < W; x += 40) { c.fillStyle = PAL.k; c.fillRect(x - 6, by + 20, 12, 12); c.fillStyle = PAL.m; c.fillRect(x - 4, by + 22, 8, 8); }
    c.fillStyle = '#4a2c18'; c.fillRect(W - 28, by - 4, 28, 30);
    TXT.line(c, '⚠', W - 14, by, { size: 12, align: 'center', color: PAL.y });
    const act = this.active();
    for (const it of this.items) {
      if (it.state === 'belt' && it.x > -this.cw - 5) {
        this.crate(c, Math.round(it.x), it.y, it.t, it === act);
        if (it === act) { const ax = it.x + this.cw / 2, ay = it.y - 26 + Math.sin(this.t * 8) * 3; c.fillStyle = PAL.y; c.fillRect(ax - 6, ay, 12, 8); c.fillRect(ax - 3, ay + 8, 6, 6); }
      }
      if (it.state === 'fly') {
        const f = it.f, x = U.lerp(it.from.x, it.to.x, f), y = U.lerp(it.from.y, it.to.y, f) - Math.sin(f * Math.PI) * 50;
        c.save(); c.translate(x, y); c.scale(1 - f * 0.4, 1 - f * 0.4);
        this.crate(c, -this.cw / 2, -this.chh / 2, it.t, false);
        c.restore();
      }
    }
    this.bins.forEach((b, i) => {
      const fill = b.ok > 0 ? '#9be23a' : b.bad > 0 ? '#ff6b6b' : b.col;
      pxbox(c, b.x, b.y, b.w, b.h, fill);
      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(b.x + 4, b.y + 4, b.w - 8, 10);
      pxbox(c, b.x + 4, b.y + 18, b.w - 8, b.h - 24, PAL.w);
      TXT.box(c, b.label, b.x + b.w / 2, b.y + 18 + (b.h - 24) / 2, b.w - 14, b.h - 30, { sizes: [14, 13, 12, 11, 10, 9, 8, 7] });
      pxbox(c, b.x + b.w / 2 - 9, b.y - 8, 18, 16, PAL.k, PAL.y);
      TXT.box(c, String(i + 1), b.x + b.w / 2, b.y, 14, 12, { sizes: [10], color: PAL.y });
    });
    TXT.line(c, `Pomyłki: ${this.mist}/${this.allowed + 1}`, 8, 6, { size: 11, color: this.mist ? '#ff6b6b' : PAL.l, shadow: PAL.k });
    const left = this.items.filter(i => i.state === 'belt' || i.state === 'fly').length;
    TXT.line(c, `Zostało: ${left}`, W - 8, 6, { size: 11, align: 'right', color: PAL.l, shadow: PAL.k });
  }
}
Tasma.intro = { title: 'SORTUJ!', hint: 'Tapnij pojemnik albo wciśnij jego numer (1–5)' };
MINIGAMES.sort = Tasma;

</script>
<script>/* js/mg/mlotek.js */
'use strict';
/* MŁOTEK JIDOKA (whac-a-mole) – wal tylko w krety z hasłami należącymi do zbioru. */
class Mlotek extends MG {
  start() {
    const ch = this.ch;
    const W = this.W, H = this.H;
    this.holes = [];
    if (H >= 420) {
      this.sw = Math.min(150, W * 0.46);
      for (const fy of [0.4, 0.64, 0.88]) for (const fx of [0.27, 0.73]) this.holes.push({ x: Math.round(W * fx), y: Math.round(H * fy) });
    } else {
      this.sw = Math.min(120, W / 3 - 8);
      for (const y of [H - 134, H - 30]) for (const fx of [0.175, 0.5, 0.825]) this.holes.push({ x: Math.round(W * fx), y });
    }
    this.queue = ch.items.slice();
    this.moles = [];
    this.spawnT = 0.3;
    this.popEvery = 1.35 / this.speed;
    this.up = U.clamp(3.1 / this.speed, 1.8, 3.4);
    this.mist = 0;
    this.allowed = ch.items.length >= 7 ? 1 : 0;
    this.errors = [];
    this.hammer = null;
    this.S.prompt({ lead: `${ch.tag} · Zbiór`, text: `WALNIJ tylko: ${ch.title}`, sub: 'Intruzów nie ruszaj. Przegapienie pasującego = pomyłka.' });
    this.S.controls([]);
  }
  key(k, down) {
    if (!down || this.done) return;
    const m = /^n(\d)$/.exec(k);
    if (m) { const mole = this.moles.find(o => o.hole === +m[1] - 1 && o.state === 'up'); if (mole) this.whack(mole); }
  }
  pointer(type, x, y) {
    if (type !== 'down' || this.done) return;
    const mole = this.moles.find(o => {
      if (o.state !== 'up') return false;
      const h = this.holes[o.hole];
      return x > h.x - this.sw / 2 - 2 && x < h.x + this.sw / 2 + 2 && y > h.y - 86 && y < h.y + 8;
    });
    if (mole) this.whack(mole);
    else this.hammer = { x, y, t: 0.18 };
  }
  whack(m) {
    const h = this.holes[m.hole];
    m.hit = true; m.state = 'down';
    this.hammer = { x: h.x + 20, y: h.y - 40, t: 0.2 };
    if (m.it.ok) {
      this.S.sfx('whack'); this.S.sfx('coin');
      this.S.burst(h.x, h.y - 30, [PAL.y, PAL.w, PAL.g], 12);
      this.S.float('+', h.x, h.y - 70, PAL.g, 18);
    } else {
      this.mist++;
      this.errors.push(`„${m.it.t}” – to intruz`);
      this.S.sfx('bad'); this.S.shake(4);
      this.S.float('✗ INTRUZ', h.x, h.y - 70, '#ff6b6b', 12);
      this.checkFail();
    }
  }
  checkFail() {
    if (this.mist > this.allowed && !this.done) {
      this.end({ ok: false, your: this.errors.join('; '), right: `Należą: ${this.ch.all.join(', ')}`, fix: `${this.ch.title}: ${this.ch.all.join(', ')}` }, 1.1);
    }
  }
  update(dt) {
    super.update(dt);
    if (this.hammer) { this.hammer.t -= dt; if (this.hammer.t <= 0) this.hammer = null; }
    if (!this.done) {
      this.spawnT -= dt;
      const live = this.moles.filter(m => m.state === 'up');
      if (this.spawnT <= 0 && this.queue.length && live.length < 2) {
        const free = this.holes.map((_, i) => i).filter(i => !this.moles.some(m => m.hole === i));
        if (free.length) {
          this.moles.push({ hole: U.pick(free), it: this.queue.shift(), t: 0, h: 0, state: 'up', hit: false });
          this.spawnT = this.popEvery;
        }
      }
    }
    for (const m of this.moles) {
      m.t += dt;
      if (m.state === 'up') {
        m.h = Math.min(1, m.h + dt * 6);
        if (m.t > this.up && !this.done) {
          m.state = 'down';
          const h = this.holes[m.hole];
          if (m.it.ok && !m.hit) {
            this.mist++;
            this.errors.push(`przegapione: „${m.it.t}”`);
            this.S.sfx('bad');
            this.S.float('Przegapione!', h.x, h.y - 70, '#ff6b6b', 11);
            this.checkFail();
          } else if (!m.it.ok) this.S.float('✓ ok', h.x, h.y - 70, PAL.g, 10);
        }
      } else m.h = Math.max(0, m.h - dt * 6);
    }
    this.moles = this.moles.filter(m => !(m.state === 'down' && m.h <= 0));
    if (!this.done && !this.queue.length && !this.moles.length) {
      if (this.mist <= this.allowed) {
        this.S.sfx('ok'); this.S.burst(this.W / 2, this.H / 2, [PAL.g, PAL.y], 24);
        this.end({ ok: true, note: this.mist ? this.errors[0] : null }, 0.6);
      } else this.checkFail();
    }
  }
  draw(c) {
    const W = this.W, H = this.H, sw = this.sw;
    c.fillStyle = '#1f5a2e'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#246636';
    for (let y = 8; y < H; y += 22) for (let x = (y % 44 ? 0 : 11); x < W; x += 22) c.fillRect(x, y, 4, 4);
    c.fillStyle = '#16432a'; c.fillRect(0, 0, W, 40);
    this.holes.forEach((h, i) => {
      c.fillStyle = '#12301f'; c.fillRect(h.x - 44, h.y - 8, 88, 18);
      c.fillStyle = PAL.k; c.fillRect(h.x - 38, h.y - 6, 76, 12);
      TXT.line(c, String(i + 1), h.x - 50, h.y - 4, { size: 9, color: '#7bd18f' });
    });
    for (const m of this.moles) {
      const h = this.holes[m.hole];
      const rise = m.h * 38;
      c.save();
      c.beginPath(); c.rect(h.x - 60, h.y - 120, 120, 120); c.clip();
      SPR.drawC(c, 'mole', h.x, h.y + 38 - rise + (m.hit ? 6 : 0), 3, { alpha: 1 });
      c.restore();
      if (m.h > 0.6 && m.state === 'up') {
        const sy = h.y - rise - 34;
        pxbox(c, h.x - sw / 2, sy - 8, sw, 38, m.hit ? '#9be23a' : PAL.w);
        TXT.box(c, m.it.t, h.x, sy + 11, sw - 8, 32, { sizes: [13, 12, 11, 10, 9, 8] });
      }
      c.fillStyle = PAL.k; c.fillRect(h.x - 44, h.y + 4, 88, 8);
    }
    if (this.hammer) {
      const hm = this.hammer, a = hm.t * 6;
      c.save(); c.translate(hm.x, hm.y); c.rotate(-a);
      c.fillStyle = '#6b4424'; c.fillRect(-3, -4, 6, 34);
      c.fillStyle = PAL.k; c.fillRect(-15, -16, 30, 16); c.fillStyle = PAL.l; c.fillRect(-13, -14, 26, 12);
      c.restore();
    }
    TXT.line(c, `Pomyłki: ${this.mist}/${this.allowed + 1}`, 8, 8, { size: 10, color: this.mist ? '#ff6b6b' : '#bfe8c9', shadow: PAL.k });
    TXT.line(c, `W kolejce: ${this.queue.length}`, W - 8, 8, { size: 10, align: 'right', color: '#bfe8c9', shadow: PAL.k });
  }
}
Mlotek.intro = { title: 'WALNIJ!', hint: 'Tapnij (albo 1–6) tylko krety z pasującymi hasłami' };
MINIGAMES.whac = Mlotek;

</script>
<script>/* js/mg/bomba.js */
'use strict';
/* McBOMBA (McPixel) – rozbrój bombę, klikając przedmiot z właściwą odpowiedzią. */
class Bomba extends MG {
  start() {
    const ch = this.ch, n = ch.options.length, W = this.W, H = this.H;
    this.lw = Math.min(148, W * 0.46);
    const lx = Math.round(W * 0.26), rx = Math.round(W * 0.74);
    let pos;
    if (H >= 420) pos = n === 4 ? [[lx, H * 0.3], [rx, H * 0.3], [lx, H * 0.8], [rx, H * 0.8]] : n === 3 ? [[lx, H * 0.3], [rx, H * 0.3], [W / 2, H * 0.84]] : [[lx, H * 0.45], [rx, H * 0.45]];
    else pos = n === 4 ? [[lx, 118], [rx, 118], [lx, 236], [rx, 236]] : n === 3 ? [[lx, 122], [rx, 122], [W / 2, 250]] : [[lx, 150], [rx, 150]];
    const sprites = U.sample(['ext', 'bucket', 'cat', 'toilet', 'duck', 'wrench'], n);
    this.objs = ch.options.map((label, i) => ({ x: pos[i][0], y: pos[i][1], spr: sprites[i], label, bob: Math.random() * 6 }));
    this.bomb = H >= 420 ? { x: W / 2, y: H * (n === 3 ? 0.56 : 0.55) } : n === 3 ? { x: W / 2, y: 150 } : { x: W / 2, y: 176 };
    this.floorY = H >= 420 ? Math.round(H * 0.62) : 200;
    this.fuse = U.clamp(14 / this.speed, 8, 16); this.left = this.fuse;
    this.state = 'arm';
    this.S.prompt({ lead: `${ch.tag} · ${ch.lead}`, text: ch.prompt });
    this.S.controls(ch.options.map((o, i) => ({ label: String(i + 1), key: 'n' + (i + 1), cls: 'num' })));
  }
  key(k, down) {
    if (!down || this.done) return;
    const m = /^n(\d)$/.exec(k);
    if (m && +m[1] <= this.objs.length) this.choose(+m[1] - 1);
  }
  pointer(type, x, y) {
    if (type !== 'down' || this.done) return;
    const i = this.objs.findIndex(o => x > o.x - this.lw / 2 - 2 && x < o.x + this.lw / 2 + 2 && y > o.y - 40 && y < o.y + 46);
    if (i >= 0) this.choose(i);
  }
  choose(i) {
    const o = this.objs[i];
    if (i === this.ch.answer) {
      this.state = 'safe';
      this.S.sfx('ok'); setTimeout(() => this.S.sfx('coin'), 120);
      this.S.burst(this.bomb.x, this.bomb.y, [PAL.g, PAL.y, PAL.p, PAL.b, PAL.w], 34, 160);
      this.S.float('ROZBROJONE!', this.W / 2, this.bomb.y - 100, PAL.g, 18);
      this.S.float(U.pick(Bomba.WIN), this.W / 2, this.bomb.y - 78, PAL.w, 11);
      this.end({ ok: true }, 0.9);
    } else {
      this.boom(o.label);
    }
  }
  boom(label) {
    this.state = 'boom';
    this.S.sfx('boom'); this.S.shake(10, 0.5); this.S.flash('#fff3b0', 0.3);
    this.S.burst(this.bomb.x, this.bomb.y, [PAL.o, PAL.y, PAL.r, PAL.k, PAL.w], 60, 220);
    this.S.float('BUM!', this.W / 2, this.bomb.y - 90, PAL.o, 26);
    this.S.float(label ? U.pick(Bomba.LOSE).replace('X', label.length > 22 ? label.slice(0, 20) + '…' : label) : 'Czas minął…', this.W / 2, this.bomb.y - 58, PAL.w, 10);
    this.end({ ok: false, timeout: !label, your: label || null, right: this.ch.options[this.ch.answer], fix: this.ch.fix }, 1.3);
  }
  update(dt) {
    super.update(dt);
    if (this.state === 'arm' && !this.done) {
      const before = Math.ceil(this.left);
      this.left -= dt;
      if (Math.ceil(this.left) !== before && this.left < 4) this.S.sfx('tick');
      if (this.left <= 0) this.boom(null);
    }
  }
  draw(c) {
    // pokój
    const W = this.W, H = this.H, fl = this.floorY;
    c.fillStyle = '#3b2f4a'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#433556';
    for (let x = 0; x < W; x += 24) c.fillRect(x, 0, 12, fl);
    c.fillStyle = '#5a4a32'; c.fillRect(0, fl, W, H - fl);
    c.fillStyle = '#4c3e2a';
    for (let y = fl + 6; y < H; y += 14) for (let x = (y % 28 ? 0 : 20); x < W; x += 40) c.fillRect(x, y, 30, 2);
    c.fillStyle = PAL.k; c.fillRect(0, fl - 4, W, 6);
    // lont
    const b = this.bomb, frac = U.clamp(this.left / this.fuse, 0, 1);
    const pts = [];
    const up = Math.min(90, b.y - 40);
    for (let i = 0; i <= 24; i++) { const t = i / 24; pts.push([b.x + 12 + Math.sin(t * 9) * 14 * (1 - t) + t * 30, b.y - 26 - t * up]); }
    const visible = Math.max(1, Math.round(frac * 24));
    c.fillStyle = '#c9b48a';
    for (let i = 0; i < visible; i++) c.fillRect(pts[i][0] - 1, pts[i][1] - 1, 3, 3);
    if (this.state === 'arm') {
      const [sx, sy] = pts[visible - 1];
      c.fillStyle = (Math.sin(this.t * 30) > 0) ? PAL.y : PAL.o; c.fillRect(sx - 3, sy - 3, 7, 7);
      c.fillStyle = PAL.w; c.fillRect(sx - 1, sy - 1, 3, 3);
    }
    // bomba
    if (this.state !== 'boom') {
      const wob = this.state === 'arm' && this.left < 3 ? Math.sin(this.t * 40) * 2 : 0;
      SPR.drawC(c, 'bomb', b.x + wob, b.y + 26, 4);
      if (this.state === 'arm') TXT.line(c, String(Math.ceil(this.left)), b.x + wob, b.y + 2, { size: 16, align: 'center', base: 'middle', color: this.left < 4 ? PAL.r : PAL.y, weight: 700 });
      else TXT.line(c, '✓', b.x, b.y + 2, { size: 18, align: 'center', base: 'middle', color: PAL.g, weight: 700 });
    } else {
      c.fillStyle = '#1a1410'; c.fillRect(b.x - 30, b.y + 18, 60, 10);
    }
    // przedmioty
    this.objs.forEach((o, i) => {
      const bob = Math.sin(this.t * 3 + o.bob) * 2;
      SPR.drawC(c, o.spr, o.x, o.y + bob, 3);
      let fill = PAL.w;
      if (this.done) { if (i === this.ch.answer) fill = '#9be23a'; }
      const lw = this.lw, lh = this.H >= 420 ? 46 : 36;
      pxbox(c, o.x - lw / 2, o.y + 4, lw, lh, fill);
      pxbox(c, o.x - lw / 2 - 6, o.y - 6, 16, 16, PAL.k, PAL.y);
      TXT.box(c, String(i + 1), o.x - lw / 2 + 2, o.y + 2, 12, 12, { sizes: [10], color: PAL.y });
      TXT.box(c, o.label, o.x + 2, o.y + 4 + lh / 2, lw - 12, lh - 6, { sizes: [13, 12, 11, 10, 9, 8, 7] });
    });
    this.S.timerBar(c, frac);
  }
}
Bomba.WIN = ['Kot jest z ciebie dumny.', 'Promotor ociera łzę.', 'Komisja kiwa głową.', 'Dziekan zapisuje nazwisko.', 'Bomba idzie spać.', 'Hala ocalona!'];
Bomba.LOSE = ['„X” nie pomogło…', 'Wsadziłeś „X” do bomby. Serio?', '„X”? Komisja zakrywa oczy.', 'Kaczka była mądrzejsza niż „X”.'];
Bomba.intro = { title: 'ROZBRÓJ!', hint: 'Tapnij przedmiot z dobrą odpowiedzią (albo 1–4), zanim lont się dopali' };

<script>/* js/mg/room.js */
'use strict';
/* SALA EGZAMINACYJNA – pikselowa scenka z komisją reagującą na odpowiedzi + nastrój komisji. */
class Room {
  constructor(parent, opts = {}) {
    this.mood = opts.mood == null ? 0.5 : opts.mood;
    this.shown = this.mood;
    this.t = Math.random() * 10;
    this.pulse = 0;
    this.blink = [2, 3.4, 5.1];
    this.cv = U.el('canvas', { class: 'room-cv', width: 320, height: 88, 'aria-hidden': 'true' });
    this.ctx = this.cv.getContext('2d');
    this.bubble = U.el('div', { class: 'room-bubble' }, opts.say || 'Proszę bardzo, słuchamy.');
    this.meter = U.el('div', { class: 'room-meter', title: 'Nastrój komisji' }, U.el('span', {}, 'Nastrój komisji'), U.el('div', { class: 'rm-bar' }, U.el('i')));
    this.el = U.el('div', { class: 'room' }, this.cv, this.bubble, this.meter);
    parent.append(this.el);
    this.draw();
  }
  set(delta, text) {
    this.mood = U.clamp(this.mood + delta, 0, 1);
    this.pulse = 0.5;
    if (text) this.say(text);
  }
  say(text) { this.bubble.textContent = text; this.bubble.classList.remove('pop'); void this.bubble.offsetWidth; this.bubble.classList.add('pop'); }
  face() { return this.mood > 0.66 ? 'profH' : this.mood < 0.34 ? 'profA' : 'prof'; }
  update(dt) {
    this.t += dt;
    this.pulse = Math.max(0, this.pulse - dt);
    this.shown += (this.mood - this.shown) * Math.min(1, dt * 5);
    const bar = this.meter.querySelector('i');
    bar.style.width = Math.round(this.shown * 100) + '%';
    bar.style.background = this.shown > 0.66 ? 'var(--green)' : this.shown < 0.34 ? 'var(--red)' : 'var(--amber)';
    this.draw();
  }
  draw() {
    const c = this.ctx, t = this.t;
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#2b2138'; c.fillRect(0, 0, 320, 88);
    c.fillStyle = '#33283f';
    for (let x = 0; x < 320; x += 20) c.fillRect(x, 0, 10, 60);
    // okno z nocnym niebem nad Krakowem
    c.fillStyle = PAL.k; c.fillRect(250, 6, 60, 36);
    c.fillStyle = '#16304a'; c.fillRect(252, 8, 56, 32);
    c.fillStyle = '#f6e7b0'; c.fillRect(292, 12, 6, 6);
    c.fillStyle = '#0b1b27'; c.fillRect(252, 28, 56, 12); c.fillRect(266, 20, 8, 8); c.fillRect(284, 24, 6, 4);
    c.fillStyle = PAL.k; c.fillRect(279, 8, 2, 32);
    // tablica
    c.fillStyle = PAL.k; c.fillRect(8, 6, 70, 34);
    c.fillStyle = '#1f4a31'; c.fillRect(10, 8, 66, 30);
    c.fillStyle = 'rgba(242,236,217,.7)'; c.fillRect(14, 14, 30, 2); c.fillRect(14, 20, 44, 2); c.fillRect(14, 26, 22, 2);
    // komisja
    const face = this.face();
    const swaps = [{ l: '#b8c4bc', B: '#1b4f8a' }, { l: '#4a2c18', B: '#8e1a26' }, { l: '#f2ecd9', B: '#138a45' }];
    [100, 150, 200].forEach((x, i) => {
      const bob = this.pulse > 0 ? Math.round(Math.sin((0.5 - this.pulse) * 30 + i) * 1.5) : 0;
      const blinking = ((t + this.blink[i]) % 4.2) < 0.12;
      SPR.drawC(c, blinking && face === 'prof' ? 'profB' : face, x, 64 + bob, 3, { swap: swaps[i] });
    });
    // stół komisji
    c.fillStyle = PAL.k; c.fillRect(70, 58, 160, 30);
    c.fillStyle = '#6b4424'; c.fillRect(72, 60, 156, 28);
    c.fillStyle = '#8a5a32'; c.fillRect(72, 60, 156, 4);
    c.fillStyle = PAL.w; c.fillRect(90, 56, 14, 4); c.fillRect(186, 56, 16, 4);
    // student przy mównicy
    SPR.drawC(c, 'student', 262, 80, 2);
    c.fillStyle = PAL.k; c.fillRect(248, 66, 30, 22);
    c.fillStyle = '#5a3e24'; c.fillRect(250, 68, 26, 20);
    c.fillStyle = '#8a5a32'; c.fillRect(250, 68, 26, 3);
    c.fillStyle = '#1a1222'; c.fillRect(0, 84, 320, 4);
  }
}

/* Wzorcowa odpowiedź ustna jako lista zdań z rolami (używane w grach i nakładkach). */
Room.answer = function (q, opts = {}) {
  const ol = U.el('ol', { class: 'say' + (opts.compact ? ' compact' : '') });
  q.say.forEach(([r, t]) => ol.append(U.el('li', { class: 'say-' + r },
    U.el('span', { class: 'role role-' + r }, CH.ROLE_NAME[r]), U.el('span', { class: 'say-t', html: U.md(t) }))));
  return ol;
};
/* Wspólna końcówka gier „ustnych”: werdykt, wzorcowa odpowiedź, haczyk, DALEJ. */
Room.finale = function (mg, ok, verdict, extra) {
  const q = mg.ch.q;
  const btn = U.el('button', { class: 'btn primary', type: 'button' }, 'DALEJ ▶');
  btn.onclick = () => { if (!mg.done) mg.end({ ok, skipCorrection: true }, 0.05); };
  const box = U.el('div', { class: 'finale' },
    U.el('div', { class: 'verdict ' + (ok ? 'good' : 'bad') }, verdict),
    extra || null,
    U.el('div', { class: 'mini-label' }, 'TAK TO POWIEDZ KOMISJI'),
    Room.answer(q),
    U.el('div', { class: 'hook' }, U.el('b', {}, 'HACZYK: '), q.m),
    U.el('div', { class: 'kom-actions' }, btn));
  mg.S.panel.append(box);
  mg.finaleBtn = btn;
  setTimeout(() => box.scrollIntoView({ block: 'start', behavior: 'smooth' }), 60);
  btn.focus({ preventScroll: true });
};

<script>/* js/mg/spawarka.js */
'use strict';
/* SPAWARKA PAR – połącz pojęcia z opisami (spawanie iskrą). */
class Spawarka extends MG {
  start() {
    const ch = this.ch, P = this.S.panel;
    this.pairs = ch.pairs;
    this.total = U.clamp(this.pairs.length * 12 / this.speed, 28, 75);
    this.left = this.total;
    this.allowed = this.pairs.length >= 4 ? 1 : 0;
    this.mist = 0; this.matched = 0; this.sel = null; this.errors = [];
    this.cols = ['#2bd46b', '#29adff', '#ffd23a', '#ff77a8', '#ff7a1a'];
    this.S.prompt({ lead: `${ch.tag} · Łączenie par`, text: 'Połącz każde pojęcie z jego opisem.', sub: this.allowed ? 'Dozwolona 1 pomyłka.' : 'Bez pomyłek!' });
    this.bar = U.el('div', { class: 'tbar' }, U.el('i'));
    const L = U.el('div', { class: 'wcol' }), R = U.el('div', { class: 'wcol' });
    this.btnL = U.shuffle(this.pairs.map((p, i) => ({ i, t: p[0] }))).map(o => { const b = U.el('button', { class: 'wbtn term', type: 'button' }, o.t); b.onclick = () => this.pick(b, 'L', o.i); L.append(b); return b; });
    this.btnR = U.shuffle(this.pairs.map((p, i) => ({ i, t: p[1] }))).map(o => { const b = U.el('button', { class: 'wbtn def', type: 'button' }, o.t); b.onclick = () => this.pick(b, 'R', o.i); R.append(b); return b; });
    P.append(U.el('div', { class: 'weld' },
      U.el('div', { class: 'weld-head' }, SPR.img('robot', 3), U.el('span', {}, 'Spawarka par'), this.stat = U.el('b', {}, ''), this.bar),
      U.el('div', { class: 'wgrid' }, L, R)));
    this.updStat();
  }
  updStat() { this.stat.textContent = `${this.matched}/${this.pairs.length} · pomyłki ${this.mist}/${this.allowed + 1}`; }
  pick(btn, side, idx) {
    if (this.done || btn.classList.contains('done') || this.S.intro > 0) return;
    AUDIO.resume();
    this.S.sfx('click');
    if (!this.sel || this.sel.side === side) {
      if (this.sel) this.sel.btn.classList.remove('sel');
      if (this.sel && this.sel.btn === btn) { this.sel = null; return; }
      this.sel = { btn, side, idx };
      btn.classList.add('sel');
      return;
    }
    const a = this.sel; this.sel = null;
    a.btn.classList.remove('sel');
    if (a.idx === idx) {
      const col = this.cols[this.matched % this.cols.length];
      for (const b of [a.btn, btn]) { b.classList.add('done'); b.style.setProperty('--wc', col); }
      this.matched++;
      this.S.sfx('weld');
      this.updStat();
      if (this.matched === this.pairs.length) { this.S.sfx('ok'); this.end({ ok: true, note: this.mist ? this.errors[0] : null }, 0.5); }
    } else {
      for (const b of [a.btn, btn]) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 450); }
      this.mist++;
      const term = this.pairs[side === 'L' ? idx : a.idx][0], def = this.pairs[side === 'L' ? a.idx : idx][1];
      this.errors.push(`„${term}” ≠ „${def}”`);
      this.S.sfx('bad');
      this.updStat();
      if (this.mist > this.allowed) this.fail();
    }
  }
  fail(timeout) {
    this.end({ ok: false, timeout, your: this.errors.join('; '), right: this.pairs.map(p => `${p[0]} – ${p[1]}`).join(' · '), fix: this.pairs.map(p => `${p[0]} – ${p[1]}`).join('\n') }, 0.9);
  }
  update(dt) {
    super.update(dt);
    if (this.done) return;
    this.left -= dt;
    const f = U.clamp(this.left / this.total, 0, 1);
    this.bar.firstChild.style.width = (f * 100) + '%';
    this.bar.classList.toggle('low', f < 0.25);
    if (this.left <= 0) { this.S.sfx('bad'); this.fail(true); }
  }
}
Spawarka.dom = true;
Spawarka.intro = { title: 'SPAWAJ!', hint: 'Tapnij pojęcie, potem pasujący opis' };
MINIGAMES.match = Spawarka;

</script>
<script>/* js/mg/komisja.js */
'use strict';
/* KOMISJA – zaznacz hasła, które należą do minimum odpowiedzi; potem pełne minimum. */
class Komisja extends MG {
  start() {
    const ch = this.ch, q = ch.q, P = this.S.panel;
    this.total = U.clamp(50 / this.speed, 28, 60);
    this.left = this.total;
    this.submitted = false;
    this.S.prompt({ lead: `${ch.tag} · Pytanie egzaminacyjne`, text: q.q });
    const quips = ['No to słucham…', 'Proszę wymienić najważniejsze elementy.', 'Konkretnie, panie magistrze.', 'Mamy czas. Chociaż nie za dużo.', 'Proszę się nie denerwować.'];
    this.room = new Room(P, { say: U.pick(quips) });
    this.bar = U.el('div', { class: 'tbar' }, U.el('i'));
    this.chipsEl = U.el('div', { class: 'chips' });
    this.chips = ch.chips.map(c => {
      const b = U.el('button', { class: 'chip', type: 'button', 'aria-pressed': 'false' }, c.t);
      b.onclick = () => { if (this.submitted || this.S.intro > 0) return; AUDIO.resume(); const on = b.classList.toggle('on'); b.setAttribute('aria-pressed', on); this.S.sfx('click'); };
      this.chipsEl.append(b);
      return { el: b, ...c };
    });
    this.btn = U.el('button', { class: 'btn primary', type: 'button' }, 'ODPOWIADAM ▶');
    this.btn.onclick = () => this.submitted ? this.next() : this.submit(false);
    this.reveal = U.el('div', { class: 'kom-reveal', hidden: true });
    const boss = ch.boss ? U.el('div', { class: 'boss' }, U.el('span', {}, `Komisja: ${ch.boss.hp}/${ch.boss.max}`), U.el('div', { class: 'hp' }, U.el('i', { style: { width: (ch.boss.hp / ch.boss.max * 100) + '%' } }))) : null;
    P.append(U.el('div', { class: 'kom' }, boss, this.bar,
      U.el('p', { class: 'kom-ins' }, 'Zaznacz hasła, które należą do minimum odpowiedzi na to pytanie:'),
      this.chipsEl, U.el('div', { class: 'kom-actions' }, this.btn), this.reveal));
  }
  key(k, down) {
    if (!down) return;
    if (k === 'enter') this.submitted ? this.next() : this.submit(false);
  }
  submit(timeout) {
    if (this.submitted) return;
    this.submitted = true;
    const good = this.chips.filter(c => c.ok);
    const picked = this.chips.filter(c => c.el.classList.contains('on'));
    const hit = good.filter(c => c.el.classList.contains('on')).length;
    const missed = good.length - hit;
    const wrong = picked.filter(c => !c.ok).length;
    const allowMiss = good.length >= 5 ? 1 : 0;
    this.ok = hit > 0 && missed <= allowMiss && wrong <= 1;
    for (const c of this.chips) {
      const on = c.el.classList.contains('on');
      c.el.classList.add(c.ok && on ? 'hit' : c.ok ? 'miss' : on ? 'wrong' : 'off');
      c.el.disabled = true;
    }
    const q = this.ch.q;
    this.room.set(this.ok ? 0.3 : -0.3, this.ok ? U.pick(['Bardzo dobrze. Następne pytanie.', 'Widać, że Pan/Pani się przygotował(a).', 'Komisja kiwa głową.']) : U.pick(['Hmm… a gdzie reszta?', 'Komisja marszczy brwi.', 'To nie do końca to…']));
    this.S.sfx(this.ok ? 'ok' : 'bad');
    this.reveal.hidden = false;
    this.reveal.innerHTML = '';
    this.reveal.append(
      U.el('div', { class: 'verdict ' + (this.ok ? 'good' : 'bad') }, (this.ok ? '✓ ZALICZONE' : '✗ NIEZALICZONE') + (timeout ? ' (czas minął)' : '') + ` · trafione ${hit}/${good.length}, błędne ${wrong}`),
      U.el('div', { class: 'legend' }, U.el('span', { class: 'chip hit sm' }, 'trafione'), U.el('span', { class: 'chip miss sm' }, 'pominięte'), U.el('span', { class: 'chip wrong sm' }, 'błędne')),
      U.el('div', { class: 'mini-label' }, 'TAK TO POWIEDZ KOMISJI'),
      Room.answer(q),
      U.el('div', { class: 'hook' }, U.el('b', {}, 'HACZYK: '), q.m),
      U.el('details', { class: 'ext' }, U.el('summary', {}, 'Minimum egzaminacyjne'), U.el('div', { class: 'rich', html: U.richText(q.a) })));
    this.btn.textContent = 'DALEJ ▶';
    this.reveal.append(U.el('div', { class: 'kom-actions' }, this.btn));
    this.btn.focus({ preventScroll: true });
    this.reveal.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  next() { if (!this.done) this.end({ ok: this.ok, skipCorrection: true }, 0.05); }
  update(dt) {
    super.update(dt);
    this.room.update(dt);
    if (this.submitted || this.done) return;
    this.left -= dt;
    const f = U.clamp(this.left / this.total, 0, 1);
    this.bar.firstChild.style.width = (f * 100) + '%';
    this.bar.classList.toggle('low', f < 0.25);
    if (this.left <= 0) this.submit(true);
  }
}
Komisja.dom = true;
Komisja.intro = { title: 'KOMISJA PYTA!', hint: 'Zaznacz hasła z minimum odpowiedzi i kliknij ODPOWIADAM' };
MINIGAMES.keys = Komisja;

</script>
<script>/* js/mg/mownica.js */
'use strict';
/* MÓWNICA – ułóż odpowiedź dla komisji z gotowych zdań, w dobrej kolejności; odrzuć zdania błędne. */
class Mownica extends MG {
  start() {
    const ch = this.ch, q = ch.q, P = this.S.panel;
    this.left = this.total = U.clamp(ch.sents.length * 15 / this.speed, 45, 110);
    this.allowed = 2; this.mist = 0; this.placed = 0; this.over = false;
    this.S.prompt({ lead: `${ch.tag} · Mównica: ułóż odpowiedź`, text: q.q, sub: 'Wybieraj zdania w kolejności, w jakiej powiesz je komisji: definicja → wyliczenie → rozwinięcie → przykład. Zdania błędne pomiń.' });
    this.room = new Room(P, { say: 'Słuchamy. Proszę zacząć od definicji.' });
    this.bar = U.el('div', { class: 'tbar' }, U.el('i'));
    this.stat = U.el('div', { class: 'mw-stat' });
    this.speech = U.el('ol', { class: 'say speech' });
    this.pool = U.el('div', { class: 'mw-pool' });
    const cards = U.shuffle([...ch.sents.map(s => ({ ...s, ok: true })), ...ch.intr.map(s => ({ ...s, ok: false }))]);
    this.cards = cards.map(c => {
      const b = U.el('button', { class: 'mw-card', type: 'button', html: U.md(c.t) });
      b.onclick = () => this.pick(c, b);
      this.pool.append(b);
      return { c, b };
    });
    P.append(U.el('div', { class: 'mw' }, this.bar, this.stat,
      U.el('div', { class: 'mini-label' }, 'TWOJA WYPOWIEDŹ'), this.speech,
      U.el('div', { class: 'mini-label' }, 'ZDANIA DO WYBORU'), this.pool));
    this.updStat();
  }
  remaining() { return this.cards.filter(x => x.c.ok && !x.c.used).map(x => x.c); }
  updStat() { this.stat.textContent = `Zdania: ${this.placed}/${this.ch.sents.length} · pomyłki: ${this.mist}/${this.allowed + 1}`; }
  pick(c, b) {
    if (this.done || this.over || this.S.intro > 0 || b.disabled) return;
    AUDIO.resume();
    if (!c.ok) {
      this.mistake(b, c.twin ? 'To zdanie ma błąd merytoryczny!' : 'To nie jest odpowiedź na to pytanie!');
      b.disabled = true; b.classList.add('gone');
      b.append(U.el('small', { class: 'why' }, c.why));
      return;
    }
    const minRank = Math.min(...this.remaining().map(s => s.rank));
    if (c.rank > minRank) {
      const need = this.remaining().find(s => s.rank === minRank);
      this.mistake(b, `Za wcześnie! Najpierw: ${CH.ROLE_NAME[need.role].toLowerCase()}.`);
      return;
    }
    c.used = true; b.disabled = true; b.classList.add('used');
    this.placed++;
    this.speech.append(U.el('li', { class: 'say-' + c.role + ' fresh' }, U.el('span', { class: 'role role-' + c.role }, CH.ROLE_NAME[c.role]), U.el('span', { class: 'say-t', html: U.md(c.t) })));
    this.room.set(0.1, U.pick(['Mhm.', 'Dobrze.', 'Tak, słuchamy dalej.', 'Konkretnie – tak trzymać.']));
    this.S.sfx('ok');
    this.updStat();
    if (!this.remaining().length) this.finish(true);
    else this.showPool();
  }
  /* pula zdań ma być widoczna: przewiń scenę, jeśli wypowiedź zepchnęła ją w dół */
  showPool() {
    const st = this.S.panel.parentElement, r = this.pool.getBoundingClientRect(), sr = st.getBoundingClientRect();
    if (r.top > sr.bottom - 140) st.scrollTo({ top: st.scrollTop + r.top - sr.top - 140, behavior: 'smooth' });
  }
  mistake(b, text) {
    this.mist++;
    b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
    this.room.set(-0.18, text);
    this.S.sfx('bad');
    this.updStat();
    if (this.mist > this.allowed) this.finish(false);
  }
  finish(ok, timeout) {
    if (this.over) return;
    this.over = true;
    this.S.sfx(ok ? 'coin' : 'lose');
    this.room.set(ok ? 0.2 : -0.2, ok ? 'Pełna, uporządkowana odpowiedź. Brawo!' : 'Hmm… Proszę jeszcze to przećwiczyć.');
    this.cards.forEach(({ b }) => { b.disabled = true; });
    this.pool.hidden = true;
    Room.finale(this, ok, ok ? `✓ WYPOWIEDŹ UŁOŻONA · pomyłki: ${this.mist}` : `✗ ${timeout ? 'CZAS MINĄŁ' : 'ZA DUŻO POMYŁEK'} – przeczytaj wzorcową odpowiedź`);
  }
  key(k, down) { if (down && k === 'enter' && this.finaleBtn) this.finaleBtn.click(); }
  update(dt) {
    super.update(dt);
    this.room.update(dt);
    if (this.over || this.done) return;
    this.left -= dt;
    const f = U.clamp(this.left / this.total, 0, 1);
    this.bar.firstChild.style.width = (f * 100) + '%';
    this.bar.classList.toggle('low', f < 0.25);
    if (this.left <= 0) this.finish(false, true);
  }
}
Mownica.dom = true;
Mownica.intro = { title: 'MÓWNICA!', hint: 'Ułóż odpowiedź dla komisji zdanie po zdaniu' };
MINIGAMES.builder = Mownica;

</script>
<script>/* js/mg/luki.js */
'use strict';
/* ZNIKAJĄCY TEKST – uzupełnij luki w wzorcowej odpowiedzi ustnej kolejnymi pojęciami. */
class Luki extends MG {
  start() {
    const ch = this.ch, q = ch.q, P = this.S.panel;
    this.n = ch.blanks.length;
    this.cur = 0; this.mist = 0; this.over = false;
    this.allowed = Math.max(1, Math.floor(this.n / 4));
    this.left = this.total = U.clamp((15 + this.n * 9) / this.speed, 30, 110);
    this.S.prompt({ lead: `${ch.tag} · Znikający tekst`, text: q.q, sub: 'Uzupełnij luki po kolei – tak brzmi odpowiedź, którą powiesz komisji.' });
    this.room = new Room(P, { say: 'Proszę mówić pełnymi zdaniami.' });
    this.bar = U.el('div', { class: 'tbar' }, U.el('i'));
    this.stat = U.el('div', { class: 'mw-stat' });
    this.blankEls = [];
    const text = U.el('ol', { class: 'say luki-text' });
    ch.parts.forEach((ps, si) => {
      const t = U.el('span', { class: 'say-t' });
      for (const p of ps) {
        if (p.k === 'b' && p.blank != null) {
          const bl = U.el('span', { class: 'blank', style: { minWidth: Math.min(16, Math.max(4, p.t.length * 0.55)) + 'em' } }, ' ');
          this.blankEls[p.blank] = bl;
          t.append(bl);
        } else if (p.k === 'b') t.append(U.el('b', {}, p.t));
        else t.append(p.t);
      }
      text.append(U.el('li', { class: 'say-' + ch.roles[si] }, U.el('span', { class: 'role role-' + ch.roles[si] }, CH.ROLE_NAME[ch.roles[si]]), t));
    });
    this.bank = U.el('div', { class: 'chips bank' });
    this.chips = ch.bank.map(c => {
      const b = U.el('button', { class: 'chip', type: 'button' }, c.t);
      b.onclick = () => this.pick(c, b);
      this.bank.append(b);
      return b;
    });
    P.append(U.el('div', { class: 'mw' }, this.bar, this.stat, text, U.el('div', { class: 'mini-label' }, 'BANK POJĘĆ – wybierz pojęcie do podświetlonej luki'), this.bank));
    this.mark();
  }
  mark() {
    this.blankEls.forEach((b, i) => b.classList.toggle('cur', i === this.cur && !this.over));
    this.stat.textContent = `Luki: ${this.cur}/${this.n} · pomyłki: ${this.mist}/${this.allowed + 1}`;
    const el = this.blankEls[this.cur];
    if (el && this.cur > 0) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  pick(c, b) {
    if (this.done || this.over || this.S.intro > 0 || b.disabled) return;
    AUDIO.resume();
    const want = this.ch.blanks[this.cur];
    if (U.key(c.t) === U.key(want)) {
      const bl = this.blankEls[this.cur];
      bl.textContent = want; bl.classList.add('filled');
      b.disabled = true; b.classList.add('hit');
      this.cur++;
      this.S.sfx('coin');
      this.room.set(0.06);
      if (this.cur >= this.n) return this.finish(true);
      this.mark();
    } else {
      this.mist++;
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake', 'wrong');
      setTimeout(() => b.classList.remove('wrong'), 500);
      this.room.set(-0.15, c.ok ? 'To pojęcie pasuje, ale w innym miejscu.' : 'To nie pasuje do tej odpowiedzi.');
      this.S.sfx('bad');
      this.mark();
      if (this.mist > this.allowed) this.finish(false);
    }
  }
  finish(ok, timeout) {
    if (this.over) return;
    this.over = true;
    this.blankEls.forEach((bl, i) => { if (!bl.classList.contains('filled')) { bl.textContent = this.ch.blanks[i]; bl.classList.add('missed'); } bl.classList.remove('cur'); });
    this.chips.forEach(b => { b.disabled = true; });
    this.bank.hidden = true;
    this.S.sfx(ok ? 'ok' : 'lose');
    this.room.set(ok ? 0.2 : -0.2, ok ? 'Płynnie i merytorycznie. Tak trzymać!' : 'Brakuje kluczowych pojęć…');
    Room.finale(this, ok, ok ? `✓ ODPOWIEDŹ KOMPLETNA · pomyłki: ${this.mist}` : `✗ ${timeout ? 'CZAS MINĄŁ' : 'ZA DUŻO POMYŁEK'} – na żółto brakujące pojęcia`);
  }
  key(k, down) { if (down && k === 'enter' && this.finaleBtn) this.finaleBtn.click(); }
  update(dt) {
    super.update(dt);
    this.room.update(dt);
    if (this.over || this.done) return;
    this.left -= dt;
    const f = U.clamp(this.left / this.total, 0, 1);
    this.bar.firstChild.style.width = (f * 100) + '%';
    this.bar.classList.toggle('low', f < 0.25);
    if (this.left <= 0) this.finish(false, true);
  }
}
Luki.dom = true;
Luki.intro = { title: 'LUKI!', hint: 'Uzupełnij wzorcową odpowiedź brakującymi pojęciami' };
MINIGAMES.luki = Luki;

</script>
<script>/* js/mg/lowca.js */
'use strict';
/* ŁOWCA BŁĘDÓW – komisja słucha odpowiedzi kolegi; wskaż błędne sformułowania. */
class Lowca extends MG {
  start() {
    const ch = this.ch, q = ch.q, P = this.S.panel;
    this.found = 0; this.wrong = 0; this.over = false;
    this.allowed = ch.n >= 3 ? 2 : 1;
    this.left = this.total = U.clamp((40 + ch.n * 12) / this.speed, 35, 90);
    const word = ch.n === 1 ? 'błąd merytoryczny' : `${ch.n} ${U.pl(ch.n, 'błąd', 'błędy', 'błędów')} merytoryczne`;
    this.S.prompt({ lead: `${ch.tag} · Łowca błędów`, text: q.q, sub: `Kolega odpowiada przed komisją. W jego odpowiedzi jest ${word}. Tapnij błędne sformułowania.` });
    this.room = new Room(P, { say: 'Proszę posłuchać kolegi i wskazać błędy.', mood: 0.45 });
    this.bar = U.el('div', { class: 'tbar' }, U.el('i'));
    this.stat = U.el('div', { class: 'mw-stat' });
    this.toks = [];
    const text = U.el('ol', { class: 'say hunt-text' });
    ch.segs.forEach((segs, si) => {
      const t = U.el('span', { class: 'say-t' });
      for (const s of segs) {
        if (s.k === 'txt') { t.append(s.t); continue; }
        const b = U.el('button', { class: 'tok', type: 'button' }, s.t);
        b.onclick = () => this.tap(s, b);
        this.toks.push({ s, b });
        t.append(b);
      }
      text.append(U.el('li', { class: 'say-' + ch.roles[si] }, U.el('span', { class: 'role role-' + ch.roles[si] }, CH.ROLE_NAME[ch.roles[si]]), t));
    });
    P.append(U.el('div', { class: 'mw' }, this.bar, this.stat, text));
    this.updStat();
  }
  updStat() { this.stat.textContent = `Znalezione błędy: ${this.found}/${this.ch.n} · chybione: ${this.wrong}/${this.allowed + 1}`; }
  tap(s, b) {
    if (this.done || this.over || this.S.intro > 0 || b.disabled) return;
    AUDIO.resume();
    b.disabled = true;
    if (s.err) {
      this.found++;
      b.classList.add('caught');
      b.innerHTML = '';
      b.append(U.el('s', {}, s.t), ' ', U.el('b', {}, s.fix));
      this.S.sfx('coin');
      this.room.set(0.15, 'Dokładnie! To był błąd.');
      this.updStat();
      if (this.found >= this.ch.n) this.finish(true);
    } else {
      this.wrong++;
      b.classList.add('fine');
      this.S.sfx('bad');
      this.room.set(-0.15, 'Nie, to akurat było poprawne.');
      this.updStat();
      if (this.wrong > this.allowed) this.finish(false);
    }
  }
  finish(ok, timeout) {
    if (this.over) return;
    this.over = true;
    for (const { s, b } of this.toks) {
      b.disabled = true;
      if (s.err && !b.classList.contains('caught')) { b.classList.add('missed'); b.innerHTML = ''; b.append(U.el('s', {}, s.t), ' ', U.el('b', {}, s.fix)); }
    }
    this.S.sfx(ok ? 'ok' : 'lose');
    this.room.set(ok ? 0.2 : -0.2, ok ? 'Świetne oko. Pan/Pani to wie.' : 'Błędy przeszły niezauważone…');
    Room.finale(this, ok, ok ? '✓ WSZYSTKIE BŁĘDY ZNALEZIONE' : `✗ ${timeout ? 'CZAS MINĄŁ' : 'ZA DUŻO CHYBIEŃ'} – przekreślone są błędy, obok poprawna wersja`);
  }
  key(k, down) { if (down && k === 'enter' && this.finaleBtn) this.finaleBtn.click(); }
  update(dt) {
    super.update(dt);
    this.room.update(dt);
    if (this.over || this.done) return;
    this.left -= dt;
    const f = U.clamp(this.left / this.total, 0, 1);
    this.bar.firstChild.style.width = (f * 100) + '%';
    this.bar.classList.toggle('low', f < 0.25);
    if (this.left <= 0) this.finish(false, true);
  }
}
Lowca.dom = true;
Lowca.intro = { title: 'ŁOWCA BŁĘDÓW!', hint: 'Tapnij błędne sformułowania w odpowiedzi kolegi' };

<script>/* js/mg/dopytka.js */
'use strict';
/* DOPYTKA – komisja zadaje pytanie dodatkowe; wybierz odpowiedź, która Cię obroni. */
class Dopytka extends MG {
  start() {
    const ch = this.ch, q = ch.q, P = this.S.panel;
    this.left = this.total = U.clamp(32 / this.speed, 18, 40);
    this.S.prompt({ lead: `${ch.tag} · Pytanie dodatkowe`, text: ch.question, sub: `Temat: ${q.t}. Która odpowiedź obroni Cię przed komisją?` });
    this.room = new Room(P, { say: `„${ch.question}”` });
    this.bar = U.el('div', { class: 'tbar' }, U.el('i'));
    this.btns = ch.options.map((o, i) => {
      const b = U.el('button', { class: 'mw-card fu-opt', type: 'button' }, U.el('b', { class: 'fu-n' }, String(i + 1)), ' ', o);
      b.onclick = () => this.choose(i);
      return b;
    });
    P.append(U.el('div', { class: 'mw' }, this.bar, U.el('div', { class: 'fu-list' }, ...this.btns)));
  }
  key(k, down) {
    if (!down) return;
    const m = /^n(\d)$/.exec(k);
    if (m && +m[1] <= this.btns.length) this.choose(+m[1] - 1);
  }
  choose(i) {
    if (this.done || this.S.intro > 0) return;
    AUDIO.resume();
    const ok = i === this.ch.answer;
    this.btns.forEach((b, j) => { b.disabled = true; if (j === this.ch.answer) b.classList.add('right'); else if (j === i) b.classList.add('wrongc'); });
    if (ok) {
      this.room.set(0.3, U.pick(['Dokładnie tak. Dziękujemy.', 'Bardzo dobrze.', 'Wyczerpująco. Brawo.']));
      this.S.sfx('ok');
      this.end({ ok: true }, 1.3);
    } else {
      this.room.set(-0.3, 'Hmm… nie do końca.');
      this.S.sfx('bad');
      this.end({ ok: false, your: this.ch.options[i], right: this.ch.fix, fix: `Pytanie komisji: „${this.ch.question}”` }, 1.4);
    }
  }
  update(dt) {
    super.update(dt);
    this.room.update(dt);
    if (this.done) return;
    this.left -= dt;
    const f = U.clamp(this.left / this.total, 0, 1);
    this.bar.firstChild.style.width = (f * 100) + '%';
    this.bar.classList.toggle('low', f < 0.25);
    if (this.left <= 0) {
      this.room.set(-0.3, 'Cisza to też odpowiedź…');
      this.S.sfx('bad');
      this.end({ ok: false, timeout: true, right: this.ch.fix, fix: `Pytanie komisji: „${this.ch.question}”` }, 1.0);
    }
  }
}
