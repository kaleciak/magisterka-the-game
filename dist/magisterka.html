<style>
/* MAGISTERKA THE GAME – nocna zmiana w hucie: zieleń AGH, czerń, czerwień, płynny metal. */
:root {
  color-scheme: dark;
  --bg: #0b130f;
  --bg2: #0f1a14;
  --panel: #15241c;
  --panel2: #1c3226;
  --line: #2d4b3b;
  --ink: #f2ecd9;
  --mute: #9fb5a7;
  --green: #2bd46b;
  --green-d: #138a45;
  --red: #e0303c;
  --amber: #ffc21a;
  --orange: #ff7a1a;
  --blue: #29adff;
  --pink: #ff77a8;
  --lv0: #34443b;
  --lv1: #e0303c;
  --lv2: #ff7a1a;
  --lv3: #ffc21a;
  --lv4: #9be23a;
  --lv5: #2bd46b;
  --f-display: "Press Start 2P", ui-monospace, monospace;
  --f-body: "Jersey 15", "Trebuchet MS", system-ui, sans-serif;
  --f-label: "Jersey 15", "Trebuchet MS", system-ui, sans-serif;
  --f-mono: "VT323", ui-monospace, monospace;
  --px: 3px;
}
:root[data-font="pixelify"] { --f-body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif; --f-label: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif; }
:root[data-font="system"] { --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --f-label: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(43, 212, 107, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(43, 212, 107, .035) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 400 17px/1.45 var(--f-body);
  font-synthesis: none; /* pikselowe kroje bez sztucznego pogrubienia – wyróżnienia kolorem */
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .09) 0 1px, transparent 1px 3px);
}
[hidden] { display: none !important; }
#app { height: 100%; max-width: 800px; margin: 0 auto; position: relative; }
.screen { height: 100%; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
h2, h3, h4 { text-wrap: balance; margin: 0; }
h2 { font: 400 19px/1.4 var(--f-label); letter-spacing: .06em; text-transform: uppercase; }
h3 { font: 700 18px/1.3 var(--f-body); }
p { margin: 0; }
b { font-weight: 700; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.px-img { image-rendering: pixelated; display: block; }

/* ---------- przyciski ---------- */
.btn {
  font: 600 15px/1.2 var(--f-body); color: var(--ink);
  background: var(--panel2); border: var(--px) solid #000; border-radius: 0;
  box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .35), inset 3px 3px 0 rgba(255, 255, 255, .09), 0 4px 0 #000;
  padding: 10px 14px; cursor: pointer; text-align: left; transition: transform .05s;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(3px); box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .35), inset 3px 3px 0 rgba(255, 255, 255, .09), 0 1px 0 #000; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn.primary { background: var(--green); color: #06140b; }
.btn.boss { background: var(--red); color: #fff; }
.btn.boss.dim { background: #5a2127; }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--line); color: var(--mute); }
.btn.ghost:active { transform: none; }
.btn.on { background: var(--amber); color: #1a1200; }
.btn.danger { background: var(--red); color: #fff; border-color: #000; }
.btn.sm { padding: 6px 10px; font-size: 14px; box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .35), 0 3px 0 #000; }
.btn.big { padding: 12px 16px; }
.btn b { display: block; font: 400 17px/1.4 var(--f-label); letter-spacing: .06em; }
.btn small { display: block; font-size: 14px; color: inherit; opacity: .82; margin-top: 2px; }
.menu { display: grid; gap: 10px; }
.menu.row { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar h2 { flex: 1; }
.card { background: var(--panel); border: var(--px) solid #000; box-shadow: 0 4px 0 #000; padding: 14px; display: grid; gap: 10px; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.tip { color: var(--mute); font-size: 14px; }
.foot { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---------- ekran tytułowy ---------- */
.hero { display: grid; gap: 14px; padding-top: 6px; }
.logo { display: grid; justify-items: start; line-height: 1.15; }
.logo .l1 {
  font: 400 clamp(24px, 8.2vw, 50px)/1.1 var(--f-display); color: var(--ink);
  text-shadow: 3px 3px 0 var(--green-d), 6px 6px 0 #000;
}
.logo .l2 { font: 400 clamp(11px, 3vw, 16px)/2 var(--f-display); color: var(--amber); text-shadow: 2px 2px 0 #000; letter-spacing: .2em; }
.hero-row { display: flex; gap: 16px; align-items: center; }
.avatar { background: var(--panel); border: var(--px) solid #000; padding: 10px 12px 6px; box-shadow: 0 4px 0 #000; }
.hero-stats { display: grid; gap: 6px; flex: 1; min-width: 0; }
.exam { font: 400 15px/1.5 var(--f-label); letter-spacing: .04em; color: var(--orange); }
.rank { font-weight: 700; font-size: 20px; }
.pline { color: var(--mute); font-size: 14px; font-variant-numeric: tabular-nums; }
.pbar { height: 14px; background: #06100b; border: var(--px) solid #000; position: relative; }
.pbar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--green) 0 8px, var(--green-d) 8px 10px); }
.bob { animation: bob 1s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.mgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
.mcell {
  aspect-ratio: 1; min-width: 0; border: 2px solid #000; border-bottom: 5px solid var(--wc);
  font: 400 19px/1 var(--f-mono); color: #07110b; cursor: pointer; padding: 0;
}
.mcell.lv0 { background: var(--lv0); color: var(--mute); }
.mcell.lv1 { background: var(--lv1); color: #fff; }
.mcell.lv2 { background: var(--lv2); }
.mcell.lv3 { background: var(--lv3); }
.mcell.lv4 { background: var(--lv4); }
.mcell.lv5 { background: var(--lv5); box-shadow: inset 0 0 0 2px var(--amber); }
.mcell:hover { filter: brightness(1.2); }
.mcell.sel { outline: 3px solid var(--ink); outline-offset: -3px; transform: scale(.9); }
.legend-lv { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--mute); }
.lvdot { display: inline-flex; align-items: center; gap: 4px; }
.lvdot::before { content: ""; width: 10px; height: 10px; border: 1px solid #000; background: var(--c); }
.lvdot.lv0 { --c: var(--lv0); } .lvdot.lv1 { --c: var(--lv1); } .lvdot.lv2 { --c: var(--lv2); }
.lvdot.lv3 { --c: var(--lv3); } .lvdot.lv4 { --c: var(--lv4); } .lvdot.lv5 { --c: var(--lv5); }

/* gwiazdki poziomu */
.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.stars i { width: 12px; height: 12px; background: #26352c; border: 2px solid #000; }
.stars i.on { background: var(--amber); }
.stars.sm i { width: 9px; height: 9px; border-width: 1px; }

/* ---------- mapa i świat ---------- */
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
.wtile {
  background: var(--panel); border: var(--px) solid #000; border-top: 6px solid var(--wc);
  box-shadow: 0 4px 0 #000; padding: 12px; text-align: left; cursor: pointer; display: grid; gap: 6px;
}
.wtile:hover { background: var(--panel2); }
.wt-top { display: flex; justify-content: space-between; align-items: start; }
.crown { color: var(--amber); font-size: 26px; line-height: 1; text-shadow: 2px 2px 0 #000; }
.wt-name { font-weight: 700; font-size: 16px; }
.wt-range { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
.wt-dots { display: flex; gap: 4px; flex-wrap: wrap; }
.wt-dots i { width: 14px; height: 14px; border: 2px solid #000; }
.wt-dots i.lv0 { background: var(--lv0); } .wt-dots i.lv1 { background: var(--lv1); } .wt-dots i.lv2 { background: var(--lv2); }
.wt-dots i.lv3 { background: var(--lv3); } .wt-dots i.lv4 { background: var(--lv4); } .wt-dots i.lv5 { background: var(--lv5); }
.whead { display: flex; gap: 14px; align-items: center; background: var(--panel); border: var(--px) solid #000; border-left: 6px solid var(--wc); padding: 12px; }
.whead > div { flex: 1; display: grid; gap: 8px; }
.qlist { display: grid; gap: 8px; }
.qrow { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid #000; padding: 6px 8px; }
.qrow-main { flex: 1; display: flex; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; cursor: pointer; padding: 4px 0; min-width: 0; }
.qrow-main b { font: 400 18px/1 var(--f-mono); color: var(--amber); }

/* ---------- ekran gry ---------- */
#scr-game { overflow: hidden; padding: 10px 12px 12px; gap: 8px; position: relative; }
#hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
.hud-l, .hud-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hud-r { justify-content: flex-end; }
#hearts { display: flex; gap: 3px; }
#hearts .heart { width: 21px; height: 18px; }
.hud-c { display: flex; align-items: baseline; gap: 8px; }
#hud-score { font: 400 30px/1 var(--f-mono); color: var(--amber); text-shadow: 2px 2px 0 #000; font-variant-numeric: tabular-nums; }
#hud-combo { font: 400 15px/1 var(--f-label); color: var(--pink); }
#hud-mode { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24vw; }
#hud-tempo { font: 400 18px/1 var(--f-mono); color: var(--blue); white-space: nowrap; }
#prompt { background: var(--panel); border: var(--px) solid #000; box-shadow: 0 4px 0 #000; padding: 10px 12px; }
#prompt .lead { font: 400 13px/1.5 var(--f-label); color: var(--amber); letter-spacing: .05em; text-transform: uppercase; }
#prompt .text { font: 600 clamp(16px, 2.4vw, 20px)/1.35 var(--f-body); margin-top: 4px; }
#prompt .text.long { font-size: clamp(14px, 2vw, 17px); }
#prompt .sub { font-size: 14px; color: var(--mute); margin-top: 4px; }
#prompt .sub:empty { display: none; }
#stage-wrap { flex: 1; min-height: 180px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stage { position: relative; border: var(--px) solid #000; box-shadow: 0 5px 0 #000; background: #0c1410; max-width: 100%; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#stage.dom { width: 100%; height: 100%; overflow-y: auto; background: var(--panel); }
#stage.dom #cv { display: none; }
#panel { padding: 12px; }
#splash {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px;
  background: rgba(4, 10, 7, .55); pointer-events: none; padding: 16px;
}
#splash .sp-title { font: 400 clamp(22px, 6vw, 40px)/1.2 var(--f-display); color: var(--amber); text-shadow: 3px 3px 0 #000, 6px 6px 0 var(--red); }
#splash .sp-hint { font: 600 16px/1.3 var(--f-body); color: var(--ink); text-shadow: 2px 2px 0 #000; max-width: 34ch; margin: 0 auto; }
#splash.go .sp-title { animation: pop .35s steps(4); }
@keyframes pop { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
#controls { display: flex; gap: 10px; justify-content: center; }
#controls:empty { display: none; }
.ctl {
  flex: 1; max-width: 260px; min-height: 58px; font: 400 18px/1.3 var(--f-label); letter-spacing: .06em;
  background: var(--panel2); color: var(--ink); border: var(--px) solid #000; box-shadow: 0 5px 0 #000, inset 3px 3px 0 rgba(255, 255, 255, .1);
  cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.ctl.down { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.ctl.good { background: var(--green); color: #06140b; }
.ctl.bad { background: var(--red); color: #fff; }
.ctl.big { font-size: 24px; }
.ctl.num { max-width: 72px; font-size: 16px; }
.ctl.wide { max-width: 420px; }
#toasts { position: absolute; left: 0; right: 0; top: 8px; display: grid; justify-items: center; gap: 4px; pointer-events: none; z-index: 5; }
.toast { font: 700 15px/1.2 var(--f-body); background: #000; color: var(--ink); padding: 4px 10px; border: 2px solid var(--line); animation: tin .2s steps(2); }
.toast.good { color: var(--green); } .toast.lvl { color: var(--amber); } .toast.heart { color: var(--pink); }
.toast.tempo { color: var(--blue); } .toast.note { color: var(--mute); font-weight: 500; font-size: 13px; }
.toast.out { opacity: 0; transition: opacity .4s; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }
#overlay { position: absolute; inset: 0; background: rgba(4, 9, 6, .9); z-index: 20; overflow-y: auto; padding: 16px; display: flex; justify-content: center; align-items: flex-start; }
.ov-card { background: var(--panel); border: var(--px) solid #000; box-shadow: 0 6px 0 #000; padding: 16px; max-width: 680px; width: 100%; display: grid; gap: 12px; margin: auto 0; }
.ov-card.bad { border-top: 6px solid var(--red); }
.ov-card.learn { border-top: 6px solid var(--amber); }
.ov-kicker { font: 400 16px/1.5 var(--f-label); letter-spacing: .06em; color: var(--amber); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.ov-kicker.bad { color: #ff6b6b; }
.ov-kicker small { font: 500 15px/1.3 var(--f-body); color: var(--mute); }
.ov-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
.ov-actions.col { flex-direction: column; align-items: stretch; }
.ov-actions .ext { flex: 1 1 100%; }
.c-your { color: #ff9a9a; }
.c-right { color: #b9f5a0; font-size: 17px; }
.c-fix { color: var(--ink); background: #0d1812; border: 2px solid var(--line); padding: 8px 10px; font-size: 15px; }
.lvchg { margin-left: 8px; color: #ff9a9a; font-size: 13px; }

/* treść pytania */
.qblock { display: grid; gap: 10px; }
.qb-tag { font: 400 13px/1.6 var(--f-label); letter-spacing: .05em; text-transform: uppercase; color: var(--wc, var(--amber)); display: flex; flex-wrap: wrap; align-items: baseline; }
.qb-q { font: 700 19px/1.35 var(--f-body); }
.mini-label { font: 400 13px/1.5 var(--f-label); color: var(--green); letter-spacing: .07em; text-transform: uppercase; }
.rich { display: grid; gap: 6px; font-size: 16px; max-width: 68ch; }
.rich p { margin: 0; }
.rich b { color: var(--amber); font-weight: 700; }
.rich .li { padding-left: 16px; position: relative; }
.rich .li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 6px; height: 6px; background: var(--green); }
.rich .li2 { padding-left: 32px; }
.rich .li2::before { left: 18px; background: var(--mute); }
.rich .num::before { display: none; }
.rich .num { padding-left: 4px; }
.rich h4 { font: 700 16px/1.3 var(--f-body); color: var(--green); margin-top: 6px; }
.hook { border: 2px dashed var(--amber); background: rgba(255, 194, 26, .06); padding: 8px 10px; font-size: 15px; }
.hook b { color: var(--amber); font: 400 13px/1.5 var(--f-label); letter-spacing: .06em; }
details.ext, details.mis { background: #0f1b15; border: 2px solid var(--line); padding: 6px 10px; }
details.ext > summary, details.mis > summary { cursor: pointer; font-weight: 600; color: var(--mute); }
details[open] > summary { margin-bottom: 8px; }
dl.facts { display: grid; grid-template-columns: minmax(110px, 34%) 1fr; gap: 6px 12px; margin: 0; font-size: 15px; }
dl.facts dt { font-weight: 700; color: var(--amber); }
dl.facts dd { margin: 0; }

/* spawarka */
.weld { display: grid; gap: 10px; }
.weld-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.weld-head span { font: 400 15px/1.5 var(--f-label); letter-spacing: .05em; color: var(--amber); }
.weld-head b { color: var(--mute); font-weight: 500; font-size: 14px; margin-left: auto; font-variant-numeric: tabular-nums; }
.tbar { height: 10px; background: #06100b; border: 2px solid #000; flex: 1 1 100%; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--green); transition: width .2s linear; }
.tbar.low i { background: var(--red); }
.wgrid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; }
.wcol { display: grid; gap: 8px; align-content: start; }
.wbtn { text-align: left; background: var(--panel2); border: var(--px) solid #000; box-shadow: 0 3px 0 #000; padding: 8px 10px; cursor: pointer; font-size: 15px; line-height: 1.3; }
.wbtn.term { font-weight: 700; }
.wbtn.sel { background: var(--amber); color: #1a1200; }
.wbtn.done { background: var(--wc); color: #06140b; cursor: default; box-shadow: none; transform: translateY(3px); }
.wbtn.bad { background: var(--red); color: #fff; animation: shake .3s steps(3); }
@keyframes shake { 33% { transform: translateX(-5px); } 66% { transform: translateX(5px); } }

/* komisja */
.kom { display: grid; gap: 12px; }
.kom-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.profs { display: flex; gap: 6px; background: #3b2a1a; border: var(--px) solid #000; padding: 8px 10px 0; border-bottom: 10px solid #5a3e24; }
.bubble { background: var(--ink); color: #111; border: var(--px) solid #000; padding: 8px 12px; font-weight: 600; position: relative; max-width: 36ch; margin-bottom: 18px; }
.bubble::after { content: ""; position: absolute; left: -12px; bottom: 8px; border: 6px solid transparent; border-right-color: #000; }
.boss { display: grid; gap: 4px; font: 400 14px/1.5 var(--f-label); letter-spacing: .05em; color: #ff9a9a; }
.hp { height: 14px; background: #2a0f12; border: 2px solid #000; }
.hp i { display: block; height: 100%; background: var(--red); }
.kom-ins { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--panel2); border: 2px solid #000; box-shadow: 0 3px 0 #000; padding: 7px 10px; font-size: 15px; cursor: pointer; text-align: left; }
.chip.on { background: var(--amber); color: #1a1200; }
.chip.hit { background: var(--green); color: #06140b; }
.chip.miss { background: transparent; border: 2px dashed var(--amber); color: var(--amber); box-shadow: none; }
.chip.wrong { background: var(--red); color: #fff; }
.chip.off { opacity: .4; }
.chip:disabled { cursor: default; }
.chip.sm { font-size: 12px; padding: 2px 6px; cursor: default; }
.kom-actions { display: flex; justify-content: flex-end; }
.kom-reveal { display: grid; gap: 10px; border-top: 3px solid #000; padding-top: 12px; }
.verdict { font: 400 16px/1.5 var(--f-label); letter-spacing: .05em; }
.verdict.good { color: var(--green); } .verdict.bad { color: #ff6b6b; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; }

/* podsumowanie */
.sum-head { display: grid; justify-items: center; gap: 10px; text-align: center; background: var(--panel); border: var(--px) solid #000; border-top: 6px solid var(--red); box-shadow: 0 4px 0 #000; padding: 16px; }
.sum-head.good { border-top-color: var(--green); }
.sum-head h2 { font-size: clamp(14px, 4vw, 20px); color: var(--amber); text-shadow: 2px 2px 0 #000; }
.score { font: 400 56px/1 var(--f-mono); color: var(--amber); text-shadow: 3px 3px 0 #000; display: grid; justify-items: center; font-variant-numeric: tabular-nums; }
.rec { font: 400 14px/1.5 var(--f-label); letter-spacing: .06em; color: var(--pink); }
.sum-stats { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; color: var(--mute); font-variant-numeric: tabular-nums; }
.chg { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 5px 0; flex-wrap: wrap; }
.chg > span:nth-child(2) { flex: 1; min-width: 120px; }
.chg b { font: 400 18px/1 var(--f-mono); color: var(--amber); }
.chg.up b:first-child { color: var(--green); }
.chg.down b:first-child { color: #ff6b6b; }
.chg .arr { color: var(--mute); }
.chg .grade { font-size: 24px; }
details.mis { display: grid; gap: 8px; }

/* symulator obrony */
.def-q { justify-items: start; }
.def-question { font: 700 clamp(19px, 3vw, 24px)/1.35 var(--f-body); max-width: 60ch; }
.clock { font: 400 64px/1 var(--f-mono); color: var(--blue); text-shadow: 3px 3px 0 #000; font-variant-numeric: tabular-nums; }
.clock.warn { color: var(--orange); }
.dks { display: grid; gap: 6px; }
.dk { display: flex; gap: 10px; align-items: center; background: var(--panel2); border: 2px solid #000; padding: 8px 10px; cursor: pointer; }
.dk input { width: 20px; height: 20px; accent-color: var(--green); flex: none; }
.dk:has(input:checked) { background: #1f4a31; }

/* kompendium */
.book-tools { display: flex; gap: 10px; flex-wrap: wrap; }
.book-tools input { flex: 1; min-width: 180px; font: 500 16px var(--f-body); color: var(--ink); background: #07100b; border: var(--px) solid #000; padding: 10px 12px; }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; }
.book-list { display: grid; gap: 8px; }
.book-w { font: 700 17px/1.3 var(--f-body); color: var(--wc); display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.book-q { background: var(--panel); border: 2px solid #000; border-left: 6px solid var(--c, var(--lv0)); }
.book-q.lv1 { --c: var(--lv1); } .book-q.lv2 { --c: var(--lv2); } .book-q.lv3 { --c: var(--lv3); } .book-q.lv4 { --c: var(--lv4); } .book-q.lv5 { --c: var(--lv5); }
.book-q > summary { display: flex; gap: 10px; align-items: center; padding: 10px; cursor: pointer; list-style: none; }
.book-q > summary::-webkit-details-marker { display: none; }
.book-q > summary b { font: 400 19px/1 var(--f-mono); color: var(--amber); }
.book-q > summary span:nth-of-type(1) { flex: 1; }
.book-body { padding: 0 12px 12px; display: grid; gap: 10px; }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(3, 7, 5, .82); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
.modal-box { position: relative; background: var(--panel); border: var(--px) solid #000; box-shadow: 0 6px 0 #000; padding: 18px 16px 16px; width: 100%; max-width: 700px; margin: auto 0; }
.m-close { position: absolute; top: 6px; right: 8px; background: none; border: 0; font-size: 20px; color: var(--mute); cursor: pointer; padding: 4px 8px; }
.settings, .help { display: grid; gap: 12px; }
.help ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.lvtxt { display: flex; align-items: center; gap: 6px; color: var(--mute); margin-right: auto; }

/* ---------- odpowiedź ustna: role zdań ---------- */
:root { --r-def: var(--green); --r-list: var(--blue); --r-det: var(--amber); --r-ex: var(--pink); --r-end: #b48cff; }
.role-def { --rc: var(--r-def); } .role-list { --rc: var(--r-list); } .role-det { --rc: var(--r-det); } .role-ex { --rc: var(--r-ex); } .role-end { --rc: var(--r-end); }
.say-def { --rc: var(--r-def); } .say-list { --rc: var(--r-list); } .say-det { --rc: var(--r-det); } .say-ex { --rc: var(--r-ex); } .say-end { --rc: var(--r-end); }
ol.say { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: s; }
ol.say > li { display: grid; grid-template-columns: 8.4em 1fr; gap: 10px; align-items: start; background: #0f1b15; border: 2px solid #000; border-left: 5px solid var(--rc); padding: 7px 10px; }
.role { font: 400 12px/1.6 var(--f-label); color: var(--rc); text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.say-t { font-size: 16px; line-height: 1.45; }
.say-t b { color: var(--amber); }
ol.say.compact > li { padding: 5px 8px; }
ol.say.compact .say-t { font-size: 15px; }
ol.say > li.fresh { animation: slidein .25s steps(3); }
@keyframes slidein { from { transform: translateX(-14px); opacity: 0; } }
.plan { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.plan-l { font: 400 12px/1.5 var(--f-label); letter-spacing: .06em; color: var(--mute); align-self: center; margin-right: 2px; }
.plan-s { display: grid; background: #0f1b15; border: 2px solid #000; border-bottom: 3px solid var(--rc); padding: 3px 8px; font-size: 13px; }
.plan-s b { color: var(--rc); font-weight: 700; }
.plan-s small { color: var(--mute); font-size: 12px; max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.answer { background: var(--blue); color: #041320; }
.ov-actions.left { justify-content: flex-start; }

/* zakładki bloku pytania */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 3px solid #000; }
.tab { background: #0f1b15; border: 2px solid #000; border-bottom: 0; padding: 6px 10px; font-size: 14px; font-weight: 600; color: var(--mute); cursor: pointer; }
.tab.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 3px 0 var(--amber); }
.tabbody { min-height: 60px; }
.tabp { display: grid; gap: 10px; }
dl.fus { margin: 0; display: grid; gap: 4px; }
dl.fus dt { font-weight: 700; color: var(--blue); margin-top: 6px; }
dl.fus dt::before { content: "? "; color: var(--amber); }
dl.fus dd { margin: 0 0 0 14px; }

/* trening na pamięć */
.reh { display: grid; gap: 10px; }
.steps { display: inline-flex; gap: 4px; margin-left: 6px; }
.steps i { width: 14px; height: 10px; background: var(--lv0); border: 2px solid #000; }
.steps i.on { background: var(--blue); }
.reh-tip { font-weight: 600; color: var(--blue); }
.mask { color: var(--amber); letter-spacing: .08em; }
.dots { color: var(--mute); letter-spacing: .05em; }

/* sala egzaminacyjna */
.room { display: grid; gap: 6px; margin-bottom: 10px; }
.room-cv { width: 100%; max-width: 400px; aspect-ratio: 320 / 88; image-rendering: pixelated; border: var(--px) solid #000; box-shadow: 0 4px 0 #000; justify-self: center; }
.room-bubble { position: relative; justify-self: center; max-width: 400px; width: 100%; background: var(--ink); color: #111; border: var(--px) solid #000; padding: 6px 10px; font-weight: 700; font-size: 15px; text-align: center; }
.room-bubble::before { content: ""; position: absolute; top: -9px; left: 46%; width: 10px; height: 10px; background: var(--ink); border-left: var(--px) solid #000; border-top: var(--px) solid #000; transform: rotate(45deg); }
.room-bubble.pop { animation: bub .25s steps(3); }
@keyframes bub { 0% { transform: scale(.85); } 100% { transform: scale(1); } }
.room-meter { display: flex; gap: 8px; align-items: center; justify-self: center; max-width: 400px; width: 100%; font-size: 12px; color: var(--mute); }
.rm-bar { flex: 1; height: 8px; background: #06100b; border: 2px solid #000; }
.rm-bar i { display: block; height: 100%; width: 50%; background: var(--amber); transition: background .3s; }

/* gry ustne */
.mw { display: grid; gap: 10px; }
.mw-stat { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
.mw-pool { display: grid; gap: 8px; }
.mw-card { text-align: left; background: var(--panel2); border: var(--px) solid #000; box-shadow: 0 3px 0 #000; padding: 9px 11px; font-size: 15px; line-height: 1.4; cursor: pointer; display: block; width: 100%; }
.mw-card b { color: var(--amber); }
.mw-card:hover:not(:disabled) { filter: brightness(1.15); }
.mw-card.used { display: none; }
.mw-card.gone { opacity: .6; background: #2a1316; text-decoration: line-through; text-decoration-color: rgba(255, 107, 107, .7); cursor: default; }
.mw-card.gone .why { text-decoration: none; display: block; }
.mw-card.bad { animation: shake .3s steps(3); border-color: var(--red); }
.why { color: #ff9a9a; font-size: 13px; font-weight: 600; display: block; margin-top: 4px; }
ol.speech > li { grid-template-columns: 6.4em 1fr; padding: 5px 8px; }
ol.speech > li:not(:last-child) .say-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--mute); font-size: 14px; }
ol.speech > li:not(:last-child) .say-t b { color: inherit; font-weight: 600; }
ol.speech:empty::before { content: "…jeszcze nic nie powiedziałeś/aś"; color: var(--mute); font-style: italic; padding: 6px 0; display: block; }
.blank { display: inline-block; min-height: 1.3em; border-bottom: 3px solid var(--mute); background: rgba(255, 255, 255, .04); padding: 0 4px; vertical-align: bottom; font-weight: 700; }
.blank.cur { border-color: var(--amber); background: rgba(255, 194, 26, .16); animation: blinkb 1s steps(2) infinite; }
.blank.filled { border-color: var(--green); color: var(--green); background: rgba(43, 212, 107, .1); animation: none; }
.blank.missed { border: 2px dashed var(--amber); color: var(--amber); animation: none; }
@keyframes blinkb { 50% { background: rgba(255, 194, 26, .04); } }
.chips.bank { position: sticky; bottom: -12px; background: var(--panel); padding: 8px 0 10px; border-top: 2px solid var(--line); max-height: 40vh; overflow-y: auto; }
.chips.bank .chip.hit { display: none; }
.blank { scroll-margin: 24px 0 44vh; }
.chip.shake { animation: shake .3s steps(3); }
.tok { background: transparent; border: 0; border-bottom: 2px dotted var(--mute); padding: 0 2px; margin: 0 1px; font: inherit; line-height: inherit; cursor: pointer; color: inherit; text-align: left; }
.tok:hover:not(:disabled) { background: rgba(255, 194, 26, .14); }
.tok.caught { background: rgba(43, 212, 107, .14); border-bottom: 2px solid var(--green); }
.tok.fine { border-bottom: 2px solid var(--line); color: var(--mute); }
.tok.missed { background: rgba(224, 48, 60, .18); border-bottom: 2px solid var(--red); }
.tok s { color: #ff8a8a; }
.tok b { color: var(--green); }
.tok:disabled { cursor: default; }
.fu-list { display: grid; gap: 8px; }
.fu-opt { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }

<script>/* js/util.js */
'use strict';
/* Drobne narzędzia wspólne dla całej gry. */
const U = {
  rnd: (a, b) => a + Math.random() * (b - a),
  ri: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },
  sample: (arr, n) => U.shuffle(arr).slice(0, n),
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  uniq(arr) {
    const seen = new Set();
    return arr.filter(x => { const k = U.key(x); if (seen.has(k)) return false; seen.add(k); return true; });
  },
  key: s => String(s).replace(/\*\*/g, '').toLowerCase().replace(/\s+/g, ' ').trim(),
  esc: s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])),
  /* **pogrubienie** → <b>, reszta escapowana */
  md: s => U.esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'),
  plain: s => String(s).replace(/\*\*/g, ''),
  cap: s => { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); },
  norm: s => U.plain(s).toLowerCase().replace(/[()„”"'.,;:!?–—\-/]/g, ' ').replace(/\s+/g, ' ').trim(),
  /* Czy pojęcie występuje w tekście (ochrona przed niejednoznacznymi dystraktorami) */
  mentions(text, term) {
    const t = U.norm(term);
    if (t.length < 3) return false;
    return U.norm(text).includes(t);
  },
  el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) e.style.setProperty(sk, v[sk]); else e.style[sk] = v[sk]; } }
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  },
  $: sel => document.querySelector(sel),
  fmt: n => Math.round(n).toLocaleString('pl-PL'),
  pl(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (n === 1) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  },
  /* Render tablicy akapitów (minimum / rozszerzenie) do HTML */
  richText(lines) {
    return lines.map(l => {
      if (l.startsWith('## ')) return `<h4>${U.md(l.slice(3))}</h4>`;
      if (l.startsWith('◦ ')) return `<p class="li li2">${U.md(l.slice(2))}</p>`;
      if (l.startsWith('• ')) return `<p class="li">${U.md(l.slice(2))}</p>`;
      if (/^\d+\. /.test(l)) return `<p class="li num">${U.md(l)}</p>`;
      return `<p>${U.md(l)}</p>`;
    }).join('');
  },
};

  cache: new Map(),
  get(name, swap) {
    const key = name + (swap ? JSON.stringify(swap) : '');
    if (this.cache.has(key)) return this.cache.get(key);
    const rows = SPRITES[name];
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '.') continue;
        const col = (swap && swap[ch]) || PAL[ch];
        if (!col) continue;
        x.fillStyle = col;
        x.fillRect(i, j, 1, 1);
      }
    });
    this.cache.set(key, c);
    return c;
  },
  url(name, scale = 4, swap) {
    const key = 'url:' + name + scale + (swap ? JSON.stringify(swap) : '');
    if (this.cache.has(key)) return this.cache.get(key);
    const s = this.get(name, swap);
    const c = document.createElement('canvas');
    c.width = s.width * scale; c.height = s.height * scale;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    x.drawImage(s, 0, 0, c.width, c.height);
    const u = c.toDataURL();
    this.cache.set(key, u);

  /* rysowanie: x,y = lewy górny róg */

    const s = this.get(name, o.swap);
    const w = s.width * scale, h = s.height * scale;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    if (o.rot || o.flip) {
      ctx.translate(x + w / 2, y + h / 2);
      if (o.rot) ctx.rotate(o.rot);
      if (o.flip) ctx.scale(-1, 1);
      ctx.drawImage(s, -w / 2, -h / 2, w, h);
    } else ctx.drawImage(s, x, y, w, h);
    ctx.restore();
    return { w, h };
  },
  /* cx = środek poziomo, by = dół */
  drawC(ctx, name, cx, by, scale = 2, o = {}) {
    const s = this.get(name, o.swap);
    return this.draw(ctx, name, cx - s.width * scale / 2, by - s.height * scale, scale, o);
  },
  size(name, scale = 2) { const s = this.get(name); return { w: s.width * scale, h: s.height * scale }; },
};

/* Tekst na canvasie (współrzędne logiczne) */
const FONT = {
  body: '"Jersey 15", "Trebuchet MS", ui-monospace, monospace',
  BODIES: { jersey: '"Jersey 15", "Trebuchet MS", ui-monospace, monospace', pixelify: '"Pixelify Sans", "Trebuchet MS", ui-monospace, monospace', system: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' },
  /* wybór czcionki z ustawień: CSS (data-font) + tekst na canvasie */
  use(kind) {
    if (!this.BODIES[kind]) kind = 'jersey';
    this.body = this.BODIES[kind];
    if (typeof document !== 'undefined') { if (kind === 'jersey') delete document.documentElement.dataset.font; else document.documentElement.dataset.font = kind; }
  },
  display: '"Press Start 2P", ui-monospace, monospace',
  mono: '"VT323", ui-monospace, monospace',
};
const TXT = {
  font: (size, weight = 500, fam = 'body') => `${weight} ${size}px ${FONT[fam] || FONT.body}`,
  wrap(ctx, text, maxW) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  },
  /* Rysuje tekst dopasowany do prostokąta (auto-rozmiar). cx, cy – środek */
  box(ctx, text, cx, cy, w, h, o = {}) {
    const sizes = o.sizes || [12, 11, 10, 9, 8, 7];
    let chosen = null;
    for (const size of sizes) {
      ctx.font = TXT.font(size, o.weight || 600, o.fam);
      const lines = TXT.wrap(ctx, text, w);
      const lh = size * 1.12;
      if (lines.length * lh <= h && lines.every(l => ctx.measureText(l).width <= w + 1)) { chosen = { size, lines, lh }; break; }
    }
    if (!chosen) {
      const size = sizes[sizes.length - 1];
      ctx.font = TXT.font(size, o.weight || 600, o.fam);
      const lh = size * 1.1;
      const maxLines = Math.max(1, Math.floor(h / lh));
      let lines = TXT.wrap(ctx, text, w);
      if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] += '…'; }
      chosen = { size, lines, lh };
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const total = chosen.lines.length * chosen.lh;
    let y = cy - total / 2 + chosen.lh / 2;
    for (const L of chosen.lines) {
      if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(L, cx + 1, y + 1); }
      ctx.fillStyle = o.color || PAL.k;
      ctx.fillText(L, cx, y);
      y += chosen.lh;
    }
  },
  line(ctx, text, x, y, o = {}) {
    ctx.font = TXT.font(o.size || 10, o.weight || 600, o.fam);
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.base || 'top';
    if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(text, x + (o.sd || 1), y + (o.sd || 1)); }
    ctx.fillStyle = o.color || PAL.w;
    ctx.fillText(text, x, y);
  },
};

/* Pikselowa ramka z fazowanymi rogami i cieniowaniem */
function pxbox(ctx, x, y, w, h, fill, edge = PAL.k) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillStyle = edge;
  ctx.fillRect(x + 2, y, w - 4, h);
  ctx.fillRect(x, y + 2, w, h - 4);
  ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = fill;
  ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(x + 2, y + 2, w - 4, 2);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(x + 2, y + h - 4, w - 4, 2);
}

<script>/* js/audio.js */
'use strict';
/* Dźwięki 8-bit generowane w WebAudio + prosty chiptune w tle. */
const AUDIO = {
  ctx: null, master: null, sfxBus: null, musicBus: null,
  sfxOn: true, musicOn: true,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.32; this.musicBus.connect(this.master);
    } catch (e) { this.ctx = null; }
  },
  resume() {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  },
  tone(freq, dur, type = 'square', vol = 0.18, slide = 0, when = 0, bus) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, freq = 1800, when = 0, bus) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(bus || this.sfxBus);
    src.start(t);
  },
  play(name) {
    if (!this.sfxOn || !this.ctx) return;
    const T = (...a) => this.tone(...a);
    switch (name) {
      case 'flap': T(520, 0.07, 'square', 0.1, 300); break;
      case 'jump': T(300, 0.12, 'square', 0.12, 420); break;
      case 'bump': T(160, 0.08, 'triangle', 0.14, -60); break;
      case 'ok': T(660, 0.08, 'square', 0.13); T(990, 0.14, 'square', 0.13, 0, 0.07); break;
      case 'bad': T(220, 0.18, 'sawtooth', 0.14, -120); T(150, 0.25, 'square', 0.1, -60, 0.1); break;
      case 'coin': T(988, 0.06, 'square', 0.1); T(1319, 0.16, 'square', 0.1, 0, 0.05); break;
      case 'chop': this.noise(0.08, 0.25, 2600); T(180, 0.06, 'square', 0.1, -80); break;
      case 'whack': this.noise(0.06, 0.3, 1200); T(110, 0.08, 'square', 0.14, -40); break;
      case 'boom': this.noise(0.6, 0.5, 700); T(90, 0.5, 'sawtooth', 0.2, -60); break;
      case 'click': T(1200, 0.03, 'square', 0.06); break;
      case 'weld': this.noise(0.12, 0.18, 5000); T(1500, 0.08, 'square', 0.06, 400); break;
      case 'tick': T(1800, 0.02, 'square', 0.05); break;
      case 'level': [523, 659, 784, 1047].forEach((f, i) => T(f, 0.12, 'square', 0.11, 0, i * 0.09)); break;
      case 'fanfare': [523, 523, 523, 698, 880, 784, 880, 1047].forEach((f, i) => T(f, 0.16, 'square', 0.11, 0, i * 0.11)); break;
      case 'lose': [392, 370, 349, 262].forEach((f, i) => T(f, 0.24, 'triangle', 0.14, 0, i * 0.2)); break;
      case 'drop': T(700, 0.15, 'triangle', 0.1, -500); break;
      case 'splash': this.noise(0.3, 0.2, 900); break;
    }
  },
  /* ---- muzyka ---- */
  seqTimer: null, step: 0, nextTime: 0, tempo: 118,
  PATTERN: {
    chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], // Am F C G
    bass: [45, 41, 36, 43],
  },
  midi: n => 440 * Math.pow(2, (n - 69) / 12),
  startMusic() {
    if (!this.ctx || !this.musicOn || this.seqTimer) return;
    this.step = 0; this.nextTime = this.ctx.currentTime + 0.05;
    this.seqTimer = setInterval(() => this.schedule(), 25);
  },
  stopMusic() { if (this.seqTimer) { clearInterval(this.seqTimer); this.seqTimer = null; } },
  setTempo(speed) { this.tempo = 110 + (speed - 1) * 90; },
  schedule() {
    if (!this.ctx) return;
    const spb = 60 / this.tempo / 4; // szesnastki
    while (this.nextTime < this.ctx.currentTime + 0.12) {
      const s = this.step % 64, bar = Math.floor(s / 16), st = s % 16;
      const when = this.nextTime - this.ctx.currentTime;
      const ch = this.PATTERN.chords[bar];
      if (st % 4 === 0) this.tone(this.midi(this.PATTERN.bass[bar]), spb * 3.2, 'triangle', 0.22, 0, when, this.musicBus);
      if (st % 4 === 2) this.tone(this.midi(this.PATTERN.bass[bar] + 12), spb * 1.4, 'triangle', 0.12, 0, when, this.musicBus);
      const arp = ch[(st + bar) % 3] + 12 + (st >= 12 ? 12 : 0);
      if (st % 2 === 0) this.tone(this.midi(arp), spb * 1.6, 'square', 0.035, 0, when, this.musicBus);
      if (st % 4 === 2) this.noise(0.03, 0.05, 7000, when, this.musicBus);
      if (st === 0 || st === 8) this.noise(0.08, 0.09, 500, when, this.musicBus);
      this.nextTime += spb;
      this.step++;
    }
  },
};

<script>/* js/store.js */
'use strict';
/* Postęp gracza: poziomy opanowania pytań (0–5), statystyki, ustawienia. */
const STORE = {
  key: 'magisterka-the-game-v2',
  data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key) || 'null'); } catch (e) { d = null; }
    this.data = this.fix(d);
  },
  fix(d) {
    d = d && typeof d === 'object' ? d : {};
    d.q = d.q || {};
    for (const q of QUESTIONS) d.q[q.id] = Object.assign({ L: 0, seen: 0, ok: 0, bad: 0, last: 0, best: 0 }, d.q[q.id] || {});
    d.ex = d.ex || {};          // licznik ekspozycji elementów (by pokazywać wszystkie fakty)
    d.best = Object.assign({ marathon: 0, final: 0 }, d.best || {});
    d.stats = Object.assign({ runs: 0, answers: 0, correct: 0, tick: 0, defenses: 0, bestCombo: 0 }, d.stats || {});
    d.set = Object.assign({ sfx: true, music: true, tempo: 1, font: 'jersey' }, d.set || {});
    d.boss = d.boss || {};
    return d;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* tryb prywatny – gra działa dalej */ } },
  reset() { this.data = this.fix(null); this.save(); },
  q(id) { return this.data.q[id]; },
  /* zapis odpowiedzi; zwraca {before, after} */
  record(id, ok, opts = {}) {
    const m = this.q(id), before = m.L;
    const d = this.data;
    d.stats.tick++;
    m.last = d.stats.tick;
    m.seen = 1;
    d.stats.answers++;
    if (ok) {
      m.ok++; d.stats.correct++;
      m.L = Math.min(5, m.L + (opts.gain || 1));
    } else {
      m.bad++;
      m.L = Math.max(0, m.L - (opts.loss == null ? 1 : opts.loss));
    }
    m.best = Math.max(m.best, m.L);
    this.save();
    return { before, after: m.L };
  },
  markSeen(id) { const m = this.q(id); if (!m.seen) { m.seen = 1; m.last = ++this.data.stats.tick; this.save(); } },
  /* ekspozycja: wybierz n elementów, preferując najrzadziej pokazywane */
  pickLeast(bucket, items, n, keyFn = x => JSON.stringify(x)) {
    const ex = this.data.ex[bucket] || (this.data.ex[bucket] = {});
    const scored = U.shuffle(items).map(it => ({ it, c: ex[this.hash(keyFn(it))] || 0 }));
    scored.sort((a, b) => a.c - b.c);
    const chosen = scored.slice(0, n).map(s => s.it);
    for (const it of chosen) { const h = this.hash(keyFn(it)); ex[h] = (ex[h] || 0) + 1; }
    return chosen;
  },
  hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); },
  mastered() { return QUESTIONS.filter(q => this.q(q.id).L >= 5).length; },
  totalL() { return QUESTIONS.reduce((s, q) => s + this.q(q.id).L, 0); },
  percent() { return Math.round(this.totalL() / (QUESTIONS.length * 5) * 100); },
  worldPct(w) {
    const qs = QUESTIONS.filter(q => q.w === w);
    return Math.round(qs.reduce((s, q) => s + this.q(q.id).L, 0) / (qs.length * 5) * 100);
  },
  RANKS: [
    [0, 'Pierwszak z indeksem'], [12, 'Student na kawie'], [40, 'Inżynier w natarciu'],
    [80, 'Magistrant'], [130, 'Magister in spe'], [175, 'Pogromca Komisji'], [200, 'Profesor zwyczajny'],
  ],
  rank() {
    const t = this.totalL();
    let r = this.RANKS[0][1];
    for (const [min, name] of this.RANKS) if (t >= min) r = name;
    return r;
  },
};

</script>
<script>/* js/challenges.js */
'use strict';
/* Generator zadań: dla pytania i poziomu opanowania tworzy wyzwanie dla minigry.
   Poziomy: 0 poznaj → 1 rozpoznaj → 2 powiąż → 3 uporządkuj → 4 odpowiedz komisji → 5 opanowane. */
const CH = {
  LEVELS: [
    ['tf', 'flappy'],
    ['flappy', 'bomb', 'tf'],
    ['match', 'bomb', 'sort', 'whac'],
    ['tower', 'sort', 'whac', 'match'],
    ['keys'],
    ['bomb', 'match', 'sort', 'whac', 'tower', 'keys', 'flappy', 'tf'],
  ],
  LEVEL_NAMES: ['Nowe', 'Rozpoznaję', 'Kojarzę', 'Porządkuję', 'Odpowiadam', 'Opanowane'],
  FLAPPY_MAX: 34, BOMB_MAX: 46,

  qById: id => QUESTIONS.find(q => q.id === id),
  world: q => QUESTIONS.filter(o => o.w === q.w),
  fullText(q) { return q._full || (q._full = [q.t, ...q.a, ...q.x, ...q.k].join(' ')); },
  normText(q) { return q._norm || (q._norm = U.norm(this.fullText(q))); },
  /* czy pojęcie pojawia się w treści pytania (tekst znormalizowany z cache) */
  inQ(q, term) { const t = U.norm(term); return t.length >= 3 && this.normText(q).includes(t); },
  /* czy dwa pojęcia z faktów tego pytania są „zbyt bliskie” */
  close(q, a, b) {
    if (U.norm(a) === U.norm(b)) return true;
    if (q.noswap.includes(a) || q.noswap.includes(b)) return true;
    return q.ns.some(g => g.includes(a) && g.includes(b));
  },
  /* dystraktor z innego pytania: nie może pojawiać się w treści bieżącego pytania */
  foreignOk(q, term) {
    if (this.inQ(q, term)) return false;
    return !q.nx.some(t => U.norm(term).includes(U.norm(t)));
  },

  available(q) {
    if (q._av) return q._av;
    const s = new Set();
    if (q.tf.length + q.f.length >= 4) s.add('tf');
    if (this.mcItems(q, this.FLAPPY_MAX).length) s.add('flappy');
    if (this.mcItems(q, this.BOMB_MAX).length) s.add('bomb');
    if (q.f.length >= 3) s.add('match');
    if (q.g.length) s.add('sort');
    if (q.s.length) s.add('whac');
    if (q.o.length || q.s.length) s.add('tower');
    if (q.k.length >= 4) s.add('keys');
    q._av = s;
    return s;
  },
  chooseType(q, level, avoid) {
    const av = this.available(q);
    const order = [level, level - 1, level + 1, level - 2, 2, 1, 0, 3, 4, 5];
    for (const L of order) {
      if (L < 0 || L > 5) continue;
      let c = this.LEVELS[L].filter(t => av.has(t));
      if (!c.length) continue;
      const c2 = c.filter(t => t !== avoid);
      if (c2.length) c = c2;
      return U.pick(c);
    }
    return 'tf';
  },
  make(q, type, level) {
    const base = { type, qid: q.id, q, level, tag: `P${String(q.id).padStart(2, '0')} · ${q.t}` };
    const fn = this['make_' + type];
    return Object.assign(base, fn.call(this, q, level));
  },

  /* ---------- wybór wielokrotny (Flappy, Bomba) ---------- */
  mcItems(q, maxLen) {
    const items = [];
    const world = this.world(q);
    for (const [term, def] of q.f) {
      if (term.length > maxLen) continue;
      items.push({ kind: 'fact', lead: 'Jakie to pojęcie?', p: U.cap(def), a: term, fix: `${term} – ${def}`, term });
    }
    for (const [text, ans, ds] of q.c) {
      if (ans.length > maxLen) continue;
      items.push({ kind: 'cloze', lead: 'Uzupełnij lukę', p: text.replace('___', '▁▁▁▁'), a: ans, d: ds, fix: text.replace('___', ans) });
    }
    for (const [text, ans, ds] of q.sc) {
      if (ans.length > maxLen || ds.some(d => d.length > maxLen)) continue;
      items.push({ kind: 'sc', lead: 'Sytuacja z hali', p: text, a: ans, d: ds, fix: `${text} → ${ans}` });
    }
    if (q.t.length <= maxLen && world.length > 1) {
      for (const [term] of q.f) {
        if (world.some(o => o.id !== q.id && this.inQ(o, term))) continue;
        items.push({ kind: 'which', lead: 'Z którego zagadnienia?', p: `„${term}” – do którego pytania należy?`, a: q.t, fix: `„${term}” → P${q.id} ${q.t}` });
      }
    }
    return items;
  },
  mcOptions(q, item, n, maxLen) {
    let pool = [];
    if (item.gen) pool = item.d.slice();
    else if (item.kind === 'fact') {
      const same = q.f.map(f => f[0]).filter(t => !this.close(q, t, item.a) && !U.mentions(item.p, t));
      const world = this.world(q).filter(o => o.id !== q.id).flatMap(o => o.f.map(f => f[0])).filter(t => this.foreignOk(q, t));
      const glob = QUESTIONS.filter(o => o.w !== q.w).flatMap(o => o.f.map(f => f[0])).filter(t => this.foreignOk(q, t));
      pool = [...U.shuffle(same), ...U.shuffle(world), ...U.shuffle(glob)];
    } else if (item.kind === 'which') {
      pool = [...U.shuffle(this.world(q).filter(o => o.id !== q.id).map(o => o.t)), ...U.shuffle(QUESTIONS.filter(o => o.w !== q.w).map(o => o.t))];
    } else pool = U.shuffle(item.d);
    pool = pool.filter(t => t.length <= maxLen && U.key(t) !== U.key(item.a));
    const opts = U.uniq([item.a, ...pool]).slice(0, n);
    const sh = U.shuffle(opts);
    return { options: sh, answer: sh.indexOf(item.a) };
  },
  pickMc(q, level, maxLen) {
    let items = this.mcItems(q, maxLen);
    if (q.gen && GEN[q.gen] && Math.random() < 0.35) items = [GEN[q.gen]()];
    if (level <= 0) { const easy = items.filter(i => i.kind !== 'which'); if (easy.length) items = easy; }
    const [it] = STORE.pickLeast('mc' + q.id, items, 1, i => i.gen ? 'gen' + i.p : i.p);
    return it;
  },
  make_flappy(q, level) {
    const it = this.pickMc(q, level, this.FLAPPY_MAX);
    const n = level <= 0 ? 2 : 3;
    const o = this.mcOptions(q, it, n, this.FLAPPY_MAX);
    return { lead: it.lead, prompt: it.p, options: o.options, answer: o.answer, fix: it.fix, kind: it.kind };
  },
  make_bomb(q, level) {
    const it = this.pickMc(q, level, this.BOMB_MAX);
    const n = level <= 1 ? 3 : 4;
    const o = this.mcOptions(q, it, n, this.BOMB_MAX);
    return { lead: it.lead, prompt: it.p, options: o.options, answer: o.answer, fix: it.fix, kind: it.kind };
  },

  /* ---------- prawda / fałsz (Drwal) ---------- */
  tfPool(q) {
    const pool = q.tf.map(([s, v, fix]) => ({ s, v, fix: fix || null, hand: true }));
    const swappable = q.f.filter(f => !q.noswap.includes(f[0]));
    for (const [term, def] of q.f) pool.push({ s: `${term}: ${def}`, v: true, fix: null });
    for (const [term, def] of swappable) {
      const others = swappable.filter(o => !this.close(q, o[0], term) && U.norm(o[1]) !== U.norm(def));
      if (!others.length) continue;
      const [, od] = U.pick(others);
      pool.push({ s: `${term}: ${od}`, v: false, fix: `${term}: ${def}` });
    }
    for (const [text, ans, ds] of q.c) {
      pool.push({ s: text.replace('___', ans), v: true, fix: null });
      pool.push({ s: text.replace('___', U.pick(ds)), v: false, fix: text.replace('___', ans) });
    }
    return pool;
  },
  make_tf(q, level) {
    const n = level <= 0 ? 4 : 5;
    const pool = this.tfPool(q);
    const hand = pool.filter(p => p.hand), gen = pool.filter(p => !p.hand);
    const nh = Math.min(hand.length, Math.ceil(n * 0.6));
    let items = [...STORE.pickLeast('tf' + q.id, hand, nh, p => p.s), ...STORE.pickLeast('tf' + q.id, gen, n - nh, p => p.s)];
    if (!items.some(i => i.v)) { const t = pool.find(p => p.v && !items.includes(p)); if (t) items[items.length - 1] = t; }
    if (!items.some(i => !i.v)) { const f = pool.find(p => !p.v && !items.includes(p)); if (f) items[items.length - 1] = f; }
    return { items: U.shuffle(items) };
  },

  /* ---------- łączenie par (Spawarka) ---------- */
  make_match(q, level) {
    const n = Math.min(q.f.length, level >= 3 ? 5 : 4);
    const chosen = [];
    for (const f of STORE.pickLeast('match' + q.id, q.f, q.f.length, f => f[0])) {
      if (chosen.length >= n) break;
      if (chosen.some(c => this.close(q, c[0], f[0]) && !(q.noswap.includes(c[0]) || q.noswap.includes(f[0])))) continue;
      chosen.push(f);
    }
    return { pairs: chosen.length >= 3 ? chosen : q.f.slice(0, n) };
  },

  /* ---------- sortowanie (Taśma) ---------- */
  make_sort(q, level) {
    const g = U.pick(q.g);
    let cats = Object.keys(g.c);
    if (cats.length > 4) cats = U.sample(cats, 4);
    const want = level >= 3 ? 8 : 6;
    const items = [];
    cats.forEach((c, i) => { const it = U.pick(g.c[c]); items.push({ t: it, c: i }); });
    const rest = U.shuffle(cats.flatMap((c, i) => g.c[c].map(t => ({ t, c: i })))).filter(x => !items.some(y => y.t === x.t));
    while (items.length < want && rest.length) items.push(rest.shift());
    return { title: g.n, cats, items: U.shuffle(items) };
  },

  /* ---------- zbiory (Młotek) ---------- */
  intruders(q, count, exclude = []) {
    const cand = QUESTIONS.filter(o => o.w !== q.w).flatMap(o => o.s.flatMap(s => s.y)).filter(t => t.length <= 40 && this.foreignOk(q, t) && !exclude.includes(t));
    return U.sample(U.uniq(cand), count);
  },
  make_whac(q, level) {
    const s = U.pick(q.s);
    const ny = Math.min(s.y.length, level >= 3 ? 6 : 5);
    const ys = U.sample(s.y, ny);
    const xs = U.uniq([...U.sample(s.x, Math.min(s.x.length, 2)), ...this.intruders(q, 3, [...s.y, ...s.x])]).slice(0, 4);
    const items = U.shuffle([...ys.map(t => ({ t, ok: true })), ...xs.map(t => ({ t, ok: false }))]);
    return { title: s.n, items, all: s.y };
  },

  /* ---------- wieża: kolejność lub zbiór (Icy Tower) ---------- */
  make_tower(q, level) {
    const nOpt = level <= 2 ? 2 : 3;
    if (q.o.length && (!q.s.length || Math.random() < 0.7)) {
      const o = U.pick(q.o);
      const rows = o.i.map((correct, k) => {
        const later = o.i.slice(k + 1), earlier = o.i.slice(0, k);
        const ds = [...U.shuffle(later), ...U.shuffle(earlier)].slice(0, nOpt - 1);
        const opts = U.shuffle([correct, ...ds]);
        return { opts, ans: opts.indexOf(correct) };
      });
      return { mode: 'order', title: o.n, seq: o.i, rows };
    }
    const s = U.pick(q.s);
    const ys = U.sample(s.y, Math.min(4, s.y.length));
    const xpool = U.uniq([...U.shuffle(s.x), ...this.intruders(q, 4, [...s.y, ...s.x])]);
    const rows = ys.map((y, i) => {
      const ds = [];
      for (let j = 0; j < nOpt - 1; j++) ds.push(xpool[(i * (nOpt - 1) + j) % xpool.length]);
      const opts = U.shuffle([y, ...U.uniq(ds)]);
      return { opts, ans: opts.indexOf(y) };
    });
    return { mode: 'set', title: s.n, seq: ys, rows, all: s.y };
  },

  /* ---------- komisja: hasła z minimum (Keys) ---------- */
  make_keys(q, level) {
    const good = STORE.pickLeast('keys' + q.id, q.k, Math.min(6, q.k.length), k => k);
    const worldK = U.shuffle(this.world(q).filter(o => o.id !== q.id).flatMap(o => o.k)).filter(k => this.foreignOk(q, k));
    const globK = U.shuffle(QUESTIONS.filter(o => o.w !== q.w).flatMap(o => o.k)).filter(k => this.foreignOk(q, k));
    const bad = U.uniq([...worldK.slice(0, 2), ...globK]).filter(b => !good.includes(b)).slice(0, 4);
    const chips = U.shuffle([...good.map(t => ({ t, ok: true })), ...bad.map(t => ({ t, ok: false }))]);
    return { chips };
  },
};

/* ---------- zadania liczbowe ---------- */
const GEN = {
  num: (v, d = 1) => v.toFixed(d).replace('.', ','),
  /* dystraktory liczbowe; gdy się dublują, dopełnia je przesunięciami wyniku */
  choices(correct, wrongs, suffix = '') {
    const d = U.uniq(wrongs.filter(w => w !== correct));
    const base = parseFloat(String(correct).replace(',', '.'));
    const dec = (String(correct).split(',')[1] || '').replace(/\D/g, '').length;
    let k = 1;
    while (d.length < 3 && k < 20) {
      const v = base + (k % 2 ? 1 : -1) * (Math.ceil(k / 2) * (dec ? 3.7 : 7));
      const str = (dec ? v.toFixed(dec).replace('.', ',') : String(Math.round(v))) + suffix;
      if (str !== correct && !d.includes(str) && v > 0) d.push(str);
      k++;
    }
    return d.slice(0, 3);
  },
  oee() {
    const A = U.ri(80, 97) / 100, W = U.ri(75, 96) / 100, J = U.ri(85, 99) / 100;
    const P = U.pick([100, 420, 450, 480]);
    const B = Math.round(P * A);
    const C = U.pick([1000, 1200, 2000, 150000, 5000]);
    const D = Math.round(C * W), F = Math.round(D * J);
    const a = B / P, w = D / C, j = F / D, oee = a * w * j * 100;
    const ask = U.pick(['oee', 'oee', 'oee', 'A', 'W', 'J']);
    const stem = `Planowany czas ${P} min, rzeczywisty czas pracy ${B} min. Oczekiwano ${U.fmt(C)} szt., wyprodukowano ${U.fmt(D)}, w tym dobrych ${U.fmt(F)}.`;
    if (ask === 'oee') {
      const ans = GEN.num(oee) + '%';
      const wr = [GEN.num((a + w + j) / 3 * 100) + '%', GEN.num(a * w * 100) + '%', GEN.num(oee + U.ri(4, 9)) + '%', GEN.num(Math.max(1, oee - U.ri(4, 9))) + '%'];
      return { gen: 1, kind: 'num', lead: 'Policz OEE', p: `${stem} OEE = ?`, a: ans, d: GEN.choices(ans, wr, '%'), fix: `OEE = ${B}/${P} × ${U.fmt(D)}/${U.fmt(C)} × ${U.fmt(F)}/${U.fmt(D)} = ${GEN.num(a, 2)} × ${GEN.num(w, 2)} × ${GEN.num(j, 2)} = ${ans}` };
    }
    const map = { A: ['Dostępność', a, `${B}/${P}`], W: ['Wydajność', w, `${U.fmt(D)}/${U.fmt(C)}`], J: ['Jakość', j, `${U.fmt(F)}/${U.fmt(D)}`] };
    const [name, val, frac] = map[ask];
    const ans = GEN.num(val * 100) + '%';
    const others = Object.values(map).filter(m => m[0] !== name).map(m => GEN.num(m[1] * 100) + '%');
    return { gen: 1, kind: 'num', lead: `Policz: ${name}`, p: `${stem} ${name} = ?`, a: ans, d: GEN.choices(ans, [...others, GEN.num(oee) + '%'], '%'), fix: `${name} = ${frac} = ${ans}` };
  },
  evm() {
    let bcwp, acwp, bcws;
    do { bcwp = U.ri(6, 15) * 10; acwp = U.ri(6, 15) * 10; bcws = U.ri(6, 15) * 10; } while (bcwp === acwp || bcwp === bcws || acwp === bcws);
    const ask = U.pick(['CV', 'SV', 'CPI', 'SPI']);
    const stem = `BCWP = ${bcwp}, ACWP = ${acwp}, BCWS = ${bcws}.`;
    const r = (x, y) => GEN.num(x / y, 2);
    let ans, wr, fix;
    if (ask === 'CV') { ans = String(bcwp - acwp); wr = [String(bcwp - bcws), String(acwp - bcwp), r(bcwp, acwp)]; fix = `CV = BCWP − ACWP = ${bcwp} − ${acwp} = ${ans}`; }
    if (ask === 'SV') { ans = String(bcwp - bcws); wr = [String(bcwp - acwp), String(bcws - bcwp), r(bcwp, bcws)]; fix = `SV = BCWP − BCWS = ${bcwp} − ${bcws} = ${ans}`; }
    if (ask === 'CPI') { ans = r(bcwp, acwp); wr = [r(bcwp, bcws), r(acwp, bcwp), String(bcwp - acwp)]; fix = `CPI = BCWP / ACWP = ${bcwp} / ${acwp} = ${ans}`; }
    if (ask === 'SPI') { ans = r(bcwp, bcws); wr = [r(bcwp, acwp), r(bcws, bcwp), String(bcwp - bcws)]; fix = `SPI = BCWP / BCWS = ${bcwp} / ${bcws} = ${ans}`; }
    return { gen: 1, kind: 'num', lead: `Policz ${ask} (EVM)`, p: `${stem} ${ask} = ?`, a: ans, d: GEN.choices(ans, wr), fix };
  },
  rpn() {
    const S = U.ri(2, 10), O = U.ri(1, 9), D = U.ri(1, 9);
    const ans = String(S * O * D);
    const wr = [String(S + O + D), String(S * O), String(S * O * D + U.ri(5, 40)), String(Math.max(1, S * O * D - U.ri(5, 30)))];
    return { gen: 1, kind: 'num', lead: 'Policz RPN (FMEA)', p: `Znaczenie S = ${S}, częstość O = ${O}, wykrywalność D = ${D}. RPN = ?`, a: ans, d: GEN.choices(ans, wr), fix: `RPN = S × O × D = ${S} × ${O} × ${D} = ${ans}` };
  },
};

<script>/* js/challenges-oral.js */
'use strict';
/* Zadania na poziomie całej odpowiedzi ustnej:
   builder (Mównica – ułóż wypowiedź), luki (znikający tekst), hunt (łowca błędów), fu (pytanie dodatkowe). */
Object.assign(CH, {
  ROLE_RANK: { def: 0, list: 1, det: 2, ex: 3, end: 4 },
  ROLE_NAME: { def: 'Definicja', list: 'Wyliczenie', det: 'Rozwinięcie', ex: 'Przykład', end: 'Domknięcie' },
  ANSWER_TYPES: ['builder', 'luki', 'hunt', 'fu', 'keys'],

  /* podział zdania na fragmenty: tekst zwykły i **pojęcia** */
  parseBold(t) {
    const out = [];
    const re = /\*\*(.+?)\*\*/g;
    let last = 0, m;
    while ((m = re.exec(t))) {
      if (m.index > last) out.push({ k: 'txt', t: t.slice(last, m.index) });
      out.push({ k: 'b', t: m[1] });
      last = re.lastIndex;
    }
    if (last < t.length) out.push({ k: 'txt', t: t.slice(last) });
    return out;
  },
  sayPlain(q) { return q.say.map(s => U.plain(s[1])).join(' '); },
  boldTerms(q) { return q.say.flatMap(s => this.parseBold(s[1]).filter(p => p.k === 'b').map(p => p.t)); },
  /* plan odpowiedzi: role + pierwsze pojęcie zdania jako podpowiedź */
  plan(q) {
    return q.say.map(([r, t]) => {
      const b = this.parseBold(t).find(p => p.k === 'b');
      return { role: r, name: this.ROLE_NAME[r], cue: b ? b.t : '' };
    });
  },

  /* ---------- Mównica: ułóż wypowiedź ---------- */
  make_builder(q, level) {
    const sents = q.say.map(([r, t], i) => ({ i, role: r, rank: this.ROLE_RANK[r], t }));
    const intr = [];
    const others = this.world(q).filter(o => o.id !== q.id && o.say.length);
    const pool = (others.length ? others : QUESTIONS.filter(o => o.id !== q.id)).flatMap(o => o.say.filter(s => s[0] !== 'def').map(s => ({ o, t: s[1] })));
    const foreign = U.shuffle(pool).find(x => !x.o.say.some(s => s[1] === x.t && q.say.some(y => y[1] === x.t)));
    if (foreign) intr.push({ t: foreign.t, why: `To zdanie pochodzi z innego pytania: P${foreign.o.id} ${foreign.o.t}.` });
    if (level >= 4 || Math.random() < 0.35) {
      const e = U.shuffle(q.err).find(([o]) => q.say.some(s => s[1].includes(o)));
      if (e) {
        const s = q.say.find(x => x[1].includes(e[0]));
        intr.push({ t: s[1].replace(e[0], e[1]), why: `Błąd merytoryczny: „${U.plain(e[1])}” zamiast „${U.plain(e[0])}”.`, twin: true });
      }
    }
    return { sents, intr, plan: this.plan(q) };
  },

  /* ---------- Luki: znikający tekst ---------- */
  make_luki(q, level) {
    const parts = q.say.map(s => this.parseBold(s[1]));
    const cands = [];
    const seenT = new Set();
    parts.forEach((ps, si) => ps.forEach((p, pi) => {
      if (p.k !== 'b' || p.t.length > 48 || seenT.has(U.key(p.t))) return;
      seenT.add(U.key(p.t));
      cands.push({ si, pi, t: p.t });
    }));
    const frac = level >= 4 ? 0.7 : 0.4;
    const n = U.clamp(Math.round(cands.length * frac), Math.min(3, cands.length), 9);
    const chosen = U.sample(cands, n).sort((a, b) => a.si - b.si || a.pi - b.pi);
    chosen.forEach((c, j) => { parts[c.si][c.pi].blank = j; });
    const wrongs = q.err.map(e => U.plain(e[1])).filter(w => w.length <= 48);
    const foreign = U.shuffle(this.world(q).filter(o => o.id !== q.id).flatMap(o => this.boldTerms(o))).filter(t => t.length <= 40 && !this.inQ(q, t));
    const nd = level >= 4 ? 4 : 3;
    const dist = U.uniq([...U.sample(wrongs, 2), ...foreign]).filter(d => !chosen.some(c => U.key(c.t) === U.key(d))).slice(0, nd);
    const bank = U.shuffle([...chosen.map(c => ({ t: c.t, ok: true })), ...dist.map(t => ({ t, ok: false }))]);
    return { parts, roles: q.say.map(s => s[0]), blanks: chosen.map(c => c.t), bank };
  },

  /* ---------- Łowca błędów ---------- */
  make_hunt(q, level) {
    const want = level >= 5 ? 3 : 2;
    const sents = q.say.map(s => s[1]);
    const used = new Set();
    const errs = [];
    for (const [o, w] of U.shuffle(q.err)) {
      if (errs.length >= want) break;
      const si = sents.findIndex((t, i) => !used.has(i) && t.includes(o));
      if (si < 0) continue;
      used.add(si);
      sents[si] = sents[si].replace(o, '\u0001' + errs.length + '\u0003' + w + '\u0002');
      errs.push({ o: U.plain(o), w: U.plain(w) });
    }
    const segs = sents.map(t => this.huntSegments(t, errs));
    return { segs, roles: q.say.map(s => s[0]), n: errs.length, errs };
  },
  huntSegments(t, errs) {
    // znacznik błędu: \u0001<id>\u0003<tekst>\u0002 ; może leżeć wewnątrz **…** albo zawierać **…**
    const out = [];
    const re = /\*\*(.+?)\*\*|\u0001(\d+)\u0003([\s\S]+?)\u0002/g;
    let last = 0, m;
    while ((m = re.exec(t))) {
      if (m.index > last) out.push({ k: 'txt', t: t.slice(last, m.index) });
      if (m[1] != null) {
        const inner = m[1];
        const em = /\u0001(\d+)\u0003([\s\S]+?)\u0002/.exec(inner);
        if (em) {
          const e = errs[+em[1]];
          out.push({ k: 'tok', err: true, t: U.plain(inner.replace(em[0], em[2])), fix: U.plain(inner.replace(em[0], e.o)) });
        } else out.push({ k: 'tok', err: false, t: inner });
      } else {
        const e = errs[+m[2]];
        out.push({ k: 'tok', err: true, t: U.plain(m[3]), fix: e.o });
      }
      last = re.lastIndex;
    }
    if (last < t.length) out.push({ k: 'txt', t: t.slice(last) });
    return out;
  },

  /* ---------- Pytanie dodatkowe ---------- */
  make_fu(q, level) {
    const [f] = STORE.pickLeast('fu' + q.id, q.fu, 1, x => x[0]);
    const others = U.shuffle(this.world(q).filter(o => o.id !== q.id).flatMap(o => o.fu.map(x => x[1])));
    const glob = U.shuffle(QUESTIONS.filter(o => o.w !== q.w).flatMap(o => o.fu.map(x => x[1])));
    const third = [...others, ...glob].find(a => U.key(a) !== U.key(f[1]) && U.key(a) !== U.key(f[2]));
    const opts = U.shuffle([f[1], f[2], third].filter(Boolean));
    return { question: f[0], options: opts, answer: opts.indexOf(f[1]), fix: f[1] };
  },
});

/* dostępność i wybór typów z uwzględnieniem zadań „ustnych” */
(function () {
  const baseAvail = CH.available.bind(CH);
  CH.available = function (q) {
    const s = baseAvail(q);
    if (!q._avOral) {
      if (q.say.length >= 4) s.add('builder');
      if (CH.boldTerms(q).length >= 4) s.add('luki');
      if (q.err.length >= 2) s.add('hunt');
      if (q.fu.length >= 1) s.add('fu');
      q._avOral = true;
    }
    return s;
  };
  CH.LEVELS = [
    ['tf', 'flappy'],
    ['flappy', 'bomb', 'tf', 'match'],
    ['match', 'sort', 'whac', 'tower', 'bomb'],
    ['builder', 'luki', 'fu'],
    ['hunt', 'luki', 'keys', 'fu', 'builder'],
    ['builder', 'luki', 'hunt', 'fu', 'keys', 'bomb', 'match', 'sort', 'tower', 'whac', 'flappy', 'tf'],
  ];
  CH.LEVEL_NAMES = ['Nowe', 'Rozpoznaję', 'Kojarzę', 'Układam odpowiedź', 'Mówię jak na obronie', 'Opanowane'];
  const baseChoose = CH.chooseType.bind(CH);
  CH.chooseType = function (q, level, avoid) {
    if (level >= 5 && Math.random() < 0.65) return CH.chooseAnswerType(q, 5, avoid);
    return baseChoose(q, level, avoid);
  };
  /* tylko zadania „ustne” – tryb Trening odpowiedzi */
  CH.chooseAnswerType = function (q, level, avoid) {
    const av = CH.available(q);
    let c = (level < 3 ? ['builder', 'luki', 'fu'] : ['hunt', 'luki', 'keys', 'fu', 'builder']).filter(t => av.has(t));
    if (!c.length) c = CH.ANSWER_TYPES.filter(t => av.has(t));
    const c2 = c.filter(t => t !== avoid);
    return U.pick(c2.length ? c2 : c);
  };
})();

<script>/* js/stage.js */
'use strict';
/* Scena minigier: canvas 400×300 (współrzędne logiczne), pętla, wejście, efekty. */
const STAGE = {
  W: 400, H: 300,
  cv: null, ctx: null, k: 1,
  mg: null, onDone: null, pending: null,
  intro: 0, outro: 0, active: false, paused: false, dom: false,
  particles: [], floats: [], shakeT: 0, shakeA: 0, flashT: 0, flashCol: '#fff',
  speed: 1, t: 0,

  init() {
    this.cv = U.$('#cv');
    this.ctx = this.cv.getContext('2d');
    this.stageEl = U.$('#stage');
    this.wrapEl = U.$('#stage-wrap');
    this.panel = U.$('#panel');
    this.controlsEl = U.$('#controls');
    this.promptEl = U.$('#prompt');
    this.splashEl = U.$('#splash');
    const ro = new ResizeObserver(() => this.resize());
    ro.observe(this.wrapEl);
    window.addEventListener('resize', () => this.resize());
    const pos = e => {
      const r = this.cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * this.W, (e.clientY - r.top) / r.height * this.H];
    };
    this.cv.addEventListener('pointerdown', e => {
      e.preventDefault();
      AUDIO.resume();
      if (!this.canInput()) return;
      const [x, y] = pos(e);
      this.cv.setPointerCapture && this.cv.setPointerCapture(e.pointerId);
      this.mg.pointer('down', x, y);
    });
    const up = e => { if (this.mg && this.active) { const [x, y] = pos(e); this.mg.pointer('up', x, y); } };
    this.cv.addEventListener('pointerup', up);
    this.cv.addEventListener('pointercancel', up);
    this.cv.addEventListener('pointermove', e => { if (this.canInput()) { const [x, y] = pos(e); this.mg.pointer('move', x, y); } });
    requestAnimationFrame(t => this.frame(t));
  },
  canInput() { return this.active && !this.paused && this.mg && !this.mg.done && this.intro <= 0; },
  /* Wymiary logiczne: poziomo 400×300; na telefonie w pionie węższa i wyższa scena (większe napisy). */
  computeDims() {
    const aw = this.wrapEl.clientWidth || 400;
    const ah = (this.wrapEl.clientHeight || 300) - (this.controlsEl.childElementCount ? 0 : 72);
    if (aw < 600 && ah > aw * 0.95) { this.W = 320; this.H = U.clamp(Math.round(ah / aw * 320), 300, 540); }
    else { this.W = 400; this.H = 300; }
    this.portrait = this.W < 400;
  },
  resize() {
    if (!this.wrapEl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    if (this.dom) { this.stageEl.style.width = ''; this.stageEl.style.height = ''; return; }
    const aw = this.wrapEl.clientWidth, ah = this.wrapEl.clientHeight;
    if (!aw || !ah) return;
    const ar = this.W / this.H;
    let w = Math.min(aw, ah * ar, 880);
    w = Math.max(200, Math.floor(w));
    const h = Math.floor(w / ar);
    this.stageEl.style.width = w + 'px';
    this.stageEl.style.height = h + 'px';
    const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
    if (this.cv.width !== bw || this.cv.height !== bh) { this.cv.width = bw; this.cv.height = bh; }
    this.k = bw / this.W;
  },
  /* ---- API dla minigier ---- */
  prompt(o) {
    const el = this.promptEl;
    el.querySelector('.lead').textContent = o.lead || '';
    const t = el.querySelector('.text');
    if (o.html != null) t.innerHTML = o.html; else t.textContent = o.text || '';
    t.classList.toggle('long', (o.text || o.html || '').length > 150);
    el.querySelector('.sub').textContent = o.sub || '';
  },
  controls(list) {
    this.controlsEl.innerHTML = '';
    for (const c of list || []) {
      const b = U.el('button', { class: 'ctl ' + (c.cls || ''), tabindex: '-1', type: 'button' }, c.label);
      const down = e => { e.preventDefault(); AUDIO.resume(); if (this.canInput()) this.mg.key(c.key, true); b.classList.add('down'); };
      const upf = () => { if (this.mg && this.active) this.mg.key(c.key, false); b.classList.remove('down'); };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', upf);
      b.addEventListener('pointerleave', upf);
      b.addEventListener('pointercancel', upf);
      this.controlsEl.append(b);
    }
  },
  setDom(on) {
    this.dom = on;
    this.stageEl.classList.toggle('dom', on);
    this.panel.innerHTML = '';
    this.panel.hidden = !on;
    this.resize();
  },
  sfx(n) { AUDIO.play(n); },
  shake(a = 4, t = 0.25) { this.shakeA = a; this.shakeT = t; },
  flash(col = '#fff', t = 0.15) { this.flashCol = col; this.flashT = t; },
  burst(x, y, color = PAL.y, n = 14, spd = 120) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random());
      this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.5, max: 1, color: Array.isArray(color) ? U.pick(color) : color, s: 2 + Math.floor(Math.random() * 3) });
    }
  },
  float(text, x, y, color = PAL.y, size = 14) { this.floats.push({ text, x, y, vy: -38, life: 1.1, color, size }); },
  /* ---- cykl życia minigry ---- */
  load(mg, onDone) {
    this.mg = mg; this.onDone = onDone; this.pending = null; this.outro = 0;
    this.particles = []; this.floats = [];
    this.active = true; this.paused = false;
    this.speed = mg.ch.speed || 1;
    this.setDom(!!mg.constructor.dom);
    this.controls([]);
    this.computeDims();
    mg.W = this.W; mg.H = this.H;
    mg.start();
    const info = mg.constructor.intro || { title: 'GRAJ!', hint: '' };
    this.intro = Math.max(0.75, 1.15 / Math.sqrt(this.speed));
    this.splashEl.innerHTML = '';
    this.splashEl.append(U.el('div', { class: 'sp-title' }, info.title), U.el('div', { class: 'sp-hint' }, info.hint));
    this.splashEl.hidden = false;
    this.splashEl.classList.remove('go'); void this.splashEl.offsetWidth; this.splashEl.classList.add('go');
    this.resize();
  },
  finish(res, delay = 0.85) {
    if (this.pending) return;
    this.pending = res;
    this.outro = delay;
  },
  stop() { this.active = false; this.mg = null; this.splashEl.hidden = true; this.controls([]); },
  frame(t) {
    const dt = Math.min(0.05, (t - (this.lastT || t)) / 1000);
    this.lastT = t;
    if (this.active && !this.paused && this.mg) {
      this.t += dt;
      this.update(dt);
      if (!this.dom) this.draw();
    }
    requestAnimationFrame(tt => this.frame(tt));
  },
  update(dt) {
    if (this.intro > 0) {
      this.intro -= dt;
      if (this.intro <= 0) { this.splashEl.hidden = true; this.mg.begin && this.mg.begin(); }
    } else this.mg.update(dt);
    for (const p of this.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt; }
    this.particles = this.particles.filter(p => p.life > 0);
    for (const f of this.floats) { f.y += f.vy * dt; f.life -= dt; }
    this.floats = this.floats.filter(f => f.life > 0);
    if (this.shakeT > 0) this.shakeT -= dt;
    if (this.flashT > 0) this.flashT -= dt;
    if (this.pending && this.intro <= 0) {
      this.outro -= dt;
      if (this.outro <= 0) {
        const res = this.pending, cb = this.onDone;
        this.pending = null;
        this.active = false;
        cb && cb(res);
      }
    }
  },
  draw() {
    const c = this.ctx;
    c.setTransform(this.k, 0, 0, this.k, 0, 0);
    c.imageSmoothingEnabled = false;
    c.save();
    if (this.shakeT > 0) c.translate(U.rnd(-this.shakeA, this.shakeA), U.rnd(-this.shakeA, this.shakeA));
    c.fillStyle = '#0c1410';
    c.fillRect(-10, -10, this.W + 20, this.H + 20);
    this.mg.draw(c);
    for (const p of this.particles) { c.globalAlpha = U.clamp(p.life * 2, 0, 1); c.fillStyle = p.color; c.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
    c.globalAlpha = 1;
    for (const f of this.floats) {
      c.globalAlpha = U.clamp(f.life * 1.6, 0, 1);
      TXT.line(c, f.text, f.x, f.y, { size: f.size, align: 'center', color: f.color, shadow: PAL.k, sd: 2, weight: 700, fam: 'body' });
    }
    c.globalAlpha = 1;
    c.restore();
    if (this.flashT > 0) { c.globalAlpha = U.clamp(this.flashT * 4, 0, 0.7); c.fillStyle = this.flashCol; c.fillRect(0, 0, this.W, this.H); c.globalAlpha = 1; }
  },
  /* pasek czasu na górze sceny */
  timerBar(c, frac) {
    frac = U.clamp(frac, 0, 1);
    const w = this.W - 16;
    c.fillStyle = PAL.k; c.fillRect(6, 4, w + 4, 9);
    c.fillStyle = '#1e3629'; c.fillRect(8, 6, w, 5);
    c.fillStyle = frac > 0.5 ? PAL.g : frac > 0.25 ? PAL.y : PAL.r;
    c.fillRect(8, 6, Math.round(w * frac), 5);
  },
};

/* Bazowa klasa minigry */
class MG {
  constructor(ch) { this.ch = ch; this.t = 0; this.done = false; this.S = STAGE; this.speed = ch.speed || 1; }
  start() {}
  update(dt) { this.t += dt; }
  draw() {}
  key() {}
  pointer() {}
  end(res, delay) { if (this.done) return; this.done = true; this.S.finish(res, delay); }
}
const MINIGAMES = {};
