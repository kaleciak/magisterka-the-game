<script>/* js/run.js */
'use strict';
/* Runda: dobór pytań (powtórki rozłożone w czasie), życia, combo, tempo, wynik. */
const RUN = {
  s: null,
  MODES: {
    marathon: { title: 'Maraton', cap: 4 },
    world: { title: 'Świat', cap: 3 },
    focus: { title: 'Trening pytania', cap: 1 },
    drill: { title: 'Poprawka błędów', cap: 6 },
    answers: { title: 'Trening odpowiedzi', cap: 5 },
    boss: { title: 'Boss: Komisja', cap: 0 },
    final: { title: 'Egzamin końcowy', cap: 0 },
  },
  start(opts) {
    const base = STORE.data.set.tempo || 1;
    const mode = this.MODES[opts.mode];
    this.s = {
      opts, mode: opts.mode, title: opts.title || mode.title, pool: opts.pool.slice(), cap: opts.cap || mode.cap,
      hearts: 3, maxHearts: 3, score: 0, combo: 0, bestCombo: 0, base, speed: base,
      count: 0, correct: 0, retry: [], log: [], lastQ: null, lastType: null,
      start: {}, queue: null, boss: null, over: false,
    };
    for (const q of QUESTIONS) this.s.start[q.id] = STORE.q(q.id).L;
    if (opts.mode === 'boss') { this.s.queue = U.shuffle(opts.pool); this.s.boss = { hp: this.s.queue.length, max: this.s.queue.length }; }
    if (opts.mode === 'final') this.s.queue = U.sample(QUESTIONS, 12);
    STORE.data.stats.runs++; STORE.save();
    UI.overlay(null);
    UI.show('game');
    UI.hud();
    AUDIO.resume();
    if (STORE.data.set.music) AUDIO.startMusic();
    AUDIO.setTempo(this.s.speed);
    setTimeout(() => this.next(), 60);
  },
  pickQuestion() {
    const s = this.s;
    const di = s.retry.findIndex(r => r.at <= s.count);
    if (di >= 0) return s.retry.splice(di, 1)[0].q;
    const M = q => STORE.q(q.id);
    const learning = s.pool.filter(q => M(q).seen && M(q).L < 5);
    const unseen = s.pool.filter(q => !M(q).seen);
    const mastered = s.pool.filter(q => M(q).L >= 5);
    if (unseen.length && learning.length < s.cap) return unseen[0];
    let cands = learning.length ? learning : unseen.length ? [unseen[0]] : mastered;
    if (mastered.length && learning.length && Math.random() < 0.12) cands = mastered;
    if (!cands.length) cands = s.pool;
    let c2 = cands.filter(q => q.id !== s.lastQ);
    if (!c2.length) c2 = cands;
    c2.sort((a, b) => (M(a).last + M(a).L * 2) - (M(b).last + M(b).L * 2));
    return c2[Math.floor(Math.random() * Math.min(2, c2.length))];
  },
  next() {
    const s = this.s;
    if (!s || s.over) return;
    if (s.hearts <= 0) return this.end('dead');
    const allDone = s.pool.every(q => STORE.q(q.id).L >= 5);
    if (s.count > 0 && (s.mode === 'focus' || s.mode === 'world' || s.mode === 'drill') && allDone) return this.end('mastered');
    if (s.count > 0 && s.mode === 'answers' && s.count >= s.pool.length * 3 && allDone) return this.end('mastered');
    if ((s.mode === 'boss' || s.mode === 'final') && !s.queue.length) return this.end('win');
    let q, type;
    if (s.mode === 'boss') { q = s.queue[0]; type = CH.chooseAnswerType(q, 4, s.lastType); }
    else if (s.mode === 'final') { q = s.queue[0]; type = CH.chooseType(q, 5, s.lastType); }
    else if (s.mode === 'answers') { q = this.pickQuestion(); type = CH.chooseAnswerType(q, STORE.q(q.id).L, s.lastType); }
    else { q = this.pickQuestion(); type = CH.chooseType(q, STORE.q(q.id).L, s.lastType); }
    if (!STORE.q(q.id).seen && s.mode !== 'boss' && s.mode !== 'final') UI.learnCard(q, () => this.play(q, type));
    else this.play(q, type);
  },
  play(q, type) {
    const s = this.s;
    if (s.over) return;
    const level = s.mode === 'final' ? 5 : STORE.q(q.id).L;
    const ch = CH.make(q, type, level);
    ch.speed = s.speed;
    if (s.boss) ch.boss = s.boss;
    s.lastQ = q.id; s.lastType = type;
    UI.hud(q);
    STAGE.load(new MINIGAMES[type](ch), res => this.onResult(q, ch, res));
  },
  onResult(q, ch, res) {
    const s = this.s;
    if (!s || s.over) return;
    s.count++;
    const rec = STORE.record(q.id, res.ok);
    s.log.push({ q, type: ch.type, ok: res.ok, before: rec.before, after: rec.after, res });
    if (res.ok) {
      s.correct++; s.combo++;
      s.bestCombo = Math.max(s.bestCombo, s.combo);
      STORE.data.stats.bestCombo = Math.max(STORE.data.stats.bestCombo, s.combo);
      const gain = Math.round((100 + 40 * rec.before) * (1 + Math.min(s.combo, 20) * 0.1) * s.speed);
      s.score += gain;
      s.speed = Math.min(s.base + 0.75, s.speed + 0.05);
      UI.toast(`+${U.fmt(gain)}${s.combo >= 3 ? ` · COMBO ×${s.combo}` : ''}`, 'good');
      if (rec.after > rec.before) UI.toast(`P${q.id}: ${CH.LEVEL_NAMES[rec.after]} ${'★'.repeat(rec.after)}`, 'lvl');
      if (rec.after === 5 && rec.before < 5) UI.celebrate(`P${String(q.id).padStart(2, '0')} OPANOWANE!`, q.t);
      if (s.combo % 8 === 0 && s.hearts < s.maxHearts) { s.hearts++; UI.toast('+♥ Kawa z automatu!', 'heart'); AUDIO.play('coin'); }
      if (s.combo % 5 === 0) { AUDIO.play('level'); UI.toast('TEMPO ↑', 'tempo'); }
      if (res.note) UI.toast(res.note, 'note');
      if (s.boss) { s.queue.shift(); s.boss.hp--; }
      if (s.mode === 'final') s.queue.shift();
    } else {
      s.combo = 0; s.hearts--;
      s.speed = Math.max(s.base, s.speed - 0.12);
      if (s.mode === 'boss') s.queue.push(s.queue.shift());
      else if (s.mode === 'final') s.queue.shift();
      else s.retry.push({ q, at: s.count + 2 });
      if (s.hearts <= 0) AUDIO.play('lose');
    }
    AUDIO.setTempo(s.speed);
    UI.hud(q);
    if (!res.ok && !res.skipCorrection) UI.correction(q, ch, res, rec, () => this.next());
    else setTimeout(() => this.next(), res.ok ? 250 : 400);
  },
  pause() {
    if (!this.s || this.s.over) return;
    if (UI.ovKind && UI.ovKind !== 'pause') return; // karta nauki / poprawka już wstrzymuje grę
    STAGE.paused = true; UI.pauseMenu();
  },
  resume() { STAGE.paused = false; UI.overlay(null); },
  end(reason) {
    const s = this.s;
    if (!s || s.over) return;
    s.over = true;
    STAGE.stop();
    AUDIO.stopMusic();
    const key = s.mode === 'final' ? 'final' : 'marathon';
    let record = false;
    if ((s.mode === 'marathon' || s.mode === 'final') && s.score > (STORE.data.best[key] || 0)) { STORE.data.best[key] = s.score; record = true; }
    if (s.mode === 'boss' && reason === 'win') STORE.data.boss[s.opts.world] = true;
    STORE.save();
    if (['win', 'mastered'].includes(reason)) AUDIO.play('fanfare');
    UI.summary(s, reason, record);
  },
  quit() { if (this.s && !this.s.over) this.end('quit'); },
};

</script>
<script>/* js/scene.js */
'use strict';
/* Animowana scena tytułowa: nocny Kraków, gmach główny AGH z hutnikiem i górnikiem, huta z iskrami,
   student idący na obronę. Rysowana w 320×96 i skalowana pikselowo. */
const SCENE = {
  raf: 0,
  title(cv) {
    const W = 320, H = 96, c = cv.getContext('2d');
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stars = Array.from({ length: 34 }, () => ({ x: U.ri(0, W - 1), y: U.ri(0, 38), p: Math.random() * 6 }));
    const lit = Array.from({ length: 24 }, () => Math.random() < 0.55);
    const sparks = [], smoke = [];
    let t = 0, sx = -12, last = performance.now(), cap = null;
    const R = (col, x, y, w, h) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, w, h); };
    const draw = () => {
      c.imageSmoothingEnabled = false;
      // niebo pasami (pikselowy gradient)
      ['#07101c', '#0a1522', '#0d1b29', '#112233', '#16293a'].forEach((col, i) => R(col, 0, i * 12, W, 12));
      for (const s of stars) if ((t * 1.3 + s.p) % 6 > 0.5) R(s.p > 3 ? '#f2ecd9' : '#8fa3b8', s.x, s.y, 1, 1);
      ['..###..', '.###...', '###....', '###....', '###....', '.###...', '..###..'].forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '#') R('#f6e7b0', 24 + x, 6 + y, 1, 1); }));
      // panorama Krakowa (Wawel, Mariacki)
      c.fillStyle = '#0c1826';
      c.beginPath(); c.moveTo(0, 62);
      [[0, 54], [18, 54], [18, 46], [22, 42], [26, 46], [26, 52], [40, 52], [44, 40], [46, 36], [48, 40], [52, 52], [70, 50], [72, 44], [76, 44], [76, 50], [98, 52], [98, 62]].forEach(([x, y]) => c.lineTo(x, y));
      c.fill();
      c.fillStyle = '#0c1826';
      c.beginPath(); c.moveTo(250, 62); [[250, 50], [262, 50], [262, 40], [265, 32], [268, 40], [268, 48], [276, 48], [278, 42], [281, 42], [283, 48], [320, 50], [320, 62]].forEach(([x, y]) => c.lineTo(x, y)); c.fill();
      // gmach główny AGH (A-0)
      R('#0b0f0c', 94, 30, 132, 50);
      R('#3b4a42', 96, 32, 128, 48);
      R('#46574d', 96, 32, 128, 3);
      R('#0b0f0c', 138, 22, 44, 10); R('#52645a', 140, 24, 40, 8);
      // litery AGH z pikseli (bez czcionek)
      const A = ['.#.', '#.#', '###', '#.#', '#.#'], G = ['###', '#..', '#.#', '#.#', '###'], Hh = ['#.#', '#.#', '###', '#.#', '#.#'];
      [A, G, Hh].forEach((L, li) => L.forEach((row, ry) => [...row].forEach((ch, rx) => { if (ch === '#') R('#2bd46b', 150 + li * 7 + rx * 2 - 1, 25 + ry, 2, 1); })));
      // hutnik i górnik na dachu
      [[102, '#1b4f8a'], [210, '#8e1a26']].forEach(([x, col], i) => {
        R('#0b0f0c', x, 18, 8, 14); R(col, x + 1, 22, 6, 9); R('#b8a27a', x + 2, 19, 4, 3);
        R('#b8a27a', i ? x + 6 : x - 2, 14 + (i ? 1 : 0), 2, 9); // młot / kilof uniesiony
        R('#ffc21a', i ? x + 5 : x - 3, 13, 4, 2);
      });
      // kolumny portyku
      for (let k = 0; k < 6; k++) { R('#0b0f0c', 138 + k * 8, 36, 4, 38); R('#a9b7ae', 139 + k * 8, 36, 2, 38); }
      R('#0b0f0c', 134, 34, 52, 3);
      // okna skrzydeł
      let wi = 0;
      for (const bx of [100, 188]) for (let row = 0; row < 3; row++) for (let col = 0; col < 4; col++) {
        const on = lit[wi++ % lit.length];
        R('#0b0f0c', bx + col * 8, 38 + row * 12, 6, 8);
        R(on ? ((wi + Math.floor(t * 0.3)) % 9 === 0 ? '#ffe9a0' : '#ffc21a') : '#1d2a33', bx + 1 + col * 8, 39 + row * 12, 4, 6);
      }
      R('#0b0f0c', 154, 64, 12, 16); R(sx > 148 && sx < 168 ? '#ffe9a0' : '#6b4424', 155, 65, 10, 15);
      // huta: hala, komin, dym, blask, iskry
      R('#0b0f0c', 232, 50, 50, 30); R('#2a2f33', 234, 52, 46, 28);
      R('#0b0f0c', 286, 20, 12, 60); R('#4a3a36', 288, 22, 8, 58);
      for (let k = 0; k < 4; k++) R(k % 2 ? '#e0303c' : '#f2ecd9', 288, 24 + k * 4, 8, 2);
      const glow = 0.6 + Math.sin(t * 7) * 0.25 + Math.sin(t * 13) * 0.1;
      c.fillStyle = `rgba(255,122,26,${glow.toFixed(2)})`; c.fillRect(242, 62, 22, 18);
      R('#ffd23a', 248, 70, 10, 10);
      for (const p of smoke) { c.fillStyle = `rgba(120,130,140,${(0.45 * p.a).toFixed(2)})`; c.fillRect(p.x | 0, p.y | 0, p.s, p.s); }
      for (const p of sparks) R(p.l > 0.5 ? '#ffd23a' : '#ff7a1a', p.x, p.y, 1, 1);
      // ulica i latarnie
      R('#0b0f0c', 0, 80, W, 16); R('#1c2622', 0, 81, W, 3); R('#141b18', 0, 84, W, 12);
      for (let k = 0; k < 6; k++) R('#2b3833', k * 56 + 8, 89, 20, 2);
      [40, 230].forEach(x => { R('#0b0f0c', x, 56, 2, 25); R('#ffe9a0', x - 2, 54, 6, 3); c.fillStyle = 'rgba(255,233,160,.08)'; c.fillRect(x - 10, 57, 22, 24); });
      // student idący do gmachu
      const step = Math.floor(t * 6) % 2;
      if (sx < 156) SPR.draw(c, 'student', sx | 0, 67 - step, 1);
      if (cap) { R('#0b0f0c', cap.x | 0, cap.y | 0, 7, 2); R('#ffc21a', (cap.x | 0) + 6, (cap.y | 0) + 1, 1, 3); }
    };
    const step = dt => {
      t += dt;
      sx += dt * 14;
      if (sx > 158) { sx = -12; cap = { x: 160, y: 62, vx: 22, vy: -34 }; }
      if (cap) { cap.x += cap.vx * dt; cap.y += cap.vy * dt; cap.vy += 20 * dt; if (cap.y > 100) cap = null; }
      if (Math.random() < dt * 30) sparks.push({ x: 253, y: 68, vx: (Math.random() - 0.3) * 40, vy: -20 - Math.random() * 40, l: 1 });
      for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.l -= dt * 1.2; }
      while (sparks.length && sparks[0].l <= 0) sparks.shift();
      if (Math.random() < dt * 3) smoke.push({ x: 289 + Math.random() * 4, y: 18, s: 3 + U.ri(0, 3), a: 1 });
      for (const p of smoke) { p.x -= dt * 8; p.y -= dt * 6; p.s += dt * 2; p.a -= dt * 0.25; }
      while (smoke.length && smoke[0].a <= 0) smoke.shift();
    };
    cancelAnimationFrame(this.raf);
    if (reduce) { sx = 60; draw(); return; }
    const loop = now => {
      if (!cv.isConnected) { this.raf = 0; return; }
      step(Math.min(0.05, (now - last) / 1000));
      last = now;
      draw();
      this.raf = requestAnimationFrame(loop);
    };
    draw();
    this.raf = requestAnimationFrame(loop);
  },
};

</script>
<script>/* js/ui.js */
'use strict';
/* Ekrany i nakładki (DOM). */
const UI = {
  cur: 'title',
  init() {
    U.$('#btn-pause').addEventListener('click', () => RUN.pause());
    U.$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') this.closeModal(); });
    document.addEventListener('keydown', e => this.onKey(e, true));
    document.addEventListener('keyup', e => this.onKey(e, false));
    document.addEventListener('pointerdown', () => AUDIO.resume(), { once: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.cur === 'game' && RUN.s && !RUN.s.over && !STAGE.paused) RUN.pause(); });
  },
  /* ---------- klawiatura ---------- */
  KEYMAP: { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'up', Enter: 'enter', NumpadEnter: 'enter' },
  onKey(e, down) {
    const tag = (e.target && e.target.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if (typing) return;
    const modal = !U.$('#modal').hidden;
    const ov = U.$('#overlay');
    if (down && (modal || (this.cur === 'game' && !ov.hidden))) {
      if (e.code === 'Escape') { if (modal) this.closeModal(); else if (this.ovKind === 'pause') RUN.resume(); e.preventDefault(); return; }
      if (e.code === 'Enter' || e.code === 'NumpadEnter' || (e.code === 'Space' && tag !== 'BUTTON')) {
        const root = modal ? U.$('#modal') : ov;
        const b = root.querySelector('[data-primary]:not([disabled])');
        if (b) { e.preventDefault(); b.click(); }
      }
      return;
    }
    if (this.cur !== 'game' || !STAGE.mg) return;
    if (down && (e.code === 'Escape' || e.code === 'KeyP')) { RUN.pause(); e.preventDefault(); return; }
    let k = this.KEYMAP[e.code];
    const dm = /^(Digit|Numpad)(\d)$/.exec(e.code);
    if (dm) k = 'n' + dm[2];
    if (!k) return;
    if ((e.code === 'Space' || k === 'enter') && tag === 'BUTTON') return;
    if (['up', 'left', 'right'].includes(k) || e.code === 'Space') e.preventDefault();
    if (down && e.repeat) return;
    if (!down) { STAGE.mg.key(k, false); return; }
    if (STAGE.canInput()) STAGE.mg.key(k, true);
  },
  /* ---------- nawigacja ---------- */
  show(name) {
    if (this.cur === 'game' && name !== 'game') { STAGE.stop(); AUDIO.stopMusic(); this.overlay(null); }
    document.querySelectorAll('.screen').forEach(s => { s.hidden = s.id !== 'scr-' + name; });
    this.cur = name;
    const el = U.$('#scr-' + name);
    if (el && name !== 'game') el.scrollTop = 0;
    window.scrollTo(0, 0);
  },
  stars(L, cls = '') {
    return U.el('span', { class: 'stars ' + cls, title: `Poziom ${L}/5 – ${CH.LEVEL_NAMES[L]}`, 'aria-label': `Poziom ${L} z 5` }, ...[1, 2, 3, 4, 5].map(i => U.el('i', { class: i <= L ? 'on' : '' })));
  },
  lvlClass: L => 'lv' + L,
  qTag: q => `P${String(q.id).padStart(2, '0')}`,
  btn(label, onclick, cls = '', attrs = {}) {
    const b = U.el('button', Object.assign({ class: 'btn ' + cls, type: 'button' }, attrs), label);
    b.addEventListener('click', e => { AUDIO.resume(); AUDIO.play('click'); onclick(e); });
    return b;
  },
  examDays() {
    const exam = new Date(2026, 8, 28);
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const d = Math.round((exam - now) / 86400000);
    if (d === 1) return 'Obrona: jutro (28.09.2026)';
    if (d === 0) return 'Obrona: dziś! Powodzenia!';
    if (d < 0) return 'Po obronie – gratulacje, Magistrze!';
    return `Obrona za ${d} ${U.pl(d, 'dzień', 'dni', 'dni')} (28.09.2026)`;
  },
  /* ---------- ekran tytułowy ---------- */
  title() {
    const el = U.$('#scr-title');
    el.innerHTML = '';
    const S = STORE;
    const grid = U.el('div', { class: 'mgrid', role: 'list' });
    for (const w of WORLDS) {
      for (const q of QUESTIONS.filter(q => q.w === w.id)) {
        const L = S.q(q.id).L;
        const cell = U.el('button', { class: 'mcell ' + this.lvlClass(L), type: 'button', role: 'listitem', title: `${this.qTag(q)} ${q.t} – ${CH.LEVEL_NAMES[L]}`, style: { '--wc': w.color } }, String(q.id));
        cell.addEventListener('click', () => this.qModal(q));
        grid.append(cell);
      }
    }
    const weakest = WORLDS.map(w => ({ w, p: S.worldPct(w.id) })).sort((a, b) => a.p - b.p)[0];
    const scene = U.el('canvas', { class: 'title-scene', width: 320, height: 96, 'aria-hidden': 'true' });
    const hero = U.el('div', { class: 'hero' },
      scene,
      U.el('div', { class: 'logo' }, U.el('span', { class: 'l1' }, 'MAGISTERKA'), U.el('span', { class: 'l2' }, 'THE GAME')),
      U.el('div', { class: 'hero-row' },
        U.el('div', { class: 'avatar' }, SPR.img('student', 6, 'bob')),
        U.el('div', { class: 'hero-stats' },
          U.el('div', { class: 'exam' }, this.examDays()),
          U.el('div', { class: 'rank' }, S.rank()),
          U.el('div', { class: 'pbar', 'aria-label': `Postęp ${S.percent()}%` }, U.el('i', { style: { width: S.percent() + '%' } })),
          U.el('div', { class: 'pline' }, `Opanowane ${S.mastered()}/40 · postęp ${S.percent()}% · rekord ${U.fmt(S.data.best.marathon)}`))));
    const menu = U.el('div', { class: 'menu' },
      this.btn(U.el('span', {}, U.el('b', {}, '▶ MARATON'), U.el('small', {}, 'Gra sama dobiera zagadnienia – od najsłabszych')), () => RUN.start({ mode: 'marathon', pool: QUESTIONS }), 'primary big', { 'data-primary': '' }),
      this.btn(U.el('span', {}, U.el('b', {}, '▶ TRENING ODPOWIEDZI'), U.el('small', {}, 'Mównica, luki, łowca błędów, dopytki – uczysz się mówić jak na obronie')), () => RUN.start({ mode: 'answers', pool: QUESTIONS }), 'answer big'),
      this.btn(U.el('span', {}, U.el('b', {}, 'MAPA ŚWIATÓW'), U.el('small', {}, '8 światów tematycznych + bossowie')), () => this.map(), 'big'),
      this.btn(U.el('span', {}, U.el('b', {}, 'SYMULATOR OBRONY'), U.el('small', {}, 'Losujesz pytanie, mówisz na głos wg planu, komisja dopytuje, dostajesz ocenę')), () => this.defense(), 'big'),
      this.btn(U.el('span', {}, U.el('b', {}, 'EGZAMIN KOŃCOWY'), U.el('small', {}, `12 losowych pytań, 3 życia · rekord ${U.fmt(S.data.best.final)}`)), () => RUN.start({ mode: 'final', pool: QUESTIONS }), 'big'),
      this.btn(U.el('span', {}, U.el('b', {}, 'KOMPENDIUM'), U.el('small', {}, 'Minimum, rozszerzenie i haczyki do 40 pytań')), () => this.book(), 'big'));
    el.append(
      hero,
      U.el('div', { class: 'card' },
        U.el('div', { class: 'card-h' }, U.el('h3', {}, 'Mapa opanowania · 40 zagadnień'), U.el('span', { class: 'legend-lv' }, ...[0, 1, 2, 3, 4, 5].map(L => U.el('span', { class: 'lvdot ' + this.lvlClass(L) }, CH.LEVEL_NAMES[L])))),
        grid,
        U.el('p', { class: 'tip' }, `Najsłabiej: ${weakest.w.name} (${weakest.p}%). Każde pytanie przechodzi 5 poziomów – każdy kolejny to trudniejsza minigra.`)),
      menu,
      U.el('div', { class: 'foot' },
        this.btn('Ustawienia', () => this.settings(), 'ghost'),
        this.btn('Jak grać?', () => this.help(), 'ghost')),
    );
    this.show('title');
    SCENE.title(scene);
  },
  /* ---------- mapa światów ---------- */
  map() {
    const el = U.$('#scr-map');
    el.innerHTML = '';
    const tiles = U.el('div', { class: 'worlds' });
    for (const w of WORLDS) {
      const qs = QUESTIONS.filter(q => q.w === w.id);
      const pct = STORE.worldPct(w.id);
      const t = U.el('button', { class: 'wtile', type: 'button', style: { '--wc': w.color } },
        U.el('div', { class: 'wt-top' }, SPR.img(w.icon, 4), STORE.data.boss[w.id] ? U.el('span', { class: 'crown', title: 'Boss pokonany' }, '♛') : null),
        U.el('div', { class: 'wt-name' }, `${w.id + 1}. ${w.name}`),
        U.el('div', { class: 'wt-range' }, `P${String(qs[0].id).padStart(2, '0')}–P${String(qs[qs.length - 1].id).padStart(2, '0')} · ${pct}%`),
        U.el('div', { class: 'wt-dots' }, ...qs.map(q => U.el('i', { class: this.lvlClass(STORE.q(q.id).L) }))));
      t.addEventListener('click', () => { AUDIO.play('click'); this.world(w.id); });
      tiles.append(t);
    }
    el.append(
      U.el('div', { class: 'topbar' }, this.btn('◀ Menu', () => this.title(), 'ghost'), U.el('h2', {}, 'Mapa światów')),
      tiles);
    this.show('map');
  },
  world(wid) {
    const w = WORLDS[wid];
    const qs = QUESTIONS.filter(q => q.w === wid);
    const el = U.$('#scr-world');
    el.innerHTML = '';

    for (const q of qs) {
      const L = STORE.q(q.id).L;
      list.append(U.el('div', { class: 'qrow ' + this.lvlClass(L) },
        U.el('button', { class: 'qrow-main', type: 'button', onclick: () => this.qModal(q) }, U.el('b', {}, this.qTag(q)), U.el('span', {}, q.t)),
        this.stars(L),
        this.btn('Ćwicz', () => RUN.start({ mode: 'focus', pool: [q], title: `Trening ${this.qTag(q)}` }), 'sm')));
    }
    const bossReady = qs.every(q => STORE.q(q.id).seen);
    el.append(
      U.el('div', { class: 'topbar' }, this.btn('◀ Mapa', () => this.map(), 'ghost'), U.el('h2', {}, w.name)),
      U.el('div', { class: 'whead', style: { '--wc': w.color } }, SPR.img(w.icon, 5), U.el('div', {}, U.el('p', {}, w.desc), U.el('div', { class: 'pbar' }, U.el('i', { style: { width: STORE.worldPct(wid) + '%' } })))),
      U.el('div', { class: 'menu row' },
        this.btn('▶ GRAJ ŚWIAT', () => RUN.start({ mode: 'world', pool: qs, title: w.name }), 'primary', { 'data-primary': '' }),

  /* ---------- nakładki w grze ---------- */
  overlay(node, kind) {

  /* Blok pytania: zakładki Jak odpowiedzieć / Minimum / Rozszerzenie / Dopytki */
  qBlock(q, opts = {}) {

    const head = [U.el('div', { class: 'qb-tag', style: { '--wc': w.color } }, `${this.qTag(q)} · ${w.name}`), U.el('h3', { class: 'qb-q' }, q.q)];
    if (opts.hideAnswer) return U.el('div', { class: 'qblock' }, ...head);
    const tabs = [

        Room.answer(q),
        U.el('div', { class: 'hook' }, U.el('b', {}, 'HACZYK: '), q.m),
        U.el('div', { class: 'ov-actions left' }, this.btn('Ćwicz na pamięć ▶', () => this.rehearse(q), 'sm answer')))],

      ['ext', 'Rozszerzenie', () => U.el('div', { class: 'tabp' }, U.el('div', { class: 'rich', html: U.richText(q.x) }))],
      ['fu', `Dopytki (${q.fu.length})`, () => U.el('div', { class: 'tabp' }, U.el('p', { class: 'tip' }, 'Pytania, które komisja może zadać po Twojej odpowiedzi:'),

  planEl(q, cues = true) {

  },
  /* Trening na pamięć: tekst znika stopniowo, a Ty mówisz na głos */
  rehearse(q, lvl = 0) {
    const tips = ['Przeczytaj odpowiedź na głos, spokojnie, jak przed komisją.', 'Pojęcia zniknęły – powiedz na głos, uzupełniając je z pamięci.', 'Zostały pierwsze litery części słów – mów płynnie.', 'Tylko pierwsze litery – powiedz całość.', 'Tylko plan – powiedz całą odpowiedź z pamięci.'];
    const mask = (t, L) => {

      U.el('details', { class: 'ext' }, U.el('summary', {}, `Pojęcia i definicje (${q.f.length})`), U.el('dl', { class: 'facts' }, ...q.f.flatMap(([t, d]) => [U.el('dt', {}, t), U.el('dd', {}, d)]))),
      this.btn('Na pamięć', () => this.rehearse(q), 'answer'),
      this.btn('▶ Ćwicz to pytanie', () => RUN.start({ mode: 'focus', pool: [q], title: `Trening ${this.qTag(q)}` }), 'primary'));
  },
};

<script>/* js/defense.js */
'use strict';
/* SYMULATOR OBRONY 2.0 – losowanie, odpowiedź na głos wg planu, porównanie ze wzorcem zdanie po zdaniu,
   pytanie dodatkowe komisji, ocena 2–5 i zmiana poziomu opanowania. */
const DEF = {
  timer: null,
  room: null,
  raf: 0,
  grade(p) { return p >= 0.9 ? 5 : p >= 0.8 ? 4.5 : p >= 0.7 ? 4 : p >= 0.6 ? 3.5 : p >= 0.5 ? 3 : 2; },
  fmtGrade: g => g.toFixed(1).replace('.', ','),
  fmtTime: sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`,
  stopTimer() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.mic.stop();
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = 0; }
    this.room = null;
  },
  /* scenka z komisją animowana poza pętlą gry */
  scene(parent, opts) {
    this.room = new Room(parent, opts);
    let last = performance.now();
    const loop = now => {
      if (!this.room || !this.room.el.isConnected) { this.raf = 0; return; }
      this.room.update(Math.min(0.05, (now - last) / 1000));
      last = now;
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
    return this.room;
  },
};

UI.defense = function () {
  DEF.stopTimer();
  const el = U.$('#scr-defense');
  el.innerHTML = '';
  let n = 3, picked = new Set();
  const grid = U.el('div', { class: 'mgrid pick' });
  for (const q of QUESTIONS) {
    const b = U.el('button', { class: 'mcell ' + this.lvlClass(STORE.q(q.id).L), type: 'button', title: `${this.qTag(q)} ${q.t}`, style: { '--wc': WORLDS[q.w].color } }, String(q.id));
    b.addEventListener('click', () => { if (picked.has(q)) picked.delete(q); else picked.add(q); b.classList.toggle('sel', picked.has(q)); AUDIO.play('click'); });
    grid.append(b);
  }
  const nBtns = U.el('div', { class: 'ov-actions' }, ...[1, 3, 5].map(k => {
    const b = this.btn(`${k} ${U.pl(k, 'pytanie', 'pytania', 'pytań')}`, () => { n = k; nBtns.querySelectorAll('.btn').forEach(x => x.classList.remove('on')); b.classList.add('on'); }, 'sm' + (k === 3 ? ' on' : ''));
    return b;
  }));
  const start = list => { if (list.length) DEF.run(list, 0, []); };
  el.append(
    U.el('div', { class: 'topbar' }, this.btn('◀ Menu', () => this.title(), 'ghost'), U.el('h2', {}, 'Symulator obrony')),
    U.el('div', { class: 'card def-intro' },
      U.el('div', { class: 'kom-head' }, U.el('div', { class: 'profs' },
        SPR.img('prof', 4, '', { l: '#b8c4bc', B: '#1b4f8a' }), SPR.img('prof', 4, '', { l: '#4a2c18', B: '#8e1a26' }), SPR.img('prof', 4, '', { l: '#f2ecd9', B: '#138a45' })),
        U.el('div', { class: 'bubble' }, 'Proszę losować.')),
      U.el('p', {}, 'Tak jak na egzaminie: komisja losuje pytanie, a Ty odpowiadasz na głos (ok. 1–2 minuty). Potem porównujesz się ze wzorcową odpowiedzią zdanie po zdaniu, a komisja zadaje pytanie dodatkowe. Wynik to ocena i zmiana poziomu opanowania.'),
      U.el('ol', { class: 'plan-steps' },
        U.el('li', {}, U.el('b', {}, 'Definicja'), ' – jedno zdanie: „X to…”.'),
        U.el('li', {}, U.el('b', {}, 'Wyliczenie'), ' – „Wyróżniamy… / składa się z…”.'),
        U.el('li', {}, U.el('b', {}, 'Rozwinięcie'), ' – najważniejszy element lub mechanizm.'),
        U.el('li', {}, U.el('b', {}, 'Przykład'), ' – z praktyki, z zakładu, z liczbą.'),
        U.el('li', {}, U.el('b', {}, 'Domknięcie'), ' – po co to jest, wniosek.')),
      U.el('p', { class: 'tip' }, 'Podpowiedź z planem kosztuje punkty – jak na prawdziwej obronie, gdzie promotor musi Cię naprowadzać.'),
      nBtns,
      U.el('div', { class: 'menu row' },
        this.btn('LOSUJ (jak na egzaminie)', () => start(U.sample(QUESTIONS, n)), 'primary', { 'data-primary': '' }),
        this.btn('LOSUJ Z NAJSŁABSZYCH', () => start(U.shuffle(QUESTIONS).sort((a, b) => STORE.q(a.id).L - STORE.q(b.id).L).slice(0, n)), 'boss'))),
    U.el('div', { class: 'card' },
      U.el('h3', {}, 'Albo wybierz konkretne pytania'),
      grid,
      U.el('div', { class: 'ov-actions' }, this.btn('Start z wybranymi', () => start(U.shuffle([...picked])), ''))));
  this.show('defense');
};

/* Rozpoznawanie mowy (Chrome/Edge/Android): gra słucha odpowiedzi i sprawdza, które pojęcia kluczowe padły. */
DEF.mic = {
  rec: null, on: false, text: '', interim: '',
  api() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; },
  start(onUpd, onErr) {
    const API = this.api();
    if (!API) return onErr('Ta przeglądarka nie obsługuje rozpoznawania mowy.');
    this.stop();
    this.text = ''; this.interim = ''; this.on = true;
    const rec = this.rec = new API();
    rec.lang = 'pl-PL'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      let tmp = '';
      for (let k = e.resultIndex; k < e.results.length; k++) {
        const r = e.results[k];
        if (r.isFinal) this.text += ' ' + r[0].transcript; else tmp += ' ' + r[0].transcript;
      }
      this.interim = tmp;
      onUpd();
    };
    rec.onerror = e => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      this.on = false;
      onErr(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Brak dostępu do mikrofonu – oceń się ręcznie.' : 'Rozpoznawanie mowy przerwane (' + e.error + ').');
    };
    rec.onend = () => { if (this.on && this.rec === rec) { try { rec.start(); } catch (err) { this.on = false; } } };
    try { rec.start(); } catch (err) { this.on = false; onErr('Nie udało się włączyć mikrofonu.'); }
  },
  stop() {
    this.on = false;
    if (this.rec) { try { this.rec.stop(); } catch (e) { /* już zatrzymane */ } this.rec = null; }
  },
  all() { return (this.text + ' ' + this.interim).trim(); },
};
DEF.fold = s => U.norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l');
/* czy pojęcie padło w wypowiedzi: dopasowanie rdzeni słów (odmiana przez przypadki) */
DEF.heard = function (term, folded) {
  const words = DEF.fold(term).split(' ').filter(w => w.length >= 3 || /\d/.test(w));
  if (!words.length) return false;
  const txt = ' ' + folded + ' ';
  const hit = words.filter(w => /\d/.test(w) ? txt.includes(w) : txt.includes(' ' + w.slice(0, w.length <= 4 ? w.length : Math.max(4, Math.ceil(w.length * 0.7))))).length;
  return hit >= Math.ceil(words.length * 0.6);
};

DEF.run = function (list, i, results) {
  DEF.stopTimer();
  const q = list[i];
  const el = U.$('#scr-defense');
  el.innerHTML = '';
  let sec = 0, hint = 0;
  const clock = U.el('div', { class: 'clock' }, '0:00');
  const target = U.el('div', { class: 'clock-t' }, 'cel: 1:00–2:30');
  DEF.timer = setInterval(() => {
    sec++;
    clock.textContent = DEF.fmtTime(sec);
    clock.classList.toggle('ok', sec >= 60 && sec <= 150);
    clock.classList.toggle('warn', sec > 150);
    if (sec === 45 && DEF.room) DEF.room.say('Mhm… proszę kontynuować.');
    if (sec === 150 && DEF.room) DEF.room.say('Proszę powoli zmierzać do konkluzji.');
  }, 1000);
  const hintBox = U.el('div', { class: 'def-hint' });
  const hintBtn = UI.btn('Podpowiedź: plan (−5%)', () => {
    hint++;
    hintBox.innerHTML = '';
    hintBox.append(UI.planEl(q, hint >= 2));
    if (DEF.room) DEF.room.set(-0.08, hint >= 2 ? 'Naprowadzę Pana/Panią słowami kluczowymi…' : 'Proszę zacząć od definicji, potem wyliczenie.');
    if (hint >= 2) hintBtn.remove(); else hintBtn.textContent = 'Podpowiedź: pojęcia (−10%)';
    AUDIO.play('click');
  }, 'ghost sm hint-btn');
  const terms = CH.boldTerms(q);
  const live = U.el('div', { class: 'mic-live', hidden: true }, U.el('div', { class: 'mic-n' }), U.el('div', { class: 'mic-t' }));
  const updLive = () => {
    const f = DEF.fold(DEF.mic.all());
    const n = terms.filter(t => DEF.heard(t, f)).length;
    live.firstChild.textContent = `🎤 Słucham… pojęcia kluczowe: ${n}/${terms.length}`;
    live.lastChild.textContent = DEF.mic.all().slice(-160) || '(mów wyraźnie, pełnymi zdaniami)';
    if (DEF.room && n && n % 4 === 0 && n !== live._n) { live._n = n; DEF.room.set(0.06, U.pick(['Mhm, dobrze.', 'Tak…', 'Słuchamy dalej.'])); }
  };
  let micBtn = null;
  if (DEF.mic.api()) {
    micBtn = UI.btn('🎤 Słuchaj mnie', () => {
      if (DEF.mic.on) { DEF.mic.stop(); micBtn.textContent = '🎤 Słuchaj mnie'; micBtn.classList.remove('on'); return; }
      live.hidden = false;
      micBtn.textContent = '■ Zatrzymaj'; micBtn.classList.add('on');
      DEF.mic.start(updLive, msg => { live.hidden = false; live.lastChild.textContent = msg; micBtn.textContent = '🎤 Słuchaj mnie'; micBtn.classList.remove('on'); });
      updLive();
    }, 'answer sm');
  }
  const reveal = UI.btn('SKOŃCZYŁEM – PORÓWNAJ ZE WZORCEM ▶', () => DEF.reveal(list, i, results, sec, hint, DEF.mic.all()), 'primary', { 'data-primary': '' });
  const card = U.el('div', { class: 'card def-q' });
  el.append(
    U.el('div', { class: 'topbar' }, UI.btn('✕ Przerwij', () => UI.defense(), 'ghost'), U.el('h2', {}, `Pytanie ${i + 1}/${list.length}`)),
    card);
  DEF.scene(card, { say: U.pick(['Proszę, słuchamy.', 'Zapraszamy do odpowiedzi.', 'Proszę spokojnie zacząć.']) });
  card.append(
    U.el('div', { class: 'qb-tag', style: { '--wc': WORLDS[q.w].color } }, `${UI.qTag(q)} · ${WORLDS[q.w].name}`),
    U.el('h3', { class: 'def-question' }, q.q),
    U.el('div', { class: 'clock-row' }, clock, target),
    U.el('p', { class: 'tip' }, 'Mów na głos, pełnymi zdaniami. Definicja → wyliczenie → rozwinięcie → przykład → domknięcie. Nie podglądaj!'),
    hintBox,
    live,
    U.el('div', { class: 'ov-actions' }, micBtn, hintBtn, reveal),
    micBtn ? U.el('p', { class: 'tip' }, 'Mikrofon (opcjonalnie): gra rozpozna, które pojęcia kluczowe padły, i sama zaznaczy zdania wzorca. Działa w Chrome/Edge, wymaga zgody na mikrofon.') : null);
  UI.show('defense');
};

DEF.hintCost = h => (h >= 1 ? 0.05 : 0) + (h >= 2 ? 0.1 : 0);

DEF.reveal = function (list, i, results, sec, hint, said) {
  DEF.stopTimer();
  const q = list[i];
  const folded = said ? DEF.fold(said) : '';
  const el = U.$('#scr-defense');
  el.innerHTML = '';
  let heardAll = 0, termsAll = 0;
  const checks = q.say.map(([r, t], j) => {
    const id = `ds-${q.id}-${j}`;
    const cb = U.el('input', { type: 'checkbox', id });
    let html = U.md(t);
    if (said) {
      const ps = CH.parseBold(t);
      const bs = ps.filter(p => p.k === 'b');
      const hs = bs.filter(p => DEF.heard(p.t, folded));
      heardAll += hs.length; termsAll += bs.length;
      html = ps.map(p => p.k === 'b' ? `<b class="${hs.includes(p) ? 'heard' : 'unheard'}">${U.esc(p.t)}</b>` : U.esc(p.t)).join('');
      if (bs.length && hs.length / bs.length >= 0.5) cb.checked = true;
    }
    const row = U.el('label', { class: 'dk ds say-' + r, for: id }, cb, U.el('span', { class: 'role role-' + r }, CH.ROLE_NAME[r]), U.el('span', { class: 'say-t', html }));
    return { cb, row, w: r === 'def' ? 1.5 : 1 };
  });
  const cov = () => { const all = checks.reduce((s, c) => s + c.w, 0); return checks.reduce((s, c) => s + (c.cb.checked ? c.w : 0), 0) / all; };
  const meter = U.el('div', { class: 'cov' }, U.el('span', {}, 'Pokrycie wzorca: 0%'), U.el('div', { class: 'pbar' }, U.el('i', { style: { width: '0%' } })));
  const upd = () => { const p = Math.round(cov() * 100); meter.firstChild.textContent = `Pokrycie wzorca: ${p}%`; meter.querySelector('i').style.width = p + '%'; };
  checks.forEach(c => c.cb.addEventListener('change', () => { upd(); AUDIO.play('tick'); }));
  upd();
  const timeNote = sec < 40 ? 'Za krótko – na obronie rozwiń odpowiedź do ok. 1,5 minuty (dodaj przykład i domknięcie).'
    : sec > 180 ? 'Za długo – komisja przerwie. Trzymaj się planu i mów konkretnie.' : 'Dobry czas odpowiedzi.';
  const next = UI.btn('DALEJ: PYTANIE DODATKOWE ▶', () => {
    const c = cov();
    if (!q.fu.length) return DEF.score(list, i, results, { sec, hint, cov: c, fu: 1 });
    DEF.followUp(list, i, results, { sec, hint, cov: c });
  }, 'primary', { 'data-primary': '' });
  el.append(
    U.el('div', { class: 'topbar' }, UI.btn('✕ Przerwij', () => UI.defense(), 'ghost'), U.el('h2', {}, `Pytanie ${i + 1}/${list.length} · ${DEF.fmtTime(sec)}`)),
    U.el('div', { class: 'card' },
      U.el('div', { class: 'qb-tag', style: { '--wc': WORLDS[q.w].color } }, `${UI.qTag(q)} · ${WORLDS[q.w].name}`),
      U.el('h3', { class: 'qb-q' }, q.q),
      U.el('h3', {}, 'Które zdania wzorca powiedziałeś/aś (sensem, nie słowo w słowo)?'),
      said ? U.el('p', { class: 'tip mic-sum' }, `Mikrofon: padło ${heardAll}/${termsAll} pojęć kluczowych (na zielono; na czerwono – pominięte). Zdania z większością pojęć są już zaznaczone – popraw, jeśli trzeba.`) : null,
      U.el('div', { class: 'dks say-check' }, ...checks.map(c => c.row)),
      meter,
      U.el('p', { class: 'tip' }, `Czas: ${DEF.fmtTime(sec)}. ${timeNote}${hint ? ` Podpowiedź: −${Math.round(DEF.hintCost(hint) * 100)}%.` : ''}`),
      U.el('div', { class: 'hook' }, U.el('b', {}, 'HACZYK: '), q.m),
      U.el('div', { class: 'ov-actions' }, UI.btn('Zaznacz wszystko', () => { checks.forEach(c => { c.cb.checked = true; }); upd(); }, 'ghost sm'), next)),
    said ? U.el('details', { class: 'ext card' }, U.el('summary', {}, 'Co usłyszała gra (transkrypcja)'), U.el('p', {}, said)) : null,
    U.el('details', { class: 'ext card' }, U.el('summary', {}, 'Minimum i pełny materiał'), U.el('div', { class: 'rich', html: U.richText(q.a) }), U.el('div', { class: 'rich', html: U.richText(q.x) })));
  UI.show('defense');
};

DEF.followUp = function (list, i, results, st) {
  DEF.stopTimer();
  const q = list[i];
  const el = U.$('#scr-defense');
  el.innerHTML = '';
  const seen = STORE.data.fuSeen || (STORE.data.fuSeen = {});
  const idx = q.fu.map((f, j) => j).sort((a, b) => (seen[q.id + ':' + a] || 0) - (seen[q.id + ':' + b] || 0) || Math.random() - 0.5)[0];
  seen[q.id + ':' + idx] = (seen[q.id + ':' + idx] || 0) + 1;
  STORE.save();
  const [fq, fa] = q.fu[idx];
  const card = U.el('div', { class: 'card def-q' });
  const ans = U.el('div', { class: 'fu-ans', hidden: true }, U.el('div', { class: 'mini-label' }, 'DOBRA ODPOWIEDŹ'), U.el('p', {}, fa));
  const rate = U.el('div', { class: 'ov-actions', hidden: true }, U.el('span', { class: 'lvtxt' }, 'Czy tak odpowiedziałeś/aś?'),
    ...[['TAK', 1, 'primary'], ['CZĘŚCIOWO', 0.5, ''], ['NIE', 0, 'danger']].map(([l, v, c]) => UI.btn(l, () => DEF.score(list, i, results, { ...st, fu: v }), c)));
  const show = UI.btn('POKAŻ ODPOWIEDŹ ▶', () => { ans.hidden = false; rate.hidden = false; show.remove(); rate.querySelector('.btn').focus(); }, 'primary', { 'data-primary': '' });
  el.append(
    U.el('div', { class: 'topbar' }, UI.btn('✕ Przerwij', () => UI.defense(), 'ghost'), U.el('h2', {}, `Pytanie ${i + 1}/${list.length} · dopytka`)),
    card);
  const room = DEF.scene(card, { say: `„${fq}”`, mood: U.clamp(0.25 + st.cov * 0.6, 0, 1) });
  room.pulse = 0.5;
  card.append(
    U.el('div', { class: 'mini-label' }, 'PYTANIE DODATKOWE KOMISJI'),
    U.el('h3', { class: 'def-question' }, fq),
    U.el('p', { class: 'tip' }, 'Odpowiedz na głos 1–2 zdaniami, potem sprawdź.'),
    ans,
    U.el('div', { class: 'ov-actions' }, show),
    rate);
  UI.show('defense');
};

DEF.score = function (list, i, results, st) {
  const q = list[i];
  const p = U.clamp(0.75 * st.cov + 0.25 * st.fu - DEF.hintCost(st.hint), 0, 1);
  const g = DEF.grade(p);
  if (p >= 0.8) STORE.record(q.id, true);
  else if (p < 0.5) STORE.record(q.id, false);
  else STORE.markSeen(q.id);
  STORE.data.stats.defenses++; STORE.save();
  AUDIO.play(g >= 4 ? 'ok' : g >= 3 ? 'coin' : 'bad');
  results.push({ q, p, g, sec: st.sec, cov: st.cov, fu: st.fu, hint: st.hint });
  if (i + 1 < list.length) DEF.run(list, i + 1, results); else DEF.final(list, results);
};

DEF.final = function (list, results) {
  DEF.stopTimer();
  const el = U.$('#scr-defense');
  el.innerHTML = '';
  const avg = results.reduce((s, r) => s + r.g, 0) / results.length;
  const passed = results.every(r => r.g >= 3);
  const verdicts = passed ? ['Komisja gratuluje. Tytuł magistra na horyzoncie!', 'Pewna odpowiedź. Tak trzymać jutro!'] : ['Jeszcze jedno podejście i będzie dobrze.', 'Komisja daje drugą szansę – powtórz słabsze pytania.'];
  const card = U.el('div', { class: 'card' });
  DEF.scene(card, { say: U.pick(verdicts), mood: U.clamp((avg - 2) / 3, 0, 1) });
  card.append(...results.map(r =>
    U.el('div', { class: 'chg def-row ' + (r.g >= 4 ? 'up' : r.g < 3 ? 'down' : '') },
      U.el('b', {}, UI.qTag(r.q)), U.el('span', {}, r.q.t),
      U.el('small', {}, `wzorzec ${Math.round(r.cov * 100)}% · dopytka ${r.fu === 1 ? '✓' : r.fu ? '½' : '✗'}${r.hint ? ' · podp.' : ''} · ${DEF.fmtTime(r.sec)}`),
      U.el('b', { class: 'grade' }, DEF.fmtGrade(r.g)))));
  el.append(
    U.el('div', { class: 'topbar' }, UI.btn('◀ Menu', () => UI.title(), 'ghost'), U.el('h2', {}, 'Werdykt komisji')),
    U.el('div', { class: 'sum-head ' + (passed ? 'good' : '') },
      U.el('h2', {}, passed ? 'ZDANE!' : 'DO POPRAWKI'),
      U.el('div', { class: 'score' }, DEF.fmtGrade(Math.round(avg * 2) / 2))),
    card,
    U.el('div', { class: 'menu row' },
      UI.btn('KOLEJNA KOMISJA', () => UI.defense(), 'primary', { 'data-primary': '' }),
      results.some(r => r.g < 4) ? UI.btn('Ćwicz słabsze w grze', () => { const qs = results.filter(r => r.g < 4).map(r => r.q); RUN.start({ mode: 'answers', pool: qs, cap: qs.length, title: 'Poprawka po obronie' }); }, 'boss') : null,
      results.some(r => r.g < 4) ? UI.btn('Na pamięć: najsłabsze', () => UI.rehearse(results.slice().sort((a, b) => a.g - b.g)[0].q), 'answer') : null));
  UI.show('defense');
};

</script>
<script>/* js/main.js */
'use strict';
/* Start gry. */
(function boot() {
  STORE.load();
  AUDIO.sfxOn = STORE.data.set.sfx;
  AUDIO.musicOn = STORE.data.set.music;
  FONT.use(STORE.data.set.font);
  STAGE.init();
  UI.init();
  UI.title();
  if (document.fonts && document.fonts.load) {
    Promise.all(['12px "Jersey 15"', '12px "Press Start 2P"', '12px "VT323"'].map(f => document.fonts.load(f))).catch(() => {});
  }
  /* Aplikacja na telefon: praca offline, gdy gra jest hostowana (np. GitHub Pages) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  /* Uchwyty do testów automatycznych (nie wpływają na grę). */
